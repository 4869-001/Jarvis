<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>J.A.R.V.I.S. · Desktop Core</title>
<style>
  :root{
    --accent:#ff8c1a;
    --text-dim:rgba(255,196,130,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
  body{
    /* 壁纸模式下背景保持透明，只在球体后面压一层柔和暗晕来保证对比度。
       若你的桌面壁纸很亮、球体发虚，把 --backdrop 的透明度调高即可。 */
    font-family:-apple-system,'Helvetica Neue',sans-serif;
  }
  #core{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;}
  .telemetry, #boot{z-index:3;}

  /* 底部极简遥测。启动完成前不露面——先让 #boot 把那句"我准备好了"说完，
     两者共用同一个锚点（球体光环正下方 33vmin），交接时是同一个位置的淡入淡出，
     不是两个东西各占一块地方。 */
  .telemetry{
    position:fixed;left:50%;top:calc(50% + 33vmin);transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;white-space:nowrap;
    font-family:'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:3px;
    color:var(--text-dim);text-shadow:0 0 12px rgba(255,140,26,.45);
    opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  .telemetry.on{opacity:.85;}
  .telemetry .mark{color:var(--accent);}
  .telemetry .val{color:#ffd9a8;}
  .telemetry .sep{opacity:.35;}
  .telemetry .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 9px var(--accent);animation:blink 3.2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}

  /* 启动进度：宿主按"进程起来→连上大脑→唤醒词就绪"几个真实里程碑推进度，
     不是假的计时器动画。刻意跟球体分开——这是"系统在准备"的读数，不是球体
     本身的一部分，摆在球体正下方的遥测区（跟上面 .telemetry 同一个锚点），
     用一条细进度条而不是套在球体上的圆环，两者不会互相抢视觉重心。
     全英文：LOADING + 百分比，不出现中文。 */
  #boot{
    position:fixed;left:50%;top:calc(50% + 33vmin);transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;transition:opacity .5s ease;
  }
  #boot.done{opacity:0;}
  #boot .label{
    font:11px/1 'SF Mono',Menlo,monospace;letter-spacing:3px;color:var(--text-dim);
    text-shadow:0 0 12px rgba(255,140,26,.45);
  }
  #boot .label b{color:#ffd9a8;font-weight:600;letter-spacing:1px;}
  #boot .bar{
    width:132px;height:2px;border-radius:2px;overflow:hidden;
    background:rgba(255,140,26,.16);
  }
  #boot .bar i{
    display:block;height:100%;width:0%;border-radius:2px;background:var(--accent);
    box-shadow:0 0 8px rgba(255,140,26,.65);transition:width .35s ease;
  }
  /* ── 全息投影 ─────────────────────────────────────────────
     粒子球像一束投射出来的全息影像：球后一团环境光和一小片点阵（只在球周围，
     边缘淡出，不盖住桌面壁纸）、扫描线和缓慢下移的扫描带、边缘的色散重影、
     偶尔一次轻微的信号抖动、外圈一道缓慢转动的细光环。
     尺寸全用 vmin：相机按屏幕短边定距（见 resize() 的 FILL），球的大小就和 vmin 成正比，
     横屏竖屏都对得上。主页的实时演示用的是同一套（scripts/sync-jarvis-orb.py），
     它只额外铺一层整页背景、加一套白天配色。 */
  :root{
    --ambient: radial-gradient(circle at 50% 50%, rgba(255,128,30,.16) 0%, rgba(255,110,20,.05) 32%, transparent 58%);
    --dot:     rgba(255,190,130,.10);
    --field:   radial-gradient(circle, rgba(255,140,40,.07) 0%, transparent 62%);
    --scan:    rgba(255,196,140,.075);
    --band:    rgba(255,196,140,.09);
    --ring:    rgba(255,170,90,.30);
    --fringe-r: rgba(255,70,20,.28);
    --fringe-c: rgba(90,200,255,.07);
    --orb-filter: sepia(.35) saturate(1.35) hue-rotate(-8deg);
    --orb-blend: normal;
    --blend:   screen;
  }
  .holo-bg, .holo{position:fixed;inset:0;overflow:hidden;pointer-events:none;}
  .holo-bg{
    background: radial-gradient(circle, var(--dot) 1px, transparent 1.3px) 0 0 / 22px 22px, var(--ambient);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, #000 22vmin, transparent 46vmin);
  }
  .holo-field{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);
    border-radius:50%;background:var(--field);}
  #core.holo-orb{
    filter: var(--orb-filter) drop-shadow(.16vmin 0 0 var(--fringe-c)) drop-shadow(-.16vmin 0 0 var(--fringe-r));
    mix-blend-mode: var(--orb-blend);
    animation: holo-glitch 11s steps(1) infinite;
  }
  @keyframes holo-glitch{
    0%,100%{transform:none;opacity:1} 47%{transform:translateX(.5vmin) skewX(-1.5deg);opacity:.78}
    47.6%{transform:translateX(-.3vmin);opacity:.95} 48.2%{transform:none;opacity:1}
    82%{opacity:.86} 82.5%{opacity:1}
  }
  .holo-scan{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);
    border-radius:50%;mix-blend-mode:var(--blend);
    background:repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px);
    -webkit-mask-image:radial-gradient(circle, #000 42%, transparent 70%);}
  .holo-scan::after{content:'';position:absolute;left:0;right:0;top:-20%;height:16%;
    background:linear-gradient(to bottom, transparent, var(--band) 45%, var(--band) 55%, transparent);
    animation:holo-sweep 6.5s cubic-bezier(.45,0,.55,1) infinite;}
  @keyframes holo-sweep{from{top:-20%}to{top:104%}}
  .holo-ring{position:absolute;left:50%;top:50%;width:56vmin;height:56vmin;transform:translate(-50%,-50%);border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg, var(--ring) 40deg, transparent 110deg, transparent 200deg, var(--ring) 230deg, transparent 290deg);
    -webkit-mask:radial-gradient(circle, transparent 69.4%, #000 69.8%, #000 70.4%, transparent 70.8%);
    animation:holo-turn 18s linear infinite;}
  @keyframes holo-turn{to{transform:translate(-50%,-50%) rotate(360deg)}}
  /* 省电：去掉每帧都要算的色散滤镜和几条动画，只留静态的扫描线和光环 */
  body.low-power #core.holo-orb{filter:var(--orb-filter);animation:none;}
  body.low-power .holo-scan::after, body.low-power .holo-ring{animation:none;}
  @media (prefers-reduced-motion: reduce){ #core.holo-orb, .holo-scan::after, .holo-ring{animation:none;} }
</style>
</head>
<body>
  <div class="holo-bg"></div>
  <div class="holo"><div class="holo-field"></div></div>
  <canvas id="core" class="holo-orb"></canvas>
  <div class="holo" style="z-index:2"><div class="holo-scan"></div><div class="holo-ring"></div></div>
  <div id="boot">
    <div class="label">LOADING <b id="bootPct">0%</b></div>
    <div class="bar"><i id="bootFill"></i></div>
  </div>
  <div class="telemetry">
    <span class="dot"></span>
    <span class="mark">J.A.R.V.I.S.</span>
    <span class="sep">·</span><span id="tState">ONLINE</span>
    <span class="sep">·</span><span class="val" id="tClock">--:--:--</span>
    <span class="sep">·</span>CPU <span class="val" id="tCpu">--%</span>
  </div>

<script src="three.min.js"></script>
<script>
/* =========================================================
   J.A.R.V.I.S. · 桌面壁纸核心
   与 jarvis-hud.html 中的核心同源，针对常驻桌面做了三点改造：
     1) 全屏画布 + 按屏幕短边自动定距，而非固定方形容器
     2) 限帧渲染；电池供电时降频并卸掉次要层
     3) 窗口被完全遮挡时彻底停帧（由宿主 App 调用 __jarvisSetVisible）
   ========================================================= */
// stateMix 是"交互态强度"，每帧朝目标缓动。
// 刻意不记时间戳：动画时钟 t 在停帧期间会落后于 performance.now()，
// 两者相减求经过时间会在壁纸被遮挡后算出负数，把动效整个反转。
// sCore/sHalo/sPulse/sSpin/sSpeed 是各状态的动效参数，每帧朝目标缓动——
// 光有 stateMix（idle↔活跃）还不够：listening→thinking→speaking 这类"活跃态之间"
// 的切换在对话里最常见，之前这几个参数是 if/else 直接取值，一帧内硬切，
// 视觉上就是"一跳"，这才是"过于突兀"的主因，比呼吸曲线本身的问题更大。
const FX = { pulse: 0, state: 'idle', stateMix: 0, level: 0, levelMix: 0,
             sCore: 0, sHalo: 0, sPulse: 0, sSpin: 0, sSpeed: 0,
             sRippleAmp: 0, sRippleOpacity: 0 };

/* ---------- 功耗档位 ---------- */
const PROFILE = {
  ac:      { fps: 30, density: 1.0 },
  battery: { fps: 15, density: 0.5 }
};
let power = 'ac';
let running = true;

const CORE = (function(){
  const canvas = document.getElementById('core');
  const api = { setPower(){}, setVisible(){}, pulse(){} };
  if (!window.THREE) return api;

  const scene  = new THREE.Scene();
  const FOV    = 30;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);

  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true, powerPreference:'low-power'});
  }catch(e){ return api; }
  renderer.setClearColor(0x000000, 0);

  const root  = new THREE.Group(); scene.add(root);
  const spin  = new THREE.Group(); root.add(spin);
  const shell = new THREE.Group(); spin.add(shell);

  const ADD = THREE.AdditiveBlending;
  const R   = 1.0;

  function radialTex(stops){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64,64,0,64,64,64);
    stops.forEach(s => g.addColorStop(s[0], s[1]));
    x.fillStyle = g; x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = radialTex([
    [0,'rgba(255,255,252,1)'],[0.09,'rgba(255,240,190,.96)'],
    [0.30,'rgba(255,168,60,.52)'],[1,'rgba(255,120,20,0)']
  ]);

  /* =========================================================
     虚空粒子 —— 球只由粒子构成，没有线框、环和"皮"。
     "活"来自四件事，全部在顶点着色器里算，CPU 每帧只改几个 uniform：
       1) 流转：粒子沿球面被一张缓慢流动的噪声场推着走，同时按半径差速自转
          （越靠里转得越快），整体像一团在自己转动的星云；
       2) 微澜：沿法线只有很小的起伏，用来让亮度成片明暗，而不是让外形变软——
          外形大幅变形就是"水母"；
       3) 逸散：一部分粒子从表面升起、飘远、熄灭，再从表面重生，像在缓缓呼出火星；
       4) 呼吸：吸气快、呼气慢、呼完停一拍，半径、亮度、逸散一起涨落。
     ========================================================= */
  const mats = [];
  // Simplex 3D noise —— Ian McEwan / Ashima Arts（MIT）
  const NOISE_GLSL = [
    'vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }',
    'vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }',
    'vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }',
    'vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }',
    'float snoise(vec3 v){',
    '  const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);',
    '  vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx);',
    '  vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g;',
    '  vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);',
    '  vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy;',
    '  i = mod289(i);',
    '  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));',
    '  float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;',
    '  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);',
    '  vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);',
    '  vec4 x = x_ * ns.x + ns.yyyy; vec4 y = y_ * ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);',
    '  vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);',
    '  vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));',
    '  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;',
    '  vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);',
    '  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));',
    '  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;',
    '  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;',
    '  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));',
    '}'].join('\n');

  /* 一种材质管三团粒子（主云 / 内核 / 逸散火星），靠 uniform 区分性格。
     position 存单位方向；半径 = uRadius * aShell。 */
  function voidMat(o){
    const m = new THREE.ShaderMaterial({
      uniforms:{
        uTime:{value:0}, uDist:{value:9}, uScale:{value:500},
        uRadius:{value:o.radius}, uSize:{value:o.size}, uOpacity:{value:o.opacity},
        uAmp:{value:o.amp}, uFreq:{value:o.freq}, uFlow:{value:o.flow}, uSpin:{value:o.spin},
        uBreath:{value:0}, uLevel:{value:0}, uHeat:{value:0}, uBack:{value:o.back == null ? 0.25 : o.back},
        uEmber:{value:o.ember ? 1 : 0}, uRise:{value:o.rise || 0}, uSeedT:{value:o.seedT || 0},
        uDeep:{value:new THREE.Color(o.deep)}, uMid:{value:new THREE.Color(o.mid)}, uHot:{value:new THREE.Color(o.hot)}
      },
      transparent:true, blending:ADD, depthWrite:false,
      vertexShader:[
        'attribute float aSeed; attribute float aShell;',
        'uniform float uTime, uDist, uScale, uRadius, uSize, uAmp, uFreq, uFlow, uSpin, uBreath, uLevel, uHeat, uBack, uEmber, uRise, uSeedT;',
        'uniform vec3 uDeep, uMid, uHot;',
        'varying float vA; varying vec3 vCol;',
        NOISE_GLSL,
        'void main(){',
        '  float t = uTime + uSeedT;',
        '  vec3 n = normalize(position);',
        // 差速自转：越靠里、种子越大转得越快
        '  float ang = t * uSpin * (0.55 + 0.9 * aSeed) / max(aShell, 0.35);',
        '  float ca = cos(ang), sa = sin(ang);',
        '  n = vec3(ca * n.x - sa * n.z, n.y, sa * n.x + ca * n.z);',
        // 流转：沿切向被一张慢慢流动的噪声场推着走
        '  vec3 q = n * 1.3;',
        '  vec3 f = vec3(snoise(q + vec3(t * 0.06, 0.0, 0.0)), snoise(q + vec3(0.0, t * 0.06, 5.2)), snoise(q + vec3(9.1, 0.0, t * 0.06)));',
        '  n = normalize(n + (f - n * dot(f, n)) * uFlow);',
        // 微澜：成片的明暗，外形只动一点点
        '  float wave = snoise(n * uFreq + vec3(0.0, t * 0.11, t * 0.07)) * 0.75 + snoise(n * uFreq * 2.3 - vec3(t * 0.17)) * 0.25;',
        // 声音：从下往上一圈圈推过去的亮环
        '  float lat = acos(clamp(n.y, -1.0, 1.0));',
        '  float ring = pow(0.5 + 0.5 * sin(lat * 8.0 - t * 4.5), 4.0) * uLevel;',
        // 逸散：生命周期 0..1，从表面升起、飘远、熄灭
        '  float life = fract(t * uRise * (0.5 + aSeed) + aSeed * 7.31);',
        '  float shellR = aShell + uEmber * life * 0.62;',
        '  float emberFade = mix(1.0, sin(3.14159 * life), uEmber);',
        '  float r = uRadius * shellR * (1.0 + uBreath) * (1.0 + uAmp * wave + 0.035 * ring);',
        '  vec4 mv = modelViewMatrix * vec4(n * r, 1.0);',
        '  float fade = mix(uBack, 1.0, smoothstep(-0.95, 0.6, mv.z + uDist));',
        '  float crest = clamp(smoothstep(-0.45, 0.8, wave) + ring * 0.7, 0.0, 1.0);',
        '  float tw = 0.8 + 0.2 * sin(t * (0.9 + aSeed * 2.6) + aSeed * 50.0);',
        // 云的厚度方向：贴近表面的最亮，向里向外渐暗——于是有"一团"而不是"一层"
        '  float core = 1.0 - smoothstep(0.0, 0.22, abs(aShell - 1.0)) * (1.0 - uEmber) * 0.55;',
        '  vec3 c = mix(uDeep, uMid, crest);',
        '  vCol = mix(c, uHot, pow(crest, 3.5) * (0.35 + uHeat * 0.5) + uHeat * 0.10);',
        '  vA = fade * tw * emberFade * core * (0.55 + 1.0 * crest);',
        '  gl_PointSize = max(1.2, uSize * (0.5 + 0.9 * aSeed) * (0.8 + 0.5 * crest) * uScale / (-mv.z));',
        '  gl_Position = projectionMatrix * mv;',
        '}'].join('\n'),
      fragmentShader:[
        'uniform float uOpacity; varying float vA; varying vec3 vCol;',
        'void main(){',
        '  float r = length(gl_PointCoord - 0.5) * 2.0;',
        '  float a = smoothstep(1.0, 0.0, r); a *= a;',
        // 亮度放进 alpha：画布透明，暗色片元也会累加 alpha，叠到亮壁纸上会发黑
        '  float m = max(max(vCol.r, vCol.g), vCol.b);',
        '  gl_FragColor = vec4(vCol / max(m, 0.0001), min(1.0, a * vA * uOpacity * m));',
        '}'].join('\n')
    });
    mats.push(m); return m;
  }

  /* 粒子云：斐波那契方向打底（疏密均匀），整体洗牌——任何前缀都是均匀的，
     省电时直接少画一半也不会缺一块。 */
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const gauss = () => { let u = 0; for (let i = 0; i < 4; i++) u += Math.random(); return (u - 2) / 1.15; };
  function cloud(n, shellOf){
    const pos = new Float32Array(n*3), seed = new Float32Array(n), shl = new Float32Array(n);
    const order = new Uint32Array(n);
    for (let i = 0; i < n; i++) order[i] = i;
    for (let i = n-1; i > 0; i--){ const j = (Math.random()*(i+1))|0; const k = order[i]; order[i] = order[j]; order[j] = k; }
    for (let o = 0; o < n; o++){
      const i = order[o];
      const y = 1 - 2*(i + 0.5)/n, rad = Math.sqrt(1 - y*y), th = GOLDEN*i;
      pos[o*3] = Math.cos(th)*rad; pos[o*3+1] = y; pos[o*3+2] = Math.sin(th)*rad;
      seed[o] = Math.random(); shl[o] = shellOf();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSeed',    new THREE.BufferAttribute(seed, 1));
    g.setAttribute('aShell',   new THREE.BufferAttribute(shl, 1));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 2.4);
    return g;
  }

  // 主云：两万颗，半径按高斯分布在表面附近，有厚度
  const CLOUD_N = 20000;
  const cloudMat = voidMat({ radius:R, size:0.062, opacity:1.0, amp:0.028, freq:1.7, flow:0.10, spin:0.05, back:0.20,
                             deep:0xb8440a, mid:0xff8a1e, hot:0xffd9a0 });
  const cloudGeo = cloud(CLOUD_N, () => Math.min(1.16, Math.max(0.74, 1.0 + gauss() * 0.065)));
  const cloudPts = new THREE.Points(cloudGeo, cloudMat);
  shell.add(cloudPts);

  // 内核：小而暖的一团，转得快，透过外云隐约可见
  const NUCLEUS_N = 2400;
  const nucleusMat = voidMat({ radius:R*0.32, size:0.052, opacity:1.0, amp:0.06, freq:1.4, flow:0.14, spin:0.16, back:0.5, seedT:37.0,
                               deep:0xc25010, mid:0xffa640, hot:0xfff0d0 });
  const nucleus = new THREE.Points(cloud(NUCLEUS_N, () => 0.6 + Math.random() * 0.5), nucleusMat);
  root.add(nucleus);

  // 逸散火星：从表面升起、飘远、熄灭
  const EMBER_N = 1400;
  const emberMat = voidMat({ radius:R, size:0.060, opacity:1.0, amp:0.0, freq:1.0, flow:0.18, spin:0.03, back:0.3, ember:true, rise:0.05, seedT:11.0,
                             deep:0xb44a0c, mid:0xffa340, hot:0xfff0cc });
  const embers = new THREE.Points(cloud(EMBER_N, () => 0.98 + Math.random() * 0.06), emberMat);
  shell.add(embers);

  // 光核与体温
  function sprite(scale, color, opacity){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:glowTex, color:color, blending:ADD, depthWrite:false, transparent:true, opacity:opacity
    }));
    sp.scale.set(scale, scale, 1);
    return sp;
  }
  const coreLight = sprite(0.22, 0xffe2b0, 0.55); root.add(coreLight);
  const coreBloom = sprite(1.25, 0xff8a2a, 0.12); root.add(coreBloom);
  const aura      = sprite(3.0,  0xff7a1a, 0.045); root.add(aura);

  // 呼吸：吸气占 38%，呼气占 50%，最后 12% 屏住。返回 0（呼尽）..1（吸满）。
  const BREATH_PERIOD = 5.6;
  const ease = x => x*x*(3 - 2*x);
  function breathAt(time){
    const ph = (time / BREATH_PERIOD) % 1;
    if (ph < 0.38) return ease(ph / 0.38);
    if (ph < 0.88) return 1 - ease((ph - 0.38) / 0.50);
    return 0;
  }
  let lifeT = 0;          // 粒子自己的时钟：活跃时走得快，但永远连续，状态切换不会跳

  /* ---------- 尺寸：按屏幕短边定距，保证球体占比稳定 ---------- */
  const FILL = 0.46;   // 球体（含外缘）占屏幕短边一半的比例
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const halfFov = (FOV * Math.PI / 180) / 2;
    let dist = (R * 1.35) / (FILL * Math.tan(halfFov));   // 1.35：给逸散的火星留出余量
    if (camera.aspect < 1) dist /= camera.aspect;   // 竖屏时按宽度收敛
    camera.position.set(0, 0, dist);
    camera.updateProjectionMatrix();
    mats.forEach(m => {
      m.uniforms.uDist.value = dist;
      if (m.uniforms.uScale) m.uniforms.uScale.value = h * dpr * 0.5;
    });
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---------- 宿主 App 控制接口 ---------- */
  api.setPower = function(p){
    power = (p === 'battery') ? 'battery' : 'ac';
    document.body.classList.toggle('low-power', power === 'battery');
    // 省电：粒子数减半（粒子是洗过牌的，前一半照样铺满整个球）
    const k = PROFILE[power].density;
    cloudGeo.setDrawRange(0, Math.floor(CLOUD_N * k));
    nucleus.geometry.setDrawRange(0, Math.floor(NUCLEUS_N * k));
    embers.geometry.setDrawRange(0, Math.floor(EMBER_N * k));
    document.getElementById('tState').textContent = power === 'battery' ? 'LOW-POWER' : (STATE_LABEL[FX.state] || 'ONLINE');
  };
  api.setVisible = function(v){
    const was = running;
    running = !!v;
    if (running && !was){ last = performance.now(); requestAnimationFrame(animate); }
  };
  // 看门狗：万一 rAF 因为任何原因没能恢复（宿主漏发通知、系统抑制回调等），
  // 这里兜底重启循环，避免壁纸永久卡死在一帧上。setInterval 即使在
  // rAF 被停掉时也仍会触发，所以它是可靠的恢复通道。
  setInterval(() => {
    if (running && performance.now() - lastFrame > 2000){
      last = performance.now();
      requestAnimationFrame(animate);
    }
  }, 2000);
  api.pulse = function(v){ FX.pulse = Math.max(FX.pulse, v == null ? 1 : v); };

  /* ---------- 限帧主循环 ---------- */
  let t = 0, last = performance.now(), acc = 0, lastFrame = performance.now();
  function animate(now){
    lastFrame = now;
    if (!running) return;                       // 被完全遮挡 → 彻底停帧
    requestAnimationFrame(animate);

    const raw = Math.min(0.25, (now - last) / 1000);
    last = now;
    acc += raw;
    const step = 1 / PROFILE[power].fps;
    if (acc < step) return;                     // 限帧
    const dt = Math.min(0.1, acc);
    acc = 0;
    t += dt;

    FX.pulse *= Math.pow(0.93, dt*60);
    const p = FX.pulse;

    // -- 交互状态混合：idle ↔ 活跃，约 1.2s，ease-in-out --
    const st = FX.state || 'idle';
    FX.stateMix += ((st === 'idle' ? 0 : 1) - FX.stateMix) * Math.min(1, dt * 2.2);
    const m0 = FX.stateMix;
    const stMix = m0 < 0.5 ? 4*m0*m0*m0 : 1 - Math.pow(-2*m0 + 2, 3)/2;

    // 各状态的"性格"——目标值，先缓动再用，切换不会一帧硬跳
    //   listening 倾听：云微微收拢、变亮，像凑近了在听
    //   thinking  思考：流转和自转明显加快，色温升高
    //   speaking  说话：亮环跟着真实音量从下往上推，火星逸散得更多
    let tFlow = 0, tSpeed = 0, tHeat = 0, tTight = 0, tRise = 0;
    if (st === 'listening')     { tFlow = 0.02; tSpeed = 0.4; tHeat = 0.20; tTight = 0.035; }
    else if (st === 'thinking') { tFlow = 0.06; tSpeed = 1.8; tHeat = 0.60; tRise = 0.02; }
    else if (st === 'speaking') { tFlow = 0.03; tSpeed = 0.6; tHeat = 0.30; tRise = 0.04; }
    const rate = Math.min(1, dt * 3.0);
    FX.sPulse += (tFlow  - FX.sPulse) * rate;
    FX.sCore  += (tHeat  - FX.sCore)  * rate;
    FX.sSpeed += (tSpeed - FX.sSpeed) * rate;
    FX.sHalo  += (tTight - FX.sHalo)  * rate;
    FX.sSpin  += (tRise  - FX.sSpin)  * rate;

    // 真实音量：起振快、落振慢，说完话不会在一帧里"瘪"下去
    const levelRate = FX.level > FX.levelMix ? dt * 14 : dt * 3.0;
    FX.levelMix += (FX.level - FX.levelMix) * Math.min(1, levelRate);
    const lvl = FX.levelMix * stMix;

    lifeT += dt * (1 + FX.sSpeed + lvl * 0.8 + p * 0.6);

    // 呼吸用真实时间（节律不因"在思考"就乱），活跃时呼吸略浅
    const b = breathAt(t);
    const breath = (b - 0.42) * 0.06 * (1 - stMix * 0.4) - FX.sHalo;

    spin.rotation.y += (0.04 + p*0.2) * dt;
    spin.rotation.x  = 0.32;
    spin.rotation.z  = 0.10;
    nucleus.rotation.y -= 0.12 * dt;
    nucleus.rotation.x += 0.05 * dt;

    for (let i = 0; i < mats.length; i++){
      const u = mats[i].uniforms;
      u.uTime.value = lifeT;
      u.uLevel.value = lvl;
      u.uHeat.value = FX.sCore + lvl*0.25;
    }
    cloudMat.uniforms.uBreath.value  = breath;
    cloudMat.uniforms.uFlow.value    = 0.10 + FX.sPulse;
    cloudMat.uniforms.uOpacity.value = 1.0 + b*0.3 + p*0.15 + lvl*0.25;
    cloudMat.uniforms.uSize.value    = 0.062 * (1 + b*0.10 + lvl*0.25 + p*0.2);

    nucleusMat.uniforms.uBreath.value  = breath*1.3 + lvl*0.15;
    nucleusMat.uniforms.uOpacity.value = 0.95 + b*0.2 + lvl*0.25;

    emberMat.uniforms.uBreath.value  = breath;
    emberMat.uniforms.uRise.value    = 0.045 + b*0.012 + FX.sSpin + lvl*0.03;
    emberMat.uniforms.uOpacity.value = 0.9 + b*0.35 + lvl*0.3;

    coreLight.scale.setScalar(0.20 + b*0.05 + lvl*0.22 + p*0.08);
    coreLight.material.opacity = 0.45 + b*0.15 + lvl*0.2;
    coreBloom.scale.setScalar(1.1 + b*0.22 + lvl*0.6 + p*0.2);
    coreBloom.material.opacity = 0.09 + b*0.06 + lvl*0.14 + p*0.05;
    aura.scale.setScalar(2.8 + b*0.35 + lvl*0.5);
    aura.material.opacity = 0.03 + b*0.035 + lvl*0.04 + p*0.02;

    // -- demo 推进：独立预览时自动循环四种状态 + 模拟音量 --
    // 宿主一旦调用过 __jarvisSetState，hostTookOver 置 true，demo 永久关闭
    if (!hostTookOver){
      demoTimer += dt;
      if (demoTimer >= DEMO_DUR){
        demoTimer = 0;
        demoIdx = (demoIdx + 1) % DEMO_SEQ.length;
        const ns = DEMO_SEQ[demoIdx];
        FX.state = ns; syncTelemetryState(ns);
      }
      const s = FX.state;
      let lv = 0;
      if (s === 'listening')      lv = 0.30 + 0.28 * (0.5+0.5*Math.sin(t*3.1)) * (0.7+0.3*Math.sin(t*11));
      else if (s === 'speaking')   lv = 0.20 + 0.40 * Math.abs(Math.sin(t*4.3));
      else if (s === 'thinking')   lv = 0.10 + 0.10 * Math.abs(Math.sin(t*1.7));
      else                         lv = 0;
      FX.level = lv;
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  setInterval(() => { if (running && FX.pulse < 0.18) FX.pulse = 0.18; }, 5200);
  return api;
})();

/* 宿主在 didFinishNavigation 只知道 DOM/CSS 加载完了，不知道 WebGL 有没有真的
   画出球体——DOM（进度条文字）合成快，canvas 要等 GPU 进程回一趟才合成，
   宿主按前者时机淡入窗口就会看见"进度条先到、球体隔一拍才跟上"。
   两次 rAF 之间浏览器必定已完成一次合成，用这个信号才能保证宿主淡入时
   球体已经真的在屏幕上，跟进度条同时出现。 */
requestAnimationFrame(() => requestAnimationFrame(() => {
  try {
    window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvisSphereReady
      && window.webkit.messageHandlers.jarvisSphereReady.postMessage('ready');
  } catch (e) {}
}));

/* ---------- 宿主 App 调用的全局钩子 ---------- */
window.__jarvisSetPower   = p => CORE.setPower(p);
window.__jarvisSetVisible = v => CORE.setVisible(v);

// 交互动效：四种状态 + 实时音量。宿主根据真实会话注入。
//   idle       待机呼吸（默认）
//   listening  倾听：粒子变大、波纹金、光点中速流动、径向喷射中速
//   thinking   思考：涡旋加速、波纹白热、光点最快、径向喷射最快
//   speaking   说话：辉光增强、波纹暖橙、光点慢、径向喷射少而稳
let hostTookOver = false;
const STATE_LABEL = { idle:'ONLINE', listening:'LISTENING', thinking:'THINKING', speaking:'SPEAKING' };
function syncTelemetryState(s){
  const el = document.getElementById('tState');
  if (el) el.textContent = STATE_LABEL[s] || 'ONLINE';
}
syncTelemetryState('idle');
window.__jarvisSetState  = s => {
  hostTookOver = true;            // 宿主一旦接管，永久关闭 demo
  FX.state = s; syncTelemetryState(s);
};
window.__jarvisSetLevel  = v => { FX.level = Math.max(0, Math.min(1, +v || 0)); };
// 整机 CPU 占用，宿主用 host_statistics 轮询后推过来（见 OrbWindowController）
window.__jarvisSetCPU = pct => {
  const el = document.getElementById('tCpu');
  if (el) el.textContent = Math.round(Math.max(0, Math.min(100, +pct || 0))) + '%';
};

/* 启动进度：宿主按真实里程碑（进程起来/连上大脑/唤醒词就绪……）推百分比，
   只认数字，不接受/不显示宿主传来的任何文案——保证这条动效永远只有
   "LOADING NN%"，不会被谁不小心塞进中文。到 100 就把这条淡出、
   把球体正下方那条遥测信息淡入接管，两者共用同一个锚点，交接不跳位。
   新开的屏幕（接显示器）如果启动早就完成了，宿主会直接重推一次 100，
   不会让新窗口重新播一遍动画。 */
let bootDone = false;
window.__jarvisSetBoot = (pct) => {
  if (bootDone) return;
  pct = Math.max(0, Math.min(100, +pct || 0));
  const fill = document.getElementById('bootFill');
  if (fill) fill.style.width = pct + '%';
  const pctNode = document.getElementById('bootPct');
  if (pctNode) pctNode.textContent = Math.round(pct) + '%';
  if (pct >= 100) {
    bootDone = true;
    const boot = document.getElementById('boot');
    if (boot) {
      boot.classList.add('done');
      setTimeout(() => { boot.style.display = 'none'; }, 600);
    }
    const tel = document.querySelector('.telemetry');
    if (tel) tel.classList.add('on');
  }
};

// 独立预览 demo：宿主没调用 __jarvisSetState 时，自动循环四种状态，
// 让交互动效在浏览器直接打开就能看到。加 ?nodemo=1 可关闭。
const DEMO_SEQ  = ['listening','thinking','speaking','idle'];
const DEMO_DUR  = 4.0;
let demoIdx = 0, demoTimer = 0;
if (new URLSearchParams(location.search).has('nodemo')) hostTookOver = true;

/* ---------- 遥测文字 ---------- */
setInterval(() => {
  if (!running) return;
  const d = new Date();
  document.getElementById('tClock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
}, 1000);
</script>
</body>
