<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>J.A.R.V.I.S. · Desktop Core</title>
<style>
  :root{
    --accent:#ff8c1a;
    --text-dim:rgba(255,196,130,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
  body{
    /* 壁纸模式下背景保持透明，只在球体后面压一层柔和暗晕来保证对比度。
       若你的桌面壁纸很亮、球体发虚，把 --backdrop 的透明度调高即可。 */
    background:radial-gradient(circle at 50% 47%, rgba(4,7,13,.62) 0%, rgba(4,7,13,.34) 34%, transparent 62%);
    font-family:-apple-system,'Helvetica Neue',sans-serif;
  }
  #core{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* 底部极简遥测。启动完成前不露面——先让 #boot 把那句"我准备好了"说完，
     两者共用同一个锚点（球体正下方 23vh），交接时是同一个位置的淡入淡出，
     不是两个东西各占一块地方。 */
  .telemetry{
    position:fixed;left:50%;top:calc(50% + 23vh);transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;white-space:nowrap;
    font-family:'SF Mono',Menlo,monospace;font-size:11px;letter-spacing:3px;
    color:var(--text-dim);text-shadow:0 0 12px rgba(255,140,26,.45);
    opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  .telemetry.on{opacity:.85;}
  .telemetry .mark{color:var(--accent);}
  .telemetry .val{color:#ffd9a8;}
  .telemetry .sep{opacity:.35;}
  .telemetry .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 9px var(--accent);animation:blink 3.2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}

  /* 启动进度：宿主按"进程起来→连上大脑→唤醒词就绪"几个真实里程碑推进度，
     不是假的计时器动画。刻意跟球体分开——这是"系统在准备"的读数，不是球体
     本身的一部分，摆在球体正下方的遥测区（跟上面 .telemetry 同一个锚点），
     用一条细进度条而不是套在球体上的圆环，两者不会互相抢视觉重心。
     全英文：LOADING + 百分比，不出现中文。 */
  #boot{
    position:fixed;left:50%;top:calc(50% + 23vh);transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    pointer-events:none;transition:opacity .5s ease;
  }
  #boot.done{opacity:0;}
  #boot .label{
    font:11px/1 'SF Mono',Menlo,monospace;letter-spacing:3px;color:var(--text-dim);
    text-shadow:0 0 12px rgba(255,140,26,.45);
  }
  #boot .label b{color:#ffd9a8;font-weight:600;letter-spacing:1px;}
  #boot .bar{
    width:132px;height:2px;border-radius:2px;overflow:hidden;
    background:rgba(255,140,26,.16);
  }
  #boot .bar i{
    display:block;height:100%;width:0%;border-radius:2px;background:var(--accent);
    box-shadow:0 0 8px rgba(255,140,26,.65);transition:width .35s ease;
  }
</style>
</head>
<body>
  <canvas id="core"></canvas>
  <div id="boot">
    <div class="label">LOADING <b id="bootPct">0%</b></div>
    <div class="bar"><i id="bootFill"></i></div>
  </div>
  <div class="telemetry">
    <span class="dot"></span>
    <span class="mark">J.A.R.V.I.S.</span>
    <span class="sep">·</span><span id="tState">ONLINE</span>
    <span class="sep">·</span><span class="val" id="tClock">--:--:--</span>
    <span class="sep">·</span>CPU <span class="val" id="tCpu">--%</span>
  </div>

<script src="three.min.js"></script>
<script>
/* =========================================================
   J.A.R.V.I.S. · 桌面壁纸核心
   与 jarvis-hud.html 中的核心同源，针对常驻桌面做了三点改造：
     1) 全屏画布 + 按屏幕短边自动定距，而非固定方形容器
     2) 限帧渲染；电池供电时降频并卸掉次要层
     3) 窗口被完全遮挡时彻底停帧（由宿主 App 调用 __jarvisSetVisible）
   ========================================================= */
// stateMix 是"交互态强度"，每帧朝目标缓动。
// 刻意不记时间戳：动画时钟 t 在停帧期间会落后于 performance.now()，
// 两者相减求经过时间会在壁纸被遮挡后算出负数，把动效整个反转。
// sCore/sHalo/sPulse/sSpin/sSpeed 是各状态的动效参数，每帧朝目标缓动——
// 光有 stateMix（idle↔活跃）还不够：listening→thinking→speaking 这类"活跃态之间"
// 的切换在对话里最常见，之前这几个参数是 if/else 直接取值，一帧内硬切，
// 视觉上就是"一跳"，这才是"过于突兀"的主因，比呼吸曲线本身的问题更大。
const FX = { pulse: 0, state: 'idle', stateMix: 0, level: 0, levelMix: 0,
             sCore: 0, sHalo: 0, sPulse: 0, sSpin: 0, sSpeed: 0,
             sRippleAmp: 0, sRippleOpacity: 0 };

/* ---------- 功耗档位 ---------- */
const PROFILE = {
  ac:      { fps: 30, rim: true,  plates: true  },
  battery: { fps: 15, rim: false, plates: false }
};
let power = 'ac';
let running = true;

const CORE = (function(){
  const canvas = document.getElementById('core');
  const api = { setPower(){}, setVisible(){}, pulse(){} };
  if (!window.THREE) return api;

  const scene  = new THREE.Scene();
  const FOV    = 30;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);

  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true, powerPreference:'low-power'});
  }catch(e){ return api; }
  renderer.setClearColor(0x000000, 0);

  const root  = new THREE.Group(); scene.add(root);
  const spin  = new THREE.Group(); root.add(spin);
  const shell = new THREE.Group(); spin.add(shell);

  const ADD = THREE.AdditiveBlending;
  const R   = 1.0;

  const cHot  = new THREE.Color(0xfff3d0);
  const cGold = new THREE.Color(0xffc46a);
  const cAmb  = new THREE.Color(0xff8a1e);
  const cDeep = new THREE.Color(0xff6a0e);
  const tmp   = new THREE.Color();

  /* 分层渐入渐出的相位映射：把 stateMix 的某段区间映射到 0..1。
     各动效按不同阈值启动（涟漪最先 → 光点 → 波纹 → 喷射粒子），
     形成"波浪式"激活；回到 idle 时反向渐出，不再瞬时消失。 */
  function phaseOf(mix, start, end) {
    return Math.max(0, Math.min(1, (mix - start) / (end - start)));
  }

  function radialTex(stops){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64,64,0,64,64,64);
    stops.forEach(s => g.addColorStop(s[0], s[1]));
    x.fillStyle = g; x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  function gridTex(){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d');
    x.strokeStyle = 'rgba(255,205,130,.85)'; x.lineWidth = 2;
    for (let i = 0; i <= 4; i++){
      const p = i*16;
      x.beginPath(); x.moveTo(p,0); x.lineTo(p,64); x.stroke();
      x.beginPath(); x.moveTo(0,p); x.lineTo(64,p); x.stroke();
    }
    x.fillStyle = 'rgba(255,170,60,.18)'; x.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = radialTex([
    [0,'rgba(255,255,252,1)'],[0.09,'rgba(255,240,190,.96)'],
    [0.30,'rgba(255,168,60,.52)'],[1,'rgba(255,120,20,0)']
  ]);

  const _a = new THREE.Vector3(), _b = new THREE.Vector3();
  function onSphere(out){
    const u = Math.random()*2-1, ph = Math.random()*Math.PI*2;
    const s = Math.sqrt(Math.max(0, 1-u*u));
    return out.set(s*Math.cos(ph), u, s*Math.sin(ph));
  }

  /* 1) 光核 + 辉光 */
  function sprite(scale, color, opacity){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map:glowTex, color:color, blending:ADD, depthWrite:false, transparent:true, opacity:opacity
    }));
    s.scale.set(scale, scale, 1);
    return s;
  }
  const coreLight = sprite(0.42, 0xffffff, 0.85); root.add(coreLight);
  const halo1     = sprite(1.90, 0xffa040, 0.22); root.add(halo1); halo1.visible = false; // 外层辉光关闭（试效果）
  const halo2     = sprite(3.20, 0xff6a10, 0.13); root.add(halo2); halo2.visible = false; // 外层辉光关闭（试效果）

  /* 2) 主粒子壳 */
  const PN = 4500;
  const pPos = new Float32Array(PN*3), pCol = new Float32Array(PN*3);
  for (let i = 0; i < PN; i++){
    onSphere(_a);
    const inner = Math.random() < 0.09;
    const rr = inner ? R*(0.34 + Math.random()*0.52)
                     : R*(0.93 + Math.pow(Math.random(), 2.2)*0.17);
    pPos[i*3] = _a.x*rr; pPos[i*3+1] = _a.y*rr; pPos[i*3+2] = _a.z*rr;
    const k = Math.random();
    tmp.copy(k < 0.14 ? cHot : cGold).lerp(cAmb, Math.random()*0.9);
    if (k > 0.88) tmp.lerp(cDeep, 0.5);
    pCol[i*3] = tmp.r; pCol[i*3+1] = tmp.g; pCol[i*3+2] = tmp.b;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  starGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
  const STAR_BASE = 0.0155;
  const starMat = new THREE.PointsMaterial({
    size:STAR_BASE, map:glowTex, vertexColors:true, transparent:true,
    opacity:0.9, blending:ADD, depthWrite:false, sizeAttenuation:true
  });
  shell.add(new THREE.Points(starGeo, starMat));

  /* 3) 城市灯团 */
  const cityMat = new THREE.PointsMaterial({
    size:0.030, map:glowTex, vertexColors:true, transparent:true,
    opacity:0.9, blending:ADD, depthWrite:false, sizeAttenuation:true
  });
  (function cityLights(){
    const CLUSTERS = 66, PER = 26, N = CLUSTERS*PER;
    const pos = new Float32Array(N*3), col = new Float32Array(N*3);
    const c = new THREE.Vector3(), q = new THREE.Vector3();
    let i = 0;
    for (let k = 0; k < CLUSTERS; k++){
      onSphere(c);
      const spread = 0.07 + Math.random()*0.16, heat = Math.random();
      for (let j = 0; j < PER; j++){
        q.set(c.x + (Math.random()-0.5)*spread,
              c.y + (Math.random()-0.5)*spread,
              c.z + (Math.random()-0.5)*spread).normalize()
         .multiplyScalar(R*(0.99 + Math.random()*0.045));
        pos[i*3] = q.x; pos[i*3+1] = q.y; pos[i*3+2] = q.z;
        tmp.copy(cHot).lerp(cAmb, 0.25 + heat*0.7*Math.random());
        col[i*3] = tmp.r; col[i*3+1] = tmp.g; col[i*3+2] = tmp.b;
        i++;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color',    new THREE.BufferAttribute(col, 3));
    shell.add(new THREE.Points(g, cityMat));
  })();

  /* 4) 城市光柱 */
  (function cityLines(){
    const N = 400, pos = [], col = [];   // 大幅减少（参考图无外延光柱）
    for (let i = 0; i < N; i++){
      onSphere(_a);
      const h = 0.004 + Math.pow(Math.random(), 3.0)*0.022;  // 长度大幅缩短，贴球面做内部数据标记
      _b.copy(_a).multiplyScalar(R*0.985); pos.push(_b.x,_b.y,_b.z);
      _b.copy(_a).multiplyScalar(R*0.985 + h); pos.push(_b.x,_b.y,_b.z);
      tmp.copy(cAmb).lerp(cHot, Math.min(1, h/0.022));
      col.push(cDeep.r*0.9, cDeep.g*0.9, cDeep.b*0.9, tmp.r, tmp.g, tmp.b);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
    shell.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      vertexColors:true, transparent:true, opacity:0.75, blending:ADD, depthWrite:false
    })));
  })();

  /* 4b) 内部数据线 —— 从球面向球心画短线（参考图：球体内部透出的数据/电路感） */
  (function innerData(){
    const N = 800, pos = [], col = [];
    for (let i = 0; i < N; i++){
      onSphere(_a);
      const len = 0.05 + Math.pow(Math.random(), 1.8)*0.25;  // 向内延伸 0.05~0.30
      _b.copy(_a).multiplyScalar(R*0.985); pos.push(_b.x,_b.y,_b.z);
      _b.copy(_a).multiplyScalar(R*0.985 - len); pos.push(_b.x,_b.y,_b.z);  // 减号：向内
      tmp.copy(cGold).lerp(cAmb, Math.random()*0.6);
      col.push(tmp.r, tmp.g, tmp.b, tmp.r*0.10, tmp.g*0.08, tmp.b*0.05);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
    shell.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      vertexColors:true, transparent:true, opacity:0.35, blending:ADD, depthWrite:false
    })));
  })();

  /* 5) 边缘毛刺（电池模式下关闭） */
  const rimMat = new THREE.LineBasicMaterial({
    vertexColors:true, transparent:true, opacity:0.30, blending:ADD, depthWrite:false
  });
  let rimMesh;
  (function rimSpikes(){
    const N = 380, pos = [], col = [];
    for (let i = 0; i < N; i++){
      onSphere(_a);
      const len = 0.025 + Math.pow(Math.random(), 3.2)*0.17;
      _b.copy(_a).multiplyScalar(R); pos.push(_b.x,_b.y,_b.z);
      _b.copy(_a).multiplyScalar(R+len); pos.push(_b.x,_b.y,_b.z);
      tmp.copy(cGold).lerp(cAmb, Math.random());
      col.push(tmp.r, tmp.g, tmp.b, tmp.r*0.15, tmp.g*0.10, tmp.b*0.05);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
    rimMesh = new THREE.LineSegments(g, rimMat);
    shell.add(rimMesh);
    rimMesh.visible = false; // 边缘毛刺关闭（参考图无外延毛刺）
  })();

  /* 6) 轨道弧网 —— 大弧经线（参考图：几段很长的弧横跨球面，像经线） */
  (function arcNet(){
    const ARCS = 52, pos = [], col = [];
    const n = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), v = new THREE.Vector3();
    for (let k = 0; k < ARCS; k++){
      const radius = R*(0.94 + Math.random()*0.10);
      onSphere(n);
      e1.set(0,1,0);
      if (Math.abs(n.y) > 0.9) e1.set(1,0,0);
      e1.crossVectors(e1, n).normalize();
      e2.crossVectors(n, e1).normalize();
      const arcLen = 2.8 + Math.random()*2.8;   // 大弧跨大半球
      const start  = Math.random()*Math.PI*2;
      const segs   = 28;                          // 段数多，弧线平滑
      tmp.copy(cGold).lerp(cAmb, 0.2 + Math.random()*0.4);   // 偏金色
      let prev = null;
      for (let i = 0; i <= segs; i++){
        const a = start + arcLen*(i/segs);
        v.copy(e1).multiplyScalar(Math.cos(a)*radius).addScaledVector(e2, Math.sin(a)*radius);
        if (prev){
          pos.push(prev.x, prev.y, prev.z, v.x, v.y, v.z);
          col.push(tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b);
        }
        prev = v.clone();
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
    shell.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      vertexColors:true, transparent:true, opacity:0.42, blending:ADD, depthWrite:false
    })));
  })();

  /* 7) 纬线笼 —— 稀疏化（参考图纬线少而精，非均匀铺满） */
  (function latitudes(){
    const mat = new THREE.LineBasicMaterial({
      color:0xffb066, transparent:true, opacity:0.17, blending:ADD, depthWrite:false
    });
    for (let i = 1; i < 9; i++){
      const y = -1 + (i/9)*2;
      const rr = Math.sqrt(Math.max(0, 1-y*y))*R*0.995;
      const pts = [];
      for (let s = 0; s <= 80; s++){
        const a = s/80*Math.PI*2;
        pts.push(new THREE.Vector3(Math.cos(a)*rr, y*R*0.995, Math.sin(a)*rr));
      }
      shell.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat));
    }
  })();

  /* 8) 表面数据板（电池模式下关闭） */
  const plateMeshes = [];
  (function plates(){
    const tex = gridTex();
    for (let i = 0; i < 72; i++){
      const w = 0.05 + Math.random()*0.15, h = 0.04 + Math.random()*0.12;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({
        map:tex, color:0xffb45a, transparent:true, opacity:0.08 + Math.random()*0.20,
        blending:ADD, depthWrite:false, side:THREE.DoubleSide
      }));
      onSphere(_a);
      mesh.position.copy(_a).multiplyScalar(R*(1.0 + Math.random()*0.07));
      mesh.lookAt(0,0,0);
      mesh.rotateZ(Math.random()*Math.PI);
      shell.add(mesh); plateMeshes.push(mesh);
    }
  })();

  /* 9) 主赤道环 */
  const tori = [];
  [{r:0.52,op:0.62,rx:0.35,rz:0.10,w:96},
   {r:0.68,op:0.50,rx:-0.62,rz:0.55,w:104},
   {r:0.82,op:0.42,rx:1.15,rz:-0.30,w:112},
   {r:0.92,op:0.34,rx:-0.25,rz:0.85,w:118},
   {r:0.99,op:0.28,rx:0.70,rz:-0.65,w:124},
   {r:1.06,op:0.22,rx:-1.05,rz:0.20,w:128}].forEach(c => {
    const pts = [];
    for (let s = 0; s <= c.w; s++){
      const a = s/c.w*Math.PI*2;
      pts.push(new THREE.Vector3(Math.cos(a)*c.r*R, 0, Math.sin(a)*c.r*R));
    }
    const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0xff9526, transparent:true, opacity:c.op, blending:ADD, depthWrite:false}));
    ring.rotation.set(c.rx, 0, c.rz);
    spin.add(ring); tori.push(ring);
  });

  /* 9b) 交互环波 —— 交互态时从核心向外脉冲扩散 */
  const ringWaves = [];
  const rwColorCur = new THREE.Color(0xff8a1e);      // 同样缓动着色，别硬跳
  const rwColorTarget = new THREE.Color();
  const RW_COUNT = 8;
  for (let i = 0; i < RW_COUNT; i++) {
    const geo = new THREE.TorusGeometry(R * 0.60, 0.004, 8, 100);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xff9526, transparent: true, opacity: 0,
      blending: ADD, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    // Fibonacci 球面分布：8 个环法线均匀在球面上，绝不出现完全水平环（白色横线）
    const _phi = Math.acos(1 - 2 * (i + 0.5) / RW_COUNT);
    const _theta = Math.PI * (1 + Math.sqrt(5)) * i;
    _a.set(Math.sin(_phi)*Math.cos(_theta), Math.cos(_phi), Math.sin(_phi)*Math.sin(_theta));
    mesh.quaternion.setFromUnitVectors(_b.set(0,0,1), _a);
    mesh.userData = { phase: i / RW_COUNT * Math.PI * 2, nextFire: i * 0.35 };
    root.add(mesh);
    ringWaves.push(mesh);
  }

  // 流动光点已删除（环上亮光点像"小疙瘩"，流动感改由球面能量流承担）
  const flowDots = [];

  /* 9d) 球面能量流 —— 交互态时粒子沿球面大圆流动，带拖尾
          取代"径向喷射烟花"（从核心直线飞出，廉价）。粒子沿球面大圆
          流转（像能量在球面流动），每个粒子带 4 段拖尾渐隐，形成连续的
          "流"而非孤立的"点"。头部白热，拖尾渐隐到金，末段整体淡出。 */
  const FLOW_N = 56;          // 流动粒子数
  const TRAIL  = 4;           // 每粒子拖尾点数
  const FTOTAL = FLOW_N * TRAIL;
  const flowPos = new Float32Array(FTOTAL*3);
  const flowCol = new Float32Array(FTOTAL*3);
  const flowData = [];
  for (let i = 0; i < FLOW_N; i++){
    flowData.push({ axis:new THREE.Vector3(), e1:new THREE.Vector3(), e2:new THREE.Vector3(),
                    angle:0, speed:0, life:0, radius:R*0.98, active:false });
    for (let j = 0; j < TRAIL; j++){
      const idx = (i*TRAIL+j)*3;
      flowCol[idx] = flowCol[idx+1] = flowCol[idx+2] = 0;
    }
  }
  const flowGeo = new THREE.BufferGeometry();
  flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
  flowGeo.setAttribute('color',    new THREE.BufferAttribute(flowCol, 3));
  const flowMat = new THREE.PointsMaterial({
    size:0.05, map:glowTex, vertexColors:true, transparent:true,
    opacity:0.95, blending:ADD, depthWrite:false, sizeAttenuation:true
  });
  const flowPoints = new THREE.Points(flowGeo, flowMat);
  root.add(flowPoints);
  let flowSpawnAcc = 0;

  /* 9e) 涟漪球面 —— speaking 时顶点做音乐式径向起伏（上下起伏 + 赤道扩散涟漪）
          取代旧版"辉光增强"的主视觉。一个 wireframe 二十面体，每帧按多波叠加
          做径向位移：sin(纬度*K + t*speed) 是上下起伏主感，
          sin(赤道距离*K2 - t*speed) 是从赤道向外扩散的涟漪，
          叠加经度小波增加有机感。idle 时不可见，顶点复位。 */
  const RIPPLE_R = R * 0.985;
  const rippleGeo = new THREE.IcosahedronGeometry(RIPPLE_R, 3);
  const RIPPLE_N  = rippleGeo.attributes.position.count;
  const rippleOrig = new Float32Array(rippleGeo.attributes.position.array);
  const rippleMat = new THREE.MeshBasicMaterial({
    color:0xffc46a, wireframe:true, transparent:true, opacity:0,
    blending:ADD, depthWrite:false
  });
  const rippleMesh = new THREE.Mesh(rippleGeo, rippleMat);
  shell.add(rippleMesh);
  let rippleDirty = false;
  // 颜色/振幅/透明度以前是每帧直接 setHex + 硬赋值——线框球在叠加混合下，
  // 状态一切换（尤其切进 thinking 的近白色 0xfff3d0）就是一帧内的硬跳变，
  // 看起来像"一条白线在闪"。现在跟其它状态参数一样缓动，颜色用 Color.lerp。
  const rippleColorCur = new THREE.Color(0xff8a1e);
  const rippleColorTarget = new THREE.Color();

  // 中央涡旋已删除（反复造成核心区域白色横线闪烁）

  /* ---------- 尺寸：按屏幕短边定距，保证球体占比稳定 ---------- */
  const FILL = 0.46;   // 球体（含外缘）占屏幕短边一半的比例
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const halfFov = (FOV * Math.PI / 180) / 2;
    let dist = (R * 1.15) / (FILL * Math.tan(halfFov));
    if (camera.aspect < 1) dist /= camera.aspect;   // 竖屏时按宽度收敛
    camera.position.set(0, 0, dist);
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---------- 宿主 App 控制接口 ---------- */
  api.setPower = function(p){
    power = (p === 'battery') ? 'battery' : 'ac';
    const cfg = PROFILE[power];
    if (rimMesh) rimMesh.visible = false; // 边缘毛刺永久关闭（参考图无外延毛刺）
    plateMeshes.forEach(m => m.visible = cfg.plates);
    document.getElementById('tState').textContent = power === 'battery' ? 'LOW-POWER' : 'ONLINE';
  };
  api.setVisible = function(v){
    const was = running;
    running = !!v;
    if (running && !was){ last = performance.now(); requestAnimationFrame(animate); }
  };
  // 看门狗：万一 rAF 因为任何原因没能恢复（宿主漏发通知、系统抑制回调等），
  // 这里兜底重启循环，避免壁纸永久卡死在一帧上。setInterval 即使在
  // rAF 被停掉时也仍会触发，所以它是可靠的恢复通道。
  setInterval(() => {
    if (running && performance.now() - lastFrame > 2000){
      last = performance.now();
      requestAnimationFrame(animate);
    }
  }, 2000);
  api.pulse = function(v){ FX.pulse = Math.max(FX.pulse, v == null ? 1 : v); };

  /* ---------- 限帧主循环 ---------- */
  let t = 0, last = performance.now(), acc = 0, lastFrame = performance.now();
  function animate(now){
    lastFrame = now;
    if (!running) return;                       // 被完全遮挡 → 彻底停帧
    requestAnimationFrame(animate);

    const raw = Math.min(0.25, (now - last) / 1000);
    last = now;
    acc += raw;
    const step = 1 / PROFILE[power].fps;
    if (acc < step) return;                     // 限帧
    const dt = Math.min(0.1, acc);
    acc = 0;
    t += dt;

    FX.pulse *= Math.pow(0.93, dt*60);
    const p = FX.pulse;
    const breath = Math.sin(t * 0.9);
    const micro  = Math.sin(t * 2.7) * 0.25;
    const b = 0.5 + 0.5 * breath;

    // -- 交互状态混合（丝滑过渡：放慢 + ease-in-out + 分层渐入渐出） --
    const st = FX.state || 'idle';
    const stTarget = (st === 'idle') ? 0 : 1;
    // 放缓速率（dt*5 → dt*2.2），约 1.2s 到位，过渡更从容
    FX.stateMix += (stTarget - FX.stateMix) * Math.min(1, dt * 2.2);
    const stMixRaw = FX.stateMix;
    // ease-in-out cubic：起步和收尾都柔，没有"骤起骤停"的硬感
    const stMix = stMixRaw < 0.5
      ? 4 * stMixRaw * stMixRaw * stMixRaw
      : 1 - Math.pow(-2 * stMixRaw + 2, 3) / 2;
    // 分层渐入渐出：涟漪最先，光点次之，波纹再次，喷射粒子最后；
    // 回到 idle 时反向渐出（喷射先停 → 波纹 → 光点 → 涟漪最后暗下）
    const ripplePhase = phaseOf(stMix, 0.00, 0.50);
    const flowPhase   = phaseOf(stMix, 0.15, 0.65);
    const wavePhase   = phaseOf(stMix, 0.35, 0.85);
    const ejectPhase  = phaseOf(stMix, 0.55, 1.00);
    // 状态驱动参数——这几个是"目标值"，不直接用，先缓动到 FX.s* 再用
    let stSpin=0, stCore=0, stHalo=0, stPulse=0, stSpeed=0;
    if(st==='listening'){ stCore=0.35;stHalo=0.30;stPulse=0.25;stSpeed=1.3; }
    else if(st==='thinking'){ stSpin=0.80;stCore=0.45;stHalo=0.18;stPulse=0.15;stSpeed=2.2; }
    else if(st==='speaking'){ stCore=0.28;stHalo=0.22;stPulse=0.10;stSpeed=0.8; }
    // idle: all zero → 纯呼吸

    // 缓动速率比 stateMix（1.2s）快一档，~0.5s 到位：
    // 既不会像 stateMix 那么慢导致"追不上对话节奏"，又足够抹平硬切的跳变。
    const paramRate = Math.min(1, dt * 3.5);
    FX.sCore  += (stCore  - FX.sCore)  * paramRate;
    FX.sHalo  += (stHalo  - FX.sHalo)  * paramRate;
    FX.sPulse += (stPulse - FX.sPulse) * paramRate;
    FX.sSpin  += (stSpin  - FX.sSpin)  * paramRate;
    FX.sSpeed += (stSpeed - FX.sSpeed) * paramRate;

    // 真实音量驱动。宿主播报时上报播放振幅，收音时上报麦克风 RMS，
    // 所以球体是真的跟着声音在动，不是在跑一条预设动画。
    // 起振快、落振慢（attack/release）：播报戛然而止时 level 会瞬间归零，
    // 之前落振和起振同一个 dt*14 速率，球体跟着在同一帧里"瘪"下去，
    // 这才是"语音交互结束回到静态呼吸"最刺眼的那一下，比状态参数的硬切更明显。
    const levelRate = FX.level > FX.levelMix ? dt * 14 : dt * 3.0;
    FX.levelMix += (FX.level - FX.levelMix) * Math.min(1, levelRate);
    const lvl = FX.levelMix * stMix;
    const core  = FX.sCore  + lvl * 0.55;
    const halo  = FX.sHalo  + lvl * 0.45;
    const pulseAmt = FX.sPulse + lvl * 0.30;

    spin.rotation.y += (0.10 + p*0.55 + stMix*FX.sSpin) * dt;
    spin.rotation.x  = Math.sin(t * 0.23) * 0.10;
    root.scale.setScalar(1 + breath*0.030 + micro*0.008 + p*0.055 + stMix*0.012*Math.sin(t*2.5));

    shell.scale.setScalar(1 + breath*0.045 + micro*0.012);
    starMat.size    = STAR_BASE * (1 + b*0.16 + p*0.55 + stMix*core*1.4);
    starMat.opacity = 0.66 + b*0.28 + p*0.04 + stMix*pulseAmt*0.2;
    cityMat.size    = 0.030 * (1 + b*0.22 + p*0.60 + stMix*core*0.9);
    cityMat.opacity = 0.72 + b*0.26 + p*0.04 + stMix*pulseAmt*0.15;

    coreLight.scale.setScalar(0.36 + b*0.08 + p*0.30 + stMix*core);
    halo1.material.opacity = 0.17 + b*0.10 + p*0.24 + stMix*halo;
    halo2.material.opacity = 0.09 + b*0.07 + p*0.13 + stMix*halo*0.6;

    // 赤道环交互缩放
    const torusScale = 1 + stMix * 0.12 * Math.sin(t * 3.5);
    tori.forEach(tr => { tr.scale.setScalar(torusScale); });
    // 毛刺交互亮度
    if (rimMesh) {
      rimMat.opacity = (0.20 + b*0.16 + p*0.28) + stMix * 0.22 * (0.5 + 0.5 * Math.sin(t * 5.2));
    }
    tori[0].rotation.y += (0.30 + stMix*FX.sSpeed*0.4) * dt;
    tori[1].rotation.y -= (0.20 + stMix*FX.sSpeed*0.25) * dt;
    tori[2].rotation.z += (0.12 + stMix*FX.sSpeed*0.15) * dt;

    // -- 交互环波：从核心向外脉冲扩散 --
    if (ringWaves && ringWaves.length) {
      // 电池供电时不点火新波（与 rim/plates 同一档位策略），已在跑的让它自然消散。
      const rwActive = power === 'ac'
        && (st === 'listening' || st === 'thinking' || st === 'speaking');
      const rwInterval = st === 'thinking' ? 0.25 : st === 'listening' ? 0.45 : 0.70;
      const rwSpeed = st === 'thinking' ? 2.8 : st === 'listening' ? 1.8 : 1.2;
      const rwFade = st === 'thinking' ? 4.5 : st === 'listening' ? 3.2 : 2.0;
      let rwAny = false;
      for (let i = 0; i < ringWaves.length; i++) {
        const rw = ringWaves[i];
        const ud = rw.userData;
        if (!rwActive) {
          // 回退：渐隐
          if (rw.visible) {
            rw.material.opacity = Math.max(0, rw.material.opacity - dt * 5);
            const s = rw.scale.x + dt * 0.8;
            rw.scale.setScalar(s);
            if (rw.material.opacity <= 0.01) { rw.visible = false; rw.material.opacity = 0; }
          }
          continue;
        }
        // 点火新波
        ud.nextFire -= dt;
        if (ud.nextFire <= 0 && !rw.visible) {
          rw.visible = true;
          rw.scale.setScalar(0.55);
          rw.material.opacity = 0.55;
          ud.nextFire = rwInterval;
        }
        if (rw.visible) {
          rwAny = true;
          rw.scale.setScalar(rw.scale.x + dt * rwSpeed);
          rw.material.opacity = Math.max(0, rw.material.opacity - dt * rwFade);
          if (rw.scale.x > 2.8 || rw.material.opacity <= 0.01) {
            rw.visible = false; rw.material.opacity = 0;
          }
        }
      }
      // 确保至少一个波在跑
      if (rwActive && !rwAny && ringWaves[0]) {
        ringWaves[0].visible = true;
        ringWaves[0].scale.setScalar(0.55);
        ringWaves[0].material.opacity = 0.55;
        ringWaves[0].userData.nextFire = rwInterval;
      }
      // 波纹颜色随状态变化：thinking 偏白热，listening 偏金，speaking 偏暖橙
      if (rwActive) {
        rwColorTarget.setHex(st === 'thinking' ? 0xfff3d0
                           : st === 'listening' ? 0xffc46a
                           : 0xff8a1e);
        rwColorCur.lerp(rwColorTarget, Math.min(1, dt * 3.5));
        for (let i = 0; i < ringWaves.length; i++) ringWaves[i].material.color.copy(rwColorCur);
      }
    }

    // 流动光点已删除（小疙瘩），流动感由球面能量流承担

    // -- 球面能量流：粒子沿球面大圆流动，带拖尾，ejectPhase 渐入渐出 --
    if (flowData.length) {
      const flowRate = ejectPhase * (st === 'thinking' ? 20
                          : st === 'listening' ? 12
                          : st === 'speaking' ? 8 : 0);
      flowSpawnAcc += flowRate * dt;
      let flowBudget = Math.floor(flowSpawnAcc);
      flowSpawnAcc -= flowBudget;
      for (let i = 0; i < FLOW_N && flowBudget > 0; i++){
        const d = flowData[i];
        if (!d.active){
          d.active = true;
          d.life = 2.0 + Math.random()*1.5;          // 寿命 2~3.5s，流动一段
          // 避免水平大圆（法线接近 Y 轴），防止粒子沿赤道流动形成水平光带
          do { onSphere(d.axis); } while (Math.abs(d.axis.y) > 0.55);
          _a.set(0,1,0); if (Math.abs(d.axis.y)>0.9) _a.set(1,0,0);
          d.e1.crossVectors(_a, d.axis).normalize();   // 大圆正交基
          d.e2.crossVectors(d.axis, d.e1).normalize();
          d.angle = Math.random()*Math.PI*2;           // 随机起始角
          d.speed = (0.5 + Math.random()*0.7) * (Math.random()<0.5?1:-1);  // 角速度+方向
          d.radius = R*(0.96 + Math.random()*0.06);
          flowBudget--;
        }
      }
      for (let i = 0; i < FLOW_N; i++){
        const d = flowData[i];
        if (!d.active){
          for (let j = 0; j < TRAIL; j++){
            const idx=(i*TRAIL+j)*3; flowCol[idx]=flowCol[idx+1]=flowCol[idx+2]=0;
          }
          continue;
        }
        d.life -= dt;
        if (d.life <= 0){
          d.active = false;
          for (let j = 0; j < TRAIL; j++){
            const idx=(i*TRAIL+j)*3; flowCol[idx]=flowCol[idx+1]=flowCol[idx+2]=0;
          }
          continue;
        }
        d.angle += d.speed * dt;
        const lifeFade = Math.min(1, d.life/0.5);      // 末段整体淡出
        for (let j = 0; j < TRAIL; j++){
          const trailAngle = d.angle - j*0.055*Math.sign(d.speed);  // 拖尾沿反方向
          const idx = (i*TRAIL+j)*3;
          const ca = Math.cos(trailAngle), sa = Math.sin(trailAngle);
          flowPos[idx]   = (d.e1.x*ca + d.e2.x*sa) * d.radius;
          flowPos[idx+1] = (d.e1.y*ca + d.e2.y*sa) * d.radius;
          flowPos[idx+2] = (d.e1.z*ca + d.e2.z*sa) * d.radius;
          // 头部白热，拖尾渐隐到金
          const fade = 1 - j/TRAIL;
          tmp.copy(cHot).lerp(cGold, j/TRAIL);
          flowCol[idx]   = tmp.r * fade * lifeFade;
          flowCol[idx+1] = tmp.g * fade * lifeFade;
          flowCol[idx+2] = tmp.b * fade * lifeFade;
        }
      }
      flowGeo.attributes.position.needsUpdate = true;
      flowGeo.attributes.color.needsUpdate = true;
    }

    // -- 涟漪球面：speaking 时音乐式径向起伏，listening/thinking 低强度 --
    // 这是"球体线条涟漪"的主载体：wireframe 二十面体顶点按多波叠加做径向位移
    if (rippleMesh) {
      let stRippleAmpT = 0, stRippleOpT = 0;
      if (st === 'listening')     { stRippleAmpT = 0.30; stRippleOpT = 0.28; }
      else if (st === 'thinking') { stRippleAmpT = 0.45; stRippleOpT = 0.38; }
      else if (st === 'speaking') { stRippleAmpT = 1.0;  stRippleOpT = 0.62; }
      FX.sRippleAmp     += (stRippleAmpT - FX.sRippleAmp)     * paramRate;
      FX.sRippleOpacity += (stRippleOpT  - FX.sRippleOpacity) * paramRate;

      const rippleAmp = stMix * (FX.sRippleAmp * 0.045 + lvl * 0.075);
      rippleMat.opacity = stMix * FX.sRippleOpacity;
      rippleColorTarget.setHex(st === 'thinking' ? 0xfff3d0
                             : st === 'listening' ? 0xffc46a
                             : 0xff8a1e);
      rippleColorCur.lerp(rippleColorTarget, Math.min(1, dt * 3.5));
      rippleMat.color.copy(rippleColorCur);
      if (rippleAmp > 0.0004) {
        const pos = rippleGeo.attributes.position.array;
        for (let i = 0; i < RIPPLE_N; i++) {
          const ix = i*3, iy = ix+1, iz = ix+2;
          const ox = rippleOrig[ix], oy = rippleOrig[iy], oz = rippleOrig[iz];
          const len = Math.sqrt(ox*ox + oy*oy + oz*oz) || 1;
          const nx = ox/len, ny = oy/len, nz = oz/len;
          // 沿纬度(y)传播 —— "上下起伏"的主感
          const w1 = Math.sin(ny * 8 + t * 2.6);
          // 从赤道向外扩散的涟漪
          const distEq = Math.sqrt(nx*nx + nz*nz);
          const w2 = Math.sin(distEq * 10 - t * 3.2);
          // 经度方向小波，增加有机感
          const w3 = Math.sin(Math.atan2(nz, nx) * 6 + t * 1.9) * 0.4;
          const disp = (w1 + w2*0.8 + w3) * rippleAmp;
          const k = 1 + disp / RIPPLE_R;
          pos[ix] = ox * k; pos[iy] = oy * k; pos[iz] = oz * k;
        }
        rippleGeo.attributes.position.needsUpdate = true;
        rippleDirty = true;
      } else if (rippleDirty) {
        // 回到 idle：顶点复位一次，避免浮点漂移累积
        rippleGeo.attributes.position.array.set(rippleOrig);
        rippleGeo.attributes.position.needsUpdate = true;
        rippleDirty = false;
      }
    }

    // -- demo 推进：独立预览时自动循环四种状态 + 模拟音量 --
    // 宿主一旦调用过 __jarvisSetState，hostTookOver 置 true，demo 永久关闭
    if (!hostTookOver){
      demoTimer += dt;
      if (demoTimer >= DEMO_DUR){
        demoTimer = 0;
        demoIdx = (demoIdx + 1) % DEMO_SEQ.length;
        const ns = DEMO_SEQ[demoIdx];
        FX.state = ns; syncTelemetryState(ns);
      }
      const s = FX.state;
      let lv = 0;
      if (s === 'listening')      lv = 0.30 + 0.28 * (0.5+0.5*Math.sin(t*3.1)) * (0.7+0.3*Math.sin(t*11));
      else if (s === 'speaking')   lv = 0.20 + 0.40 * Math.abs(Math.sin(t*4.3));
      else if (s === 'thinking')   lv = 0.10 + 0.10 * Math.abs(Math.sin(t*1.7));
      else                         lv = 0;
      FX.level = lv;
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  setInterval(() => { if (running && FX.pulse < 0.18) FX.pulse = 0.18; }, 5200);
  return api;
})();

/* 宿主在 didFinishNavigation 只知道 DOM/CSS 加载完了，不知道 WebGL 有没有真的
   画出球体——DOM（进度条文字）合成快，canvas 要等 GPU 进程回一趟才合成，
   宿主按前者时机淡入窗口就会看见"进度条先到、球体隔一拍才跟上"。
   两次 rAF 之间浏览器必定已完成一次合成，用这个信号才能保证宿主淡入时
   球体已经真的在屏幕上，跟进度条同时出现。 */
requestAnimationFrame(() => requestAnimationFrame(() => {
  try {
    window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvisSphereReady
      && window.webkit.messageHandlers.jarvisSphereReady.postMessage('ready');
  } catch (e) {}
}));

/* ---------- 宿主 App 调用的全局钩子 ---------- */
window.__jarvisSetPower   = p => CORE.setPower(p);
window.__jarvisSetVisible = v => CORE.setVisible(v);

// 交互动效：四种状态 + 实时音量。宿主根据真实会话注入。
//   idle       待机呼吸（默认）
//   listening  倾听：粒子变大、波纹金、光点中速流动、径向喷射中速
//   thinking   思考：涡旋加速、波纹白热、光点最快、径向喷射最快
//   speaking   说话：辉光增强、波纹暖橙、光点慢、径向喷射少而稳
let hostTookOver = false;
const STATE_LABEL = { idle:'ONLINE', listening:'LISTENING', thinking:'THINKING', speaking:'SPEAKING' };
function syncTelemetryState(s){
  const el = document.getElementById('tState');
  if (el) el.textContent = STATE_LABEL[s] || 'ONLINE';
}
syncTelemetryState('idle');
window.__jarvisSetState  = s => {
  hostTookOver = true;            // 宿主一旦接管，永久关闭 demo
  FX.state = s; syncTelemetryState(s);
};
window.__jarvisSetLevel  = v => { FX.level = Math.max(0, Math.min(1, +v || 0)); };
// 整机 CPU 占用，宿主用 host_statistics 轮询后推过来（见 OrbWindowController）
window.__jarvisSetCPU = pct => {
  const el = document.getElementById('tCpu');
  if (el) el.textContent = Math.round(Math.max(0, Math.min(100, +pct || 0))) + '%';
};

/* 启动进度：宿主按真实里程碑（进程起来/连上大脑/唤醒词就绪……）推百分比，
   只认数字，不接受/不显示宿主传来的任何文案——保证这条动效永远只有
   "LOADING NN%"，不会被谁不小心塞进中文。到 100 就把这条淡出、
   把球体正下方那条遥测信息淡入接管，两者共用同一个锚点，交接不跳位。
   新开的屏幕（接显示器）如果启动早就完成了，宿主会直接重推一次 100，
   不会让新窗口重新播一遍动画。 */
let bootDone = false;
window.__jarvisSetBoot = (pct) => {
  if (bootDone) return;
  pct = Math.max(0, Math.min(100, +pct || 0));
  const fill = document.getElementById('bootFill');
  if (fill) fill.style.width = pct + '%';
  const pctNode = document.getElementById('bootPct');
  if (pctNode) pctNode.textContent = Math.round(pct) + '%';
  if (pct >= 100) {
    bootDone = true;
    const boot = document.getElementById('boot');
    if (boot) {
      boot.classList.add('done');
      setTimeout(() => { boot.style.display = 'none'; }, 600);
    }
    const tel = document.querySelector('.telemetry');
    if (tel) tel.classList.add('on');
  }
};

// 独立预览 demo：宿主没调用 __jarvisSetState 时，自动循环四种状态，
// 让交互动效在浏览器直接打开就能看到。加 ?nodemo=1 可关闭。
const DEMO_SEQ  = ['listening','thinking','speaking','idle'];
const DEMO_DUR  = 4.0;
let demoIdx = 0, demoTimer = 0;
if (new URLSearchParams(location.search).has('nodemo')) hostTookOver = true;

/* ---------- 遥测文字 ---------- */
setInterval(() => {
  if (!running) return;
  const d = new Date();
  document.getElementById('tClock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
}, 1000);
</script>
