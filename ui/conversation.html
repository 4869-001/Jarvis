<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<style>
/* 配色跟壁纸里的球体走同一套琥珀金（wallpaper.html 的 cHot/cGold/cAmb/cDeep）。
   文档 §4.1 给每个状态指定了青/紫/琥珀/暖白，这里刻意不照做——面板和桌面上那颗球
   必须看着是同一个东西。状态改用**亮度和脉冲节奏**区分，只有 error 和 sleeping
   离开琥珀家族，因为这两个本来就该跳出来。

   毛玻璃由宿主的 NSVisualEffectView 提供，这里只叠一层深色调；圆角靠 NSWindow 裁。
   --tint 的透明度由宿主按滑块推过来（opacity 事件），不要写死。 */
:root {
  --hot:       #fff3d0;
  --gold:      #ffc46a;
  --amber:     #ff8c1a;

  --tint:      0.62;
  --bg:        rgba(9, 6, 3, var(--tint));
  --line:      rgba(255, 140, 26, 0.17);
  --line-lit:  rgba(255, 168, 60, 0.42);

  --text:      #ffe6c4;
  --text-dim:  rgba(255, 196, 130, 0.52);
  --warn:      #ffb020;
  --bad:       #ff6a4d;
  --ok:        #b6e06a;
  --sleep:     #6b6259;

  --halo:      0 1px 3px rgba(0, 0, 0, 0.75);
  --mono:      "SF Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
  font: 13px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#shell { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg); }

/* 顶部那层暖光，呼应球体的 halo。纯装饰，不吃点击。 */
#shell::before {
  content: '';
  position: absolute; inset: 0 0 auto; height: 220px;
  background: radial-gradient(ellipse 120% 100% at 50% 0%,
              rgba(255, 140, 26, 0.13) 0%, rgba(255, 77, 8, 0.05) 45%, transparent 75%);
  pointer-events: none;
}

/* ── 顶栏 ───────────────────────────────────────────── */
/* 左边 78px 留给系统的红绿灯按钮。收起时整个窗口就剩这一条，
   所以它的高度由 JS 量出来传给宿主，两边永远不会对不上。 */
header {
  position: relative; flex: none;
  height: 56px; padding: 0 8px 0 78px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--line);
}

#dot {
  width: 7px; height: 7px; border-radius: 50%; flex: none;
  background: var(--amber); box-shadow: 0 0 9px currentColor;
  transition: background 0.25s;
}
/* 八个状态全靠亮度 + 节奏区分，不换色系 */
#dot[data-state="listening"]    { background: var(--hot);  animation: pulse 0.7s ease-in-out infinite; }
#dot[data-state="transcribing"] { background: var(--gold); animation: pulse 0.7s ease-in-out infinite; }
#dot[data-state="thinking"]     { background: var(--amber);animation: breathe 2.0s ease-in-out infinite; }
#dot[data-state="executing"]    { background: #ffa640;     animation: pulse 1.2s ease-in-out infinite; }
#dot[data-state="speaking"]     { background: var(--text); }
#dot[data-state="sleeping"]     { background: var(--sleep); box-shadow: none; }
#dot[data-state="error"]        { background: var(--bad); }
#dot[data-state="offline"]      { background: var(--bad); opacity: 0.6; }
@keyframes pulse   { 0%,100% { opacity: 1 } 50% { opacity: 0.2 } }
@keyframes breathe { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: 0.45; transform: scale(0.8) } }

#brand {
  font: 600 11px/1 var(--mono); letter-spacing: 0.24em; color: var(--gold);
  text-shadow: 0 0 12px rgba(255, 140, 26, 0.45); flex: none;
}

/* 状态文字。后端可以用 detail 覆盖成"正在打开 Safari"这种具体动作 */
#status {
  /* min-width 不是 0：状态文字被挤成 0 宽时，顶栏在几何上"没有溢出"，
     重排算法就不会去收按钮，结果是按钮都在、状态没了。给它一个下限，
     挤不下就算溢出，让重排去收低频按钮。 */
  flex: 1; min-width: 84px;
  font: 10px/1 var(--mono); letter-spacing: 0.1em; color: var(--text-dim);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#status::before { content: '· '; opacity: 0.45; }

/* 音频动态条。收音和播报时都动，其余时候塌成一条静线 */
#bars { display: flex; align-items: center; gap: 2px; height: 16px; flex: none; }
#bars i {
  display: block; width: 2px; height: 2px; border-radius: 1px;
  background: var(--gold); opacity: 0.5;
  transition: height 0.08s linear, opacity 0.08s linear;
}

/* 工具条：右对齐，永远不换行。放不下的按钮由 reflowToolbar() 挪进「⋯」菜单，
   而不是让它们被窗口右沿切掉——按钮被切掉时没有任何视觉提示，用户只会觉得
   「收起按钮不见了」。 */
#tools { flex: none; display: flex; align-items: center; gap: 8px; }

header button {
  flex: none;
  background: none; border: 1px solid var(--line); border-radius: 5px;
  color: var(--text-dim); font-size: 11px; padding: 3px 7px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
header button:hover { color: var(--gold); border-color: var(--line-lit); }
header button.on { color: var(--amber); border-color: var(--line-lit); }
header button svg { display: block; width: 13px; height: 13px; }
header button .glyph { display: block; line-height: 13px; }
/* 图标在顶栏里够用，名字只在溢出菜单里出现 */
#tools .lbl { display: none; }

/* ── 溢出菜单 ─────────────────────────────────────── */
#moreMenu {
  display: none; position: absolute; top: 52px; right: 10px; z-index: 40;
  flex-direction: column; gap: 2px; padding: 4px; min-width: 148px;
  border: 1px solid var(--line); border-radius: 10px;
  background: rgba(20, 14, 8, 0.94);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
}
#moreMenu.on { display: flex; }
#moreMenu button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  border: none; border-radius: 7px; padding: 7px 9px;
  font-size: 12px; color: rgba(255, 230, 196, 0.8); background: none; cursor: pointer;
}
#moreMenu button:hover { background: rgba(255, 140, 26, 0.12); color: var(--text); }
#moreMenu button.on { color: var(--amber); }
#moreMenu button svg { width: 14px; height: 14px; flex: none; }
#moreMenu button .glyph { flex: none; width: 14px; text-align: center; }
#moreMenu .lbl { display: inline; }
#btn-collapse { transition: color 0.15s, border-color 0.15s, transform 0.2s ease; }
#btn-collapse.collapsed { transform: rotate(180deg); }

/* ── 透明度滑块 ─────────────────────────────────────── */
#opacity {
  flex: none; display: none;
  align-items: center; gap: 9px; padding: 7px 14px;
  border-bottom: 1px solid var(--line); background: rgba(255, 140, 26, 0.035);
}
#opacity.on { display: flex; }
#opacity label { font: 10px/1 var(--mono); letter-spacing: 0.14em; color: var(--text-dim); flex: none; }
#opacity output { font: 10px/1 var(--mono); color: var(--gold); width: 34px; text-align: right; flex: none; }
#opacity input[type=range] {
  flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px;
  background: linear-gradient(to right, var(--amber) 0%, var(--gold) 100%);
  opacity: 0.75; cursor: pointer;
}
#opacity input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--hot); border: none; box-shadow: 0 0 8px rgba(255, 140, 26, 0.9);
}

/* ── 唤醒方式 ───────────────────────────────────────── */
#wakeMode {
  flex: none; display: none;
  padding: 10px 14px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255, 140, 26, 0.055), rgba(255, 140, 26, 0.018));
}
#wakeMode.on { display: block; }
#wakeMode .wake-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
#wakeMode .wake-title { font: 600 10px/1 var(--mono); letter-spacing: 0.15em; color: var(--gold); }
#wakeMode .wake-summary {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 10px/1.3 var(--mono); color: var(--text-dim);
}
#wakeMode .wake-options { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
#wakeMode .opt {
  position: relative; min-width: 0; padding: 8px 28px 8px 10px; text-align: left;
  border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 230, 196, 0.018);
  color: var(--text-dim); cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
#wakeMode .opt:hover { color: var(--gold); border-color: var(--line-lit); background: rgba(255, 140, 26, 0.045); }
#wakeMode .opt.active {
  color: var(--hot); border-color: rgba(255, 168, 60, 0.62);
  background: rgba(255, 140, 26, 0.09); box-shadow: inset 0 0 18px rgba(255, 140, 26, 0.035);
}
#wakeMode .opt-name { display: block; font: 600 11px/1.2 var(--mono); letter-spacing: 0.02em; }
#wakeMode .opt-desc { display: block; margin-top: 4px; font: 10px/1.35 -apple-system, "PingFang SC", sans-serif; opacity: 0.68; }
#wakeMode .opt::after {
  content: ''; position: absolute; right: 10px; top: 11px; width: 8px; height: 8px;
  border: 1px solid var(--line-lit); border-radius: 50%;
}
#wakeMode .opt.active::after { background: var(--amber); border-color: var(--gold); box-shadow: 0 0 7px rgba(255, 140, 26, 0.8); }

/* ── 消息区 ─────────────────────────────────────────── */
#body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
#log {
  flex: 1; overflow-y: auto; padding: 14px 16px 8px;
  display: flex; flex-direction: column; gap: 12px; user-select: text;
  overscroll-behavior: contain; scrollbar-gutter: stable;
  contain: layout paint style;
}
/* 消息流里的每一项都不许被压扁。#log 是 flex column，而 flex 子项默认
   flex-shrink:1——内容一超过可视高度，最高的那几项（工具卡片栈、长回复）
   就会被按比例压矮，配上它们自己的 overflow:hidden，表现是「卡片凭空少了半截」。
   实测：4 张卡片实际占 440px，容器被压到 133px，后两张整个看不见。
   这条比"给某个卡片单独加 flex:none"可靠——新加的卡片类型不会再踩一次。 */
#log > * { flex: 0 0 auto; }

#log::-webkit-scrollbar { width: 6px; }
#log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.msg { max-width: 92%; position: relative; contain: layout paint style; }
.msg.user { align-self: flex-end; }
.msg.user .body {
  background: rgba(255, 140, 26, 0.11); border: 1px solid var(--line);
  border-radius: 12px 12px 3px 12px; padding: 7px 11px;
  white-space: pre-wrap; word-break: break-word;
}
.msg.assistant .body { white-space: pre-wrap; word-break: break-word; }

/* 流式光标。收完就摘掉，别让它一直闪着像还在生成 */
.msg.assistant.streaming .body::after {
  content: '▍'; color: var(--amber); animation: blink 1s steps(2) infinite; margin-left: 1px;
}
@keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

/* 中文字幕。Jarvis 讲英文，这行是给眼睛看的，所以弱化，
   但不能弱到看不清——它常常是用户唯一真正读的那行。 */
.msg.assistant .zh {
  margin-top: 5px; padding-left: 9px;
  border-left: 2px solid rgba(255, 140, 26, 0.35);
  font-size: 12.5px; color: rgba(255, 220, 180, 0.72);
  white-space: pre-wrap; word-break: break-word;
}
.msg.assistant .zh:empty { display: none; }
.msg .body code {
  font: 12px var(--mono); background: rgba(255, 200, 130, 0.09);
  padding: 1px 4px; border-radius: 3px;
}

/* 消息操作行。默认只留时间，悬停才露出按钮——常驻会把对话弄得很吵。 */
.acts {
  display: flex; gap: 10px; align-items: center; margin-top: 4px;
  font: 10px/1 var(--mono); color: rgba(255, 196, 130, 0.3);
}
.msg.user .acts { justify-content: flex-end; }
.acts button {
  background: none; border: none; padding: 0; cursor: pointer;
  font: inherit; color: rgba(255, 196, 130, 0.4);
  opacity: 0; transition: opacity 0.15s, color 0.15s;
}
.msg:hover .acts button { opacity: 1; }
.acts button:hover { color: var(--gold); }

/* 思维链：默认收起，点一下展开 */
.reasoning {
  font-size: 11.5px; color: var(--text-dim);
  border-left: 2px solid var(--line); padding-left: 9px; margin-bottom: 6px;
  white-space: pre-wrap; max-height: 3.4em; overflow: hidden; cursor: pointer;
}
.reasoning.open { max-height: none; }

/* ── 工具卡片 ───────────────────────────────────────── */
.tool-stack {
  align-self: stretch; border: 1px solid var(--line); border-radius: 8px;
  background: rgba(255, 140, 26, 0.04); overflow: hidden; contain: layout paint style;
}
.tool { overflow: hidden; }
.tool + .tool { border-top: 1px solid rgba(255, 140, 26, 0.09); }
.tool-head {
  display: flex; align-items: baseline; gap: 7px; padding: 7px 10px;
  font: 11.5px/1.5 var(--mono); color: var(--text-dim);
}
.tool-head .mark { color: var(--gold); flex: none; width: 1em; }
.tool.ok      .mark { color: var(--ok); }
.tool.fail    .mark { color: var(--bad); }
.tool.cancel  .mark { color: var(--text-dim); }
.tool-head .what { color: var(--text); flex: none; }
.tool-head .target {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-align: left;      /* 保尾截断在 JS 里做（tailClip），CSS 的 rtl 会把路径显示反 */
}
.tool-head .ms { flex: none; opacity: 0.6; }

/* 执行步骤。只记真实发生过的系统动作，不编造"正在校验权限"这种看不见的步骤。 */
.steps { padding: 0 10px 8px 27px; font: 11px/1.7 var(--mono); color: var(--text-dim); }
.steps div::before { content: '● '; color: var(--warn); }
.steps div.done::before { content: '✓ '; color: var(--ok); }
.steps div.fail::before { content: '✗ '; color: var(--bad); }

/* 文件结果：可多选，选中后底部两个动作才有意义 */
.files { border-top: 1px solid var(--line); }
.file {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer;
  font-size: 12px; border-bottom: 1px solid rgba(255, 140, 26, 0.07);
}
.file:hover { background: rgba(255, 140, 26, 0.07); }
.file.sel { background: rgba(255, 140, 26, 0.13); }
.file .tick { flex: none; width: 12px; color: var(--amber); opacity: 0; }
.file.sel .tick { opacity: 1; }
.file .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .p {
  flex: none; max-width: 45%; font: 10px var(--mono); color: rgba(255,196,130,0.35);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
}
.file-acts { display: flex; gap: 8px; padding: 8px 10px; }
.file-acts button {
  flex: 1; padding: 5px; border-radius: 6px; cursor: pointer; font-size: 11.5px;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.06); color: var(--text);
}
.file-acts button:hover:not(:disabled) { background: rgba(255, 200, 130, 0.14); border-color: var(--line-lit); }
.file-acts button:disabled { opacity: 0.35; cursor: default; }

/* ── 确认框 ─────────────────────────────────────────── */
/* 文档 §11.2：必须写清动作、目标、完整路径、能不能撤。
   「是否允许 Jarvis 执行操作？」这种问法等于没问。 */
.confirm {
  border: 1px solid rgba(255, 176, 32, 0.45); background: rgba(255, 176, 32, 0.08);
  border-radius: 9px; padding: 10px 12px; align-self: stretch;
}
.confirm .head {
  font: 600 11px/1 var(--mono); color: var(--warn);
  letter-spacing: 0.14em; margin-bottom: 8px;
}
.confirm dl { display: grid; grid-template-columns: 4em 1fr; gap: 4px 8px; margin-bottom: 9px; }
.confirm dt { font: 10px/1.6 var(--mono); color: var(--text-dim); }
.confirm dd { font-size: 12px; word-break: break-all; }
.confirm dd.mono { font: 11px/1.6 var(--mono); color: rgba(255, 220, 180, 0.85); }
.confirm dd.no-undo { color: var(--bad); }
.confirm .row { display: flex; gap: 8px; }
.confirm button {
  flex: 1; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.06); color: var(--text);
}
.confirm button.yes { border-color: rgba(255, 176, 32, 0.55); color: var(--warn); }
.confirm button:hover { background: rgba(255, 200, 130, 0.14); }
.confirm.done { opacity: 0.5; }
.confirm.done .row { display: none; }

.notice { font-size: 11.5px; color: var(--text-dim); text-align: center; padding: 2px; }
.notice.bad { color: var(--bad); }
.notice .link { color: var(--gold); cursor: pointer; text-decoration: underline; margin: 0 4px; }

/* ── Agent 模式 ─────────────────────────────────────── */
/* 顶栏下面那条常驻状态带。Agent 跑起来之后用户最需要随时看见的三件事：
   动的是哪个目录、当前放行到什么程度、跑到第几步——所以它们不藏在菜单里。 */
#agentBar {
  display: none; flex-direction: column; gap: 6px; flex: none;
  padding: 7px 12px; border-bottom: 1px solid var(--line);
  background: rgba(255, 140, 26, 0.05);
}
body.agent #agentBar { display: flex; }
#agentBar .ag-row { display: flex; align-items: center; gap: 8px; }
#agentBar .ag-badge {
  flex: none; font: 600 9px/1 var(--mono); letter-spacing: 0.18em;
  color: #120a04; background: var(--amber); border-radius: 3px; padding: 3px 5px;
}
#agentBar .ag-ws {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 11px/1.5 var(--mono); color: var(--gold); background: none; border: none;
  cursor: pointer; padding: 0; text-align: left;
}
#agentBar .ag-ws:hover { text-decoration: underline; }
#agentBar .ag-step { flex: none; font: 10px var(--mono); color: var(--text-dim); }
#agentBar .ag-off {
  flex: none; width: 18px; height: 18px; line-height: 1; cursor: pointer;
  border: 1px solid var(--line); border-radius: 4px; background: none;
  color: var(--text-dim); font-size: 11px;
}
#agentBar .ag-off:hover { color: var(--bad); border-color: var(--bad); }

/* 权限档位。bypass 单独染红——它把所有闸都拆了，不该和另外两档看起来一样。 */
#agentBar .ag-modes { display: flex; gap: 4px; }
#agentBar .ag-modes button {
  flex: 1; padding: 4px 2px; border-radius: 5px; cursor: pointer;
  font-size: 10.5px; color: var(--text-dim);
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.04);
}
#agentBar .ag-modes button:hover { color: var(--text); border-color: var(--line-lit); }
#agentBar .ag-modes button.on { color: #120a04; background: var(--gold); border-color: var(--gold); }
#agentBar .ag-modes button.on[data-mode="bypass"] { background: var(--bad); border-color: var(--bad); color: #1a0500; }

#agentBar .ag-wsform { display: none; gap: 6px; }
#agentBar .ag-wsform.on { display: flex; }
#agentBar .ag-wsform input {
  flex: 1; min-width: 0; padding: 4px 7px; border-radius: 5px;
  border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25);
  color: var(--text); font: 11px var(--mono);
}
#agentBar .ag-wsform button {
  flex: none; padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 11px;
  border: 1px solid var(--line-lit); background: rgba(255, 200, 130, 0.1); color: var(--text);
}

/* 待办。同一时刻只有一条 in_progress，所以"正在做的那件事"必须一眼可辨。 */
#agentBar .ag-todos { display: none; flex-direction: column; gap: 2px; max-height: 132px; overflow-y: auto; }
#agentBar .ag-todos.on { display: flex; }
/* 工作台的左栏已经常驻待办，顶栏不必再显示一份——两份不同步的清单
   比没有清单更糟。 */
body.workbench #agentBar .ag-todos { display: none; }
/* 待办条目在顶栏和工作台左栏各出现一次，样式不能绑在 #agentBar 上——
   绑上去的话左栏那份会掉成没有间距、字号也不对的裸文本。 */
.ag-todo { display: flex; gap: 6px; font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
.ag-todo .box { flex: none; width: 1em; color: var(--text-dim); }
.ag-todo.doing { color: var(--text); }
.ag-todo.doing .box { color: var(--amber); }
.ag-todo.done { opacity: 0.5; text-decoration: line-through; }
.ag-todo.done .box { color: var(--ok); text-decoration: none; }
#agentBar .ag-count { font: 10px var(--mono); color: var(--text-dim); }

/* 步骤旁白：模型说"接下来我要…"。它不是回答，所以不给气泡，只给一行灰字。 */
.agent-note {
  align-self: stretch; font-size: 12px; line-height: 1.6; color: var(--text-dim);
  padding: 1px 2px 1px 10px; border-left: 2px solid rgba(255, 140, 26, 0.35);
}

/* diff 卡片 */
.diff { border-top: 1px solid var(--line); }
.diff pre {
  margin: 0; padding: 7px 10px; max-height: 260px; overflow: auto;
  font: 10.5px/1.55 var(--mono); white-space: pre; color: rgba(255, 230, 196, 0.8);
}
.diff .ln-add { color: var(--ok); }
.diff .ln-del { color: var(--bad); }
.diff .ln-hunk { color: var(--gold); opacity: 0.75; }
.diff .diff-acts { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid rgba(255,140,26,0.09); }
.diff .diff-acts .stat { flex: 1; font: 10px var(--mono); color: var(--text-dim); }
.diff .diff-acts button {
  padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 11px;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.06); color: var(--text);
}
.diff .diff-acts button:hover:not(:disabled) { border-color: var(--line-lit); background: rgba(255, 200, 130, 0.14); }
.diff .diff-acts button:disabled { opacity: 0.4; cursor: default; }

/* ── 子代理 ─────────────────────────────────────────── */
/* 子代理的工具卡片收进自己的折叠区，不和主线步骤混在一起——
   混在一起的话，用户分不清哪几步是"主线在做"、哪几步是"派出去查的"。 */
.subagent { border-top: 1px solid rgba(255, 140, 26, 0.09); }
.subagent > .sub-head {
  display: flex; align-items: baseline; gap: 7px; padding: 7px 10px; cursor: pointer;
  font: 11.5px/1.5 var(--mono); color: var(--gold);
}
.subagent > .sub-head .mark { flex: none; width: 1em; }
.subagent > .sub-head .what { flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.subagent > .sub-head .meta { flex: none; opacity: 0.6; font-size: 10px; }
.subagent.done > .sub-head .mark { color: var(--ok); }
.subagent > .sub-body { padding-left: 14px; border-left: 2px solid rgba(255, 140, 26, 0.25);
  margin-left: 14px; }
.subagent.folded > .sub-body { display: none; }

/* ── 工作台（宽屏两栏）─────────────────────────────── */
#rail {
  display: none; flex-direction: column; flex: none; width: 268px;
  border-right: 1px solid var(--line); overflow: hidden;
}
body.workbench #rail { display: flex; }
body.workbench #body { flex-direction: row; }
#rail .rail-sec { display: flex; flex-direction: column; min-height: 0;
  border-bottom: 1px solid var(--line); padding: 8px 10px; gap: 5px; }
#rail .rail-grow { flex: 1; border-bottom: none; }
#rail .rail-head { font: 600 9.5px/1 var(--mono); letter-spacing: 0.18em;
  color: var(--text-dim); text-transform: uppercase; }
#rail #rail-todos, #rail #timeline { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#rail #rail-todos { max-height: 190px; }
#rail .empty { font-size: 11px; color: var(--text-dim); opacity: 0.6; padding: 3px 0; }
.tl {
  display: flex; gap: 6px; font: 11px/1.5 var(--mono); color: var(--text-dim);
  padding: 2px 0; align-items: baseline;
}
.tl .m { flex: none; width: 1em; color: var(--warn); }
.tl.ok .m { color: var(--ok); }
.tl.fail .m { color: var(--bad); }
.tl.sub { padding-left: 12px; }
.tl .n { flex: none; color: var(--text); }
.tl .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; opacity: 0.75; }

/* 命令输出。实时那份和最终那份用同一块地方，不然同一条命令会显示两遍。 */
.term { border-top: 1px solid var(--line); }
.term pre {
  margin: 0; padding: 7px 10px; max-height: 220px; overflow: auto;
  font: 10.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all;
  color: rgba(255, 230, 196, 0.72);
}
.term .exit { padding: 0 10px 6px; font: 10px var(--mono); color: var(--text-dim); }
.term .exit.bad { color: var(--bad); }

/* ── 技能 / 常用短语菜单（输入框敲 "/" 触发）──────────── */
#skillMenu {
  display: none; flex-direction: column; gap: 2px;
  max-height: 220px; overflow-y: auto; margin-bottom: 8px; padding: 4px;
  border: 1px solid var(--line); border-radius: 10px; background: rgba(20, 14, 8, 0.92);
}
#skillMenu.on { display: flex; }
#skillMenu .skill-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px;
  cursor: pointer; font-size: 12px; color: rgba(255, 230, 196, 0.75);
}
#skillMenu .skill-item .tag {
  flex: none; font: 9px var(--mono); letter-spacing: 0.04em; color: var(--text-dim);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
}
#skillMenu .skill-item .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#skillMenu .skill-item:hover, #skillMenu .skill-item.sel { background: rgba(255, 140, 26, 0.12); color: var(--text); }

/* ── 模型选择（输入框旁的 chip + 下拉菜单）─────────────── */
/* 跟 #skillMenu 共用同一块地方（composer 上方），同一时刻只会有一个开着——
   两个都是"输入区旁边弹出来的临时列表"，没必要各占一块地方。 */
#modelMenu {
  display: none; flex-direction: column; gap: 2px;
  max-height: 260px; overflow-y: auto; margin-bottom: 8px; padding: 4px;
  border: 1px solid var(--line); border-radius: 10px; background: rgba(20, 14, 8, 0.92);
}
#modelMenu.on { display: flex; }
#modelMenu .model-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px;
  cursor: pointer; font-size: 12px; color: rgba(255, 230, 196, 0.75);
}
#modelMenu .model-item .tick { flex: none; width: 12px; color: var(--amber); opacity: 0; }
#modelMenu .model-item.active .tick { opacity: 1; }
#modelMenu .model-item .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#modelMenu .model-item:hover { background: rgba(255, 140, 26, 0.12); color: var(--text); }
#modelMenu .model-actions { display: flex; gap: 4px; flex: none; }
#modelMenu .model-actions button {
  background: transparent; border: 1px solid var(--line); border-radius: 5px;
  color: var(--text-dim); cursor: pointer; font-size: 10px; padding: 3px 6px;
}
#modelMenu .model-actions button:hover { color: var(--gold); border-color: var(--line-lit); }
#modelMenu .model-actions .del:hover, #modelMenu .model-actions .del.confirm { color: var(--bad); }
#modelMenu .model-add {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px;
  cursor: pointer; font-size: 12px; color: var(--gold); border-top: 1px solid var(--line); margin-top: 2px;
}
#modelMenu .model-add:hover { background: rgba(255, 140, 26, 0.12); }

/* 添加模型表单，跟 .confirm 卡片同一套字段/按钮语言 */
#modelForm { display: none; flex-direction: column; gap: 8px; margin-bottom: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(20, 14, 8, 0.92); }
#modelForm.on { display: flex; }
#modelForm .hint { font: 10px/1.4 var(--mono); color: var(--text-dim); }
#modelForm input {
  width: 100%; padding: 6px 8px; border-radius: 6px; font-size: 12px;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.04); color: var(--text); outline: none;
}
#modelForm input:focus { border-color: var(--line-lit); }
#modelForm .row { display: flex; gap: 8px; }
#modelForm .row button {
  flex: 1; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.06); color: var(--text);
}
#modelForm .row button.yes { border-color: rgba(255, 176, 32, 0.55); color: var(--warn); }
#modelForm .row button:hover { background: rgba(255, 200, 130, 0.14); }

/* 输入区旁的模型 chip。跟 .composer-action 那圈圆按钮不是一路——这个要放文字，
   宽度按内容撑开，所以单独一套样式，不复用 .composer-action 的固定 30×30。 */
#model-btn {
  flex: none; display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px;
  border-radius: 13px; cursor: pointer; border: 1px solid rgba(255, 220, 180, 0.13);
  background: transparent; color: rgba(255, 220, 180, 0.56); font: 11px/1 var(--mono);
}
#model-btn:hover, #model-btn.on { color: var(--text); background: rgba(255, 220, 180, 0.08); border-color: var(--line-lit); }
#model-btn svg { width: 13px; height: 13px; flex: none; }
#model-btn .lbl { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── 睡眠遮罩 ───────────────────────────────────────── */
#sleepmask {
  position: absolute; inset: 0; display: none; z-index: 5;
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: rgba(6, 5, 4, 0.72); cursor: pointer;
}
#sleepmask.on { display: flex; }
#sleepmask .z { font-size: 26px; color: var(--sleep); }
#sleepmask .t { font: 11px/1 var(--mono); letter-spacing: 0.2em; color: rgba(255,196,130,0.4); }
#sleepmask .h { font-size: 11.5px; color: rgba(255,196,130,0.3); }

/* ── 输入区 ─────────────────────────────────────────── */
footer { position: relative; flex: none; border-top: 1px solid var(--line); padding: 9px 12px 11px; }

/* 停止条。thinking / executing / speaking 期间常驻，
   比"发送按钮偷偷变成方块"清楚得多。 */
#stopbar {
  display: none; align-items: center; gap: 8px; margin-bottom: 8px;
  padding: 6px 10px; border-radius: 8px;
  border: 1px solid rgba(255, 176, 32, 0.35); background: rgba(255, 176, 32, 0.07);
  font: 11px/1.4 var(--mono); color: var(--warn);
}
#stopbar.on { display: flex; }
#stopbar .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#stopbar button {
  flex: none; padding: 3px 9px; border-radius: 5px; cursor: pointer; font: inherit;
  border: 1px solid rgba(255, 176, 32, 0.5); background: none; color: var(--warn);
}
#stopbar button:hover { background: rgba(255, 176, 32, 0.18); }

#composer {
  display: flex; flex-direction: column; gap: 6px; padding: 8px 9px 7px;
  border: 1px solid rgba(255, 196, 130, 0.2); border-radius: 16px;
  background: rgba(22, 16, 10, 0.62);
  box-shadow: 0 10px 28px rgba(0,0,0,0.16), inset 0 1px rgba(255,255,255,0.025);
  transition: border-color .15s, box-shadow .15s;
}
#composer:focus-within {
  border-color: rgba(255, 180, 92, 0.42);
  box-shadow: 0 12px 34px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,140,26,0.05);
}
#composerbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
#composerbar .left, #composerbar .right { display: flex; align-items: center; gap: 6px; min-width: 0; }
.composer-action {
  flex: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  border: 0; background: transparent; color: rgba(255, 220, 180, 0.56);
  display: flex; align-items: center; justify-content: center;
}
.composer-action svg { width: 16px; height: 16px; }
.composer-action:hover { color: var(--text); background: rgba(255, 220, 180, 0.08); }
#attach { border: 1px solid rgba(255, 220, 180, 0.13); }
#mic { border-radius: 50%; }
#mic.on {
  border-color: rgba(255, 140, 26, 0.75); color: var(--hot); background: rgba(255, 140, 26, 0.2);
  box-shadow: 0 0 14px rgba(255, 140, 26, 0.45); animation: pulse 1.1s ease-in-out infinite;
}

#input {
  display: block; width: 100%; min-height: 34px; max-height: 160px;
  background: transparent; border: 0; border-radius: 0; color: var(--text);
  font: 13.5px/1.55 inherit; padding: 3px 5px; resize: none; outline: none; user-select: text;
}
#input::placeholder { color: rgba(255, 196, 130, 0.3); }
#input.hearing { color: var(--hot); }

#send {
  flex: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  border: 0; background: var(--text); color: #211205;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s, transform .15s;
}
#send svg { width: 15px; height: 15px; }
#send:hover:not(:disabled) { transform: translateY(-1px); background: var(--hot); }
#send:disabled { opacity: 0.3; cursor: default; }

/* ── 附件 ───────────────────────────────────────────── */
.chip {
  display: flex; align-items: center; gap: 6px; max-width: 200px;
  padding: 4px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: rgba(255, 140, 26, 0.08);
  font: 11px/1.3 var(--mono); color: var(--text-dim);
}
.chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.loading { color: var(--gold); }
.chip.error { color: var(--bad); border-color: rgba(255, 106, 77, 0.4); }
.chip button {
  flex: none; background: none; border: none; color: inherit; cursor: pointer;
  font-size: 12px; line-height: 1; opacity: 0.6; padding: 0;
}
.chip button:hover { opacity: 1; }

#attachments { display: none; flex-wrap: wrap; gap: 6px; padding: 0 4px 2px; }
#attachments.on { display: flex; }

.msg .attach-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.msg .attach-list .chip { pointer-events: none; max-width: 240px; }

/* 拖文件到面板任意位置时的提示框，靠 CSS 一条描边足够，不用额外做遮罩 */
body.dragging #shell { outline: 1px dashed var(--line-lit); outline-offset: -6px; }

/* 收起态：只藏消息记录和透明度滑块，顶栏 + 输入区留着——
   缩小之后还是个能打字、能拖文件进来的迷你对话框，不是纯摆设的一条条。
   窗口高度由宿主按顶栏 + 输入区的实际高度缩，见 setCollapsed()。 */
/* 收起 = 只把对话区收掉。顶栏、Agent 状态带、输入框的尺寸一概不变——
   这不是审美选择，是让动画不跳的前提：收起态的窗口高度恰好等于这些块的高度
   之和，所以整段动画里只有 #body 在从 N 变到 0，输入框在屏幕上一像素不动。
   以前这里还会改 footer 的内边距和输入框的高度，动画结束那一帧就会"抖"一下。 */
body.collapsed #body { display: none; }
body.collapsed #opacity,
body.collapsed #wakeMode { display: none; }
body.collapsed #stopbar,
body.collapsed #attachments,
body.collapsed #skillMenu,
body.collapsed #modelMenu,
body.collapsed #modelForm { display: none !important; }
/* 动画期间把对话内容整段"冻住"。#body 的高度来自 flex、不依赖内容，所以
   content-visibility:hidden 之后它仍然占着位置（footer 照旧贴住窗口底边），
   但 WebKit 不再每帧去排那几百个消息节点。
   用它而不是 visibility:hidden：后者只是不画，布局照排——一段长对话在 0.22s 里要
   重排十几次，那正是卡顿的来源。它还会保留 #log 的滚动位置，display:none 不会。 */
body.resizing #body { content-visibility: hidden; }

/* 顶栏放不下时的让位顺序（由 reflowToolbar 逐级施加，不再用固定断点）：
   低频按钮进「⋯」→ 再不够就摘掉品牌字样和电平条。
   状态文字始终保留：它是唯一实时反馈"现在在干什么"的地方。 */
header.no-bars #bars { display: none; }
/* 品牌字样 113px 里有一半是字距。空间紧张时先把字距收掉——识别度还在，
   比整块摘掉温和得多。顶栏左边那 78px 是给窗口红绿灯留的，动不得。 */
header.condensed #brand { letter-spacing: 0.1em; font-size: 10.5px; }
header.tight { gap: 6px; padding-right: 6px; }
header.tight #brand { display: none; }
header.tight #status { letter-spacing: 0.04em; }
@media (max-width: 410px) {
  footer { padding-left: 9px; padding-right: 9px; }
}

/* 矮窗口的紧凑排版。**不能用 @media (max-height)**：收起动画里窗口高度是连续变化
   的，穿过断点时顶栏和输入区会当场改高——既是动画中途的一次跳变，又会让"收起后
   该多高"这个目标在飞行途中变掉（实测 164 → 151），观察者再把新目标报上去，宿主
   于是在动画中途重新起一段动画。改成由 applyCompactHeight() 打 class，
   且收起态与动画期间一律不打。 */
body.short header { height: 48px; }
body.short #log { padding: 10px 11px; gap: 9px; }
body.short footer { padding-top: 7px; padding-bottom: 8px; }
</style>
</head>
<body>
<div id="shell">
  <header>
    <span id="dot" data-state="offline"></span>
    <span id="brand">J.A.R.V.I.S.</span>
    <span id="status">连接中</span>
    <span id="bars"><i></i><i></i><i></i><i></i><i></i></span>
    <!-- 工具条。按钮塞不下时按 OVERFLOW_ORDER 逐个收进「⋯」，见 reflowToolbar()。
         每个按钮里的 .lbl 只在溢出菜单里显示——图标在顶栏够用，进了菜单就要有名字。 -->
    <div id="tools">
      <button id="btn-agent" title="Agent 模式（⌥A）：长程任务、编辑与检索工具"
              aria-label="Agent 模式" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
        </svg><span class="lbl">Agent 模式</span>
      </button>
      <button id="btn-wide" title="工作台（⌥W）：加宽面板，左栏常驻待办与步骤"
              aria-label="工作台" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/>
        </svg><span class="lbl">工作台</span>
      </button>
      <button id="btn-opacity" title="面板透明度" aria-label="面板透明度">
        <span class="glyph">◐</span><span class="lbl">透明度</span>
      </button>
      <button id="btn-wake" title="唤醒方式" aria-label="唤醒方式" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/>
        </svg><span class="lbl">唤醒方式</span>
      </button>
      <button id="btn-sleep" title="睡眠：停止聆听与后台任务" aria-label="睡眠">
        <span class="glyph">☾</span><span class="lbl">睡眠</span>
      </button>
      <button id="btn-new" title="新建对话（⌘⇧N）" aria-label="新建对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
        </svg><span class="lbl">新建对话</span>
      </button>
      <button id="btn-collapse" title="收起面板" aria-label="收起面板" aria-expanded="true">
        <span class="glyph">⌃</span><span class="lbl">收起面板</span>
      </button>
      <!-- 「⋯」永远在最右，且永远不参与溢出——它是溢出的出口，自己被收掉就没救了 -->
      <button id="btn-more" title="更多" aria-label="更多" aria-expanded="false">
        <span class="glyph">⋯</span>
      </button>
    </div>
  </header>

  <div id="moreMenu" role="menu"></div>

  <div id="agentBar">
    <div class="ag-row">
      <span class="ag-badge">AGENT</span>
      <button class="ag-ws" id="agent-ws" title="点击切换工作目录">~</button>
      <span class="ag-step" id="agent-step"></span>
      <button class="ag-off" id="agent-off" title="退出 Agent 模式" aria-label="退出 Agent 模式">✕</button>
    </div>
    <div class="ag-modes" id="agent-modes">
      <button type="button" data-mode="ask" title="每个文件改动和命令都要你点确认">每步确认</button>
      <button type="button" data-mode="accept_edits" title="文件编辑与只读命令直接执行，写操作仍确认">自动改文件</button>
      <button type="button" data-mode="bypass" title="不再有任何确认，包括不可逆操作">全免确认</button>
    </div>
    <div class="ag-wsform" id="agent-wsform">
      <input id="agent-wsinput" placeholder="工作目录，如 ~/Projects/Jarvis" spellcheck="false">
      <button id="agent-wsok" type="button">切换</button>
    </div>
    <div class="ag-todos" id="agent-todos"></div>
  </div>

  <div id="opacity">
    <label>OPACITY</label>
    <input id="opacity-range" type="range" min="0" max="100" step="1" value="82">
    <output id="opacity-value">82%</output>
  </div>

  <div id="wakeMode">
    <div class="wake-head">
      <span class="wake-title">WAKE MODE</span>
      <span class="wake-summary" id="wake-hint"></span>
    </div>
    <div class="wake-options">
      <button class="opt" id="wake-auto" type="button">
        <span class="opt-name">自动聆听</span>
        <span class="opt-desc">说“Jarvis / 贾维斯”唤醒</span>
      </button>
      <button class="opt" id="wake-manual" type="button">
        <span class="opt-name">手动唤醒</span>
        <span class="opt-desc">仅使用 ⌥V 或麦克风按钮</span>
      </button>
    </div>
  </div>

  <div id="body">
    <!-- 工作台左栏。只在 body.workbench 时出现：窄面板里挤不下第二列，
         而 Agent 跑长任务时又非常需要「待办 + 干了什么」始终可见。 -->
    <aside id="rail">
      <div class="rail-sec" id="rail-todos-wrap">
        <div class="rail-head">待办</div>
        <div id="rail-todos"></div>
      </div>
      <div class="rail-sec rail-grow">
        <div class="rail-head">步骤 <span id="rail-count"></span></div>
        <div id="timeline"></div>
      </div>
    </aside>
    <div id="log"></div>
    <div id="sleepmask">
      <div class="z">☾</div>
      <div class="t">SLEEPING</div>
      <div class="h">已停止聆听与后台任务 · 点这里唤醒</div>
    </div>
  </div>

  <footer>
    <div id="stopbar"><span class="txt">正在处理…</span><button id="btn-stop">停止 (Esc)</button></div>
    <div id="skillMenu"></div>
    <div id="modelMenu"></div>
    <div id="modelForm">
      <div class="hint" id="model-form-hint">仅支持 OpenAI 兼容协议 API</div>
      <input id="model-form-label" placeholder="名称，如 Kimi" maxlength="40">
      <input id="model-form-url" placeholder="Base URL，如 https://api.moonshot.cn/v1" maxlength="200">
      <input id="model-form-key" placeholder="API Key" type="password" maxlength="200">
      <input id="model-form-model" placeholder="模型名称，如 kimi-k3" maxlength="80">
      <div class="row">
        <button id="model-form-cancel">取消</button>
        <button id="model-form-save" class="yes">添加</button>
      </div>
    </div>
    <div id="composer">
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="给 J.A.R.V.I.S. 发消息" autofocus></textarea>
      <div id="composerbar">
        <div class="left">
          <button id="attach" class="composer-action" title="添加文件" aria-label="添加文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="right">
          <button id="model-btn" title="选择模型" aria-label="选择模型">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
            </svg>
            <span class="lbl" id="model-label">默认</span>
          </button>
          <button id="mic" class="composer-action" title="说话（⌥V）" aria-label="语音输入">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
            </svg>
          </button>
          <button id="send" title="发送消息" aria-label="发送消息" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
          </button>
        </div>
      </div>
    </div>
    <input id="file-picker" type="file" multiple hidden>
  </footer>
</div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const log = $('log'), input = $('input'), sendBtn = $('send'), dot = $('dot'),
      statusEl = $('status'), micBtn = $('mic'), stopbar = $('stopbar'),
      sleepmask = $('sleepmask'), bars = [...$('bars').children];

/* 唯一真相。UI 的每一处显示都从这里推导，不各自记一份——
   以前 busy/connected/listening 三个布尔各管一摊，停止之后总有一处没复位。 */
const S = {
  connected: false,
  state: 'offline',      // idle listening transcribing thinking executing speaking sleeping error offline
  detail: '',
  sleeping: false,
  collapsed: false,
  listening: false,
  wakeWordEnabled: true,
  hasMessages: false,
  textBeforeVoice: '',   // 开麦前输入框里已有的内容，转写要接在它后面
  pendingConfirm: null,  // 未回答的确认卡片，Esc 优先关它
  workbench: false,      // 宽屏两栏工作台
  agent: { enabled: false, workspace: '~', permission_mode: 'accept_edits',
           max_steps: 60, step: 0, todos: [] },
};

const STATUS_TEXT = {
  idle: '准备就绪', listening: '正在聆听', transcribing: '正在识别',
  thinking: '正在思考', executing: '正在执行', speaking: '正在回复',
  sleeping: '睡眠模式', error: '出错了', offline: '未连接',
};
/* 这三个状态说明"有任务在跑"，停止条和 Esc 的行为都看它 */
const BUSY = new Set(['thinking', 'executing', 'speaking']);

function post(action, extra) {
  const payload = Object.assign({ action: action }, extra || {});
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvis) {
    window.webkit.messageHandlers.jarvis.postMessage(payload);
  }
}

// 路径和命令要保住尾部（文件名、参数），但 CSS 的 direction:rtl 会把非路径
// 文本的标点顺序显示错乱：glob 模式两个星号加斜杠会被倒过来显示，工作目录
// "~/Projects/Jarvis" 会显示成 "Projects/Jarvis/~"。所以在 JS 里截，不在 CSS 里绕。
// （这段注释刻意用 // 而不是块注释：里面一旦出现斜杠星号的组合，块注释会提前闭合，
//   整个脚本从那里开始语法错误——已经踩过一次。）
function tailClip(text, max) {
  text = String(text || '');
  return text.length <= max ? text : '…' + text.slice(-(max - 1));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* 滚动位置只在一帧里读写一次。模型流式输出时过去每个 token 都会同步读取
   scrollHeight 再写 scrollTop，迫使 WebKit 连续做布局，手动从顶部滑到底部时就会
   和自动滚动互相抢。现在用 scroll 事件维护“是否贴底”，rAF 批量落一次。 */
let stickToBottom = true;
let scrollFrame = 0;
let forceNextScroll = false;
log.addEventListener('scroll', () => {
  stickToBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
}, { passive: true });

function scroll(force) {
  if (force) {
    stickToBottom = true;
    forceNextScroll = true;
  }
  if (!stickToBottom || scrollFrame) return;
  scrollFrame = requestAnimationFrame(() => {
    scrollFrame = 0;
    if (stickToBottom || forceNextScroll) log.scrollTop = log.scrollHeight;
    forceNextScroll = false;
  });
}

function clock() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* ── 渲染唯一入口 ───────────────────────────────────── */

function render() {
  const busy = BUSY.has(S.state);
  dot.dataset.state = S.state;
  statusEl.textContent = S.detail || STATUS_TEXT[S.state] || S.state;

  stopbar.classList.toggle('on', busy && !S.sleeping);
  if (busy) stopbar.querySelector('.txt').textContent = S.detail || STATUS_TEXT[S.state];

  micBtn.classList.toggle('on', S.listening);
  input.classList.toggle('hearing', S.listening);
  sleepmask.classList.toggle('on', S.sleeping);
  $('btn-sleep').classList.toggle('on', S.sleeping);

  input.disabled = S.sleeping;
  input.placeholder = S.sleeping ? '先唤醒 J.A.R.V.I.S.…'
                    : (S.agent.enabled ? '交给 J.A.R.V.I.S. 去做' : '给 J.A.R.V.I.S. 发消息');
  sendBtn.disabled = S.sleeping || (!input.value.trim() && attachments.size === 0);
  renderAgent();
}

/* ── Agent 模式 ─────────────────────────────────────── */

function renderAgent() {
  const a = S.agent;
  document.body.classList.toggle('agent', a.enabled);
  $('btn-agent').classList.toggle('on', a.enabled);
  $('btn-agent').setAttribute('aria-pressed', String(a.enabled));
  if (!a.enabled) return;

  $('agent-ws').textContent = tailClip(a.workspace || '~', 46);
  $('agent-ws').title = '工作目录：' + (a.workspace || '~') + '（点击切换）';
  // 步数只在跑起来之后才有意义，闲着时显示上限反而像在倒计时
  $('agent-step').textContent = a.step ? a.step + ' / ' + a.max_steps + ' 步' : '';
  [...$('agent-modes').children].forEach((btn) => {
    btn.classList.toggle('on', btn.dataset.mode === a.permission_mode);
  });

  const box = $('agent-todos');
  box.textContent = '';
  box.classList.toggle('on', a.todos.length > 0);
  const done = a.todos.filter((t) => t.status === 'completed').length;
  if (a.todos.length) {
    const head = el('div', 'ag-count', '待办 ' + done + '/' + a.todos.length);
    box.appendChild(head);
  }
  a.todos.forEach((todo) => {
    const cls = todo.status === 'in_progress' ? 'doing' : (todo.status === 'completed' ? 'done' : '');
    const row = el('div', 'ag-todo ' + cls);
    row.appendChild(el('span', 'box',
      todo.status === 'completed' ? '✓' : (todo.status === 'in_progress' ? '▶' : '○')));
    row.appendChild(el('span', 'txt',
      todo.status === 'in_progress' ? (todo.active_form || todo.content) : todo.content));
    box.appendChild(row);
  });
  renderRail();      // 待办有两个显示位置，改了要一起刷
}

/* ── 工作台 ─────────────────────────────────────────── */
/* 左栏是「任务跑起来之后始终要看得见」的两样东西：待办和步骤。
   窄面板里它们只能挤在顶栏或混在对话流里，长任务一滚就看不见了。 */

const MAX_TIMELINE = 200;

function setWorkbench(on) {
  S.workbench = !!on;
  document.body.classList.toggle('workbench', S.workbench);
  $('btn-wide').classList.toggle('on', S.workbench);
  $('btn-wide').setAttribute('aria-pressed', String(S.workbench));
  post('workbench', { on: S.workbench });
  renderRail();
  scroll(true);
}

function renderRail() {
  if (!S.workbench) return;
  const box = $('rail-todos');
  box.textContent = '';
  if (!S.agent.todos.length) {
    box.appendChild(el('div', 'empty', S.agent.enabled ? '还没有待办' : 'Agent 模式未开启'));
  }
  S.agent.todos.forEach((todo) => {
    const cls = todo.status === 'in_progress' ? 'doing' : (todo.status === 'completed' ? 'done' : '');
    const row = el('div', 'ag-todo ' + cls);
    row.appendChild(el('span', 'box',
      todo.status === 'completed' ? '✓' : (todo.status === 'in_progress' ? '▶' : '○')));
    row.appendChild(el('span', 'txt',
      todo.status === 'in_progress' ? (todo.active_form || todo.content) : todo.content));
    box.appendChild(row);
  });
}

const timelineNodes = new Map();

function timelineAdd(event) {
  const line = $('timeline');
  const row = el('div', 'tl' + (event.subagent ? ' sub' : ''));
  row.appendChild(el('span', 'm', '●'));
  row.appendChild(el('span', 'n', event.action || event.name));
  row.appendChild(el('span', 't', tailClip(event.target || '', 34)));
  line.appendChild(row);
  timelineNodes.set(event.id, row);
  // 步骤只增不减，长任务会堆很多。留最近的，早期的可以在对话流里翻到。
  while (line.childElementCount > MAX_TIMELINE) line.removeChild(line.firstElementChild);
  $('rail-count').textContent = line.childElementCount;
  line.scrollTop = line.scrollHeight;
}

function timelineFinish(event) {
  const row = timelineNodes.get(event.id);
  if (!row) return;
  row.classList.add(event.declined ? 'fail' : (event.success ? 'ok' : 'fail'));
  row.querySelector('.m').textContent = event.declined ? '—' : (event.success ? '✓' : '✗');
  timelineNodes.delete(event.id);
}

function timelineNote(text, cls) {
  const line = $('timeline');
  const row = el('div', 'tl ' + (cls || ''));
  row.appendChild(el('span', 'm', '◆'));
  row.appendChild(el('span', 'n', text));
  line.appendChild(row);
  line.scrollTop = line.scrollHeight;
}

/* ── 子代理 ─────────────────────────────────────────── */

const subagentNodes = new Map();

function addSubagentCard(event) {
  hideEmpty();
  if (!activeToolStack || !activeToolStack.isConnected) {
    activeToolStack = el('div', 'tool-stack');
    log.appendChild(activeToolStack);
  }
  const card = el('div', 'subagent');
  const head = el('div', 'sub-head');
  head.appendChild(el('span', 'mark', '◇'));
  head.appendChild(el('span', 'what', '子代理 · ' + (event.description || '')));
  head.appendChild(el('span', 'meta', event.scope === 'full' ? '完整权限' : '只读'));
  const body = el('div', 'sub-body');
  head.addEventListener('click', () => card.classList.toggle('folded'));
  card.append(head, body);
  activeToolStack.appendChild(card);
  subagentNodes.set(event.id, { card, head, body });
  endStreaming();
  scroll();
}

function finishSubagentCard(event) {
  const node = subagentNodes.get(event.id);
  if (!node) return;
  node.card.classList.add('done');
  node.head.querySelector('.mark').textContent = event.cancelled ? '—' : '✓';
  const meta = node.head.querySelector('.meta');
  meta.textContent = event.cancelled ? '已中断'
    : (event.steps || 0) + ' 步 · ' + Math.round((event.ms || 0) / 100) / 10 + 's';
  // 跑完就折起来：它的价值是那份结论，过程留着占地方
  node.card.classList.add('folded');
  subagentNodes.delete(event.id);
  scroll();
}

function applyAgent(payload) {
  if (!payload) return;
  const a = S.agent;
  if ('enabled' in payload) a.enabled = !!payload.enabled;
  if ('workspace' in payload) a.workspace = payload.workspace;
  if ('permission_mode' in payload) a.permission_mode = payload.permission_mode;
  if ('max_steps' in payload) a.max_steps = payload.max_steps;
  if ('todos' in payload) a.todos = payload.todos || [];
  render();
}

function setAgentMode(enabled) {
  // 本地先反应，不等 Brain 回话——切换是即时的，等一个往返会让按钮像没点上
  S.agent.enabled = !!enabled;
  if (!enabled) S.agent.todos = [];
  render();
  post('agent', { message: { type: 'set_agent_mode', enabled: !!enabled } });
}

function setState(state, detail) {
  S.state = state;
  S.detail = detail || '';
  render();
}

/* ── 空状态 ─────────────────────────────────────────── */
/* 彻底空白，没有卡片没有提示——技能入口挪到输入框的 "/" 菜单里了。 */
function showEmpty() {
  log.innerHTML = '';
}

let errorTimer = null;

/* 第一条消息出现后空状态永久隐藏，直到新会话 */
function hideEmpty() {
  S.hasMessages = true;
}

/* ── 消息 ───────────────────────────────────────────── */

function actionsRow(getText, resend, speak) {
  const row = el('div', 'acts');
  row.appendChild(el('span', null, clock()));
  const copy = el('button', null, '复制');
  copy.addEventListener('click', () => {
    navigator.clipboard.writeText(getText()).then(
      () => { copy.textContent = '已复制'; setTimeout(() => { copy.textContent = '复制'; }, 1200); },
      () => { copy.textContent = '复制失败'; });
  });
  row.appendChild(copy);
  if (resend) {
    const again = el('button', null, '重新发送');
    again.addEventListener('click', () => { input.value = getText(); render(); submit(); });
    row.appendChild(again);
  }
  if (speak) {
    const read = el('button', null, '朗读');
    // 念的是英文正文。中文那行只是给眼睛看的字幕，念出来会中英各说一遍。
    read.addEventListener('click', () => post('speak', { text: speak() }));
    row.appendChild(read);
  }
  return row;
}

function addUserMessage(text, fileNames) {
  hideEmpty();
  const msg = el('div', 'msg user');
  if (text) msg.appendChild(el('div', 'body', text));
  if (fileNames && fileNames.length) {
    const list = el('div', 'attach-list');
    fileNames.forEach((name) => {
      const chip = el('div', 'chip');
      chip.appendChild(el('span', 'n', name));
      list.appendChild(chip);
    });
    msg.appendChild(list);
  }
  msg.appendChild(actionsRow(() => text || (fileNames || []).join(', '), true));
  log.appendChild(msg);
  scroll(true);
}

let current = null;      // 正在流式接收的那条 assistant 消息
const completedAssistantIds = new Set();
const abandonedAssistantIds = new Set();

function ensureAssistant(id) {
  if (!id || completedAssistantIds.has(id) || abandonedAssistantIds.has(id)) return null;
  // 同一时刻只接受一条回答。打断后的旧 socket 数据即使晚到，也不能切回去
  // 新建第二个气泡，更不能和当前回答轮流制造多个流式光标。
  if (current) return current.id === id ? current : null;
  activeToolStack = null;
  hideEmpty();
  const msg = el('div', 'msg assistant streaming');
  const reasoning = el('div', 'reasoning');
  reasoning.style.display = 'none';
  reasoning.addEventListener('click', () => reasoning.classList.toggle('open'));
  const body = el('div', 'body'), zh = el('div', 'zh');
  msg.append(reasoning, body, zh);
  msg.appendChild(actionsRow(
      () => body.textContent + (zh.textContent ? '\n' + zh.textContent : ''),
      false, () => body.textContent));
  log.appendChild(msg);
  current = { id, msg, body, reasoning, zh };
  return current;
}

function endStreaming(id) {
  if (id && current && current.id !== id) return;
  if (current) {
    current.msg.classList.remove('streaming');
    if (id) completedAssistantIds.add(id);
  }
  current = null;
}

function abandonStreaming() {
  if (current) abandonedAssistantIds.add(current.id);
  endStreaming();
}

/* 提示不调 hideEmpty：「没听清」「播报失败」这类是系统提示，不是对话内容。
   一进面板就撞上一条提示，不该把快捷指令连带清掉。
   只有真正的消息（用户 / 回复 / 工具卡片）才让空状态退场。 */
function addNotice(text, bad) {
  const node = el('div', 'notice' + (bad ? ' bad' : ''), text);
  log.appendChild(node);
  scroll();
  return node;
}

/* ── 工具卡片 ───────────────────────────────────────── */

const toolNodes = new Map();
let activeToolStack = null;

function addToolCard(event) {
  hideEmpty();
  // 属于某个子代理的工具，收进那个子代理的折叠区；找不到宿主子代理
  // （比如面板是中途连上的）就退回主线，别把卡片丢掉。
  const owner = event.subagent ? subagentNodes.get(event.subagent) : null;
  if (!owner && (!activeToolStack || !activeToolStack.isConnected)) {
    activeToolStack = el('div', 'tool-stack');
    log.appendChild(activeToolStack);
  }
  const card = el('div', 'tool');
  const head = el('div', 'tool-head');
  head.appendChild(el('span', 'mark', '●'));
  head.appendChild(el('span', 'what', event.action || event.name));
  head.appendChild(el('span', 'target', tailClip(event.target || '', 56)));
  head.appendChild(el('span', 'ms', ''));
  card.appendChild(head);
  const steps = el('div', 'steps');
  card.appendChild(steps);
  (owner ? owner.body : activeToolStack).appendChild(card);
  toolNodes.set(event.id, { card, head, steps });
  if (!owner) endStreaming();   // 工具之后模型会另起一段；子代理内部不打断主线气泡
  scroll();
  return toolNodes.get(event.id);
}

/* 步骤只记真实发生过的事。文档 §10.2 说得很清楚：
   只展示可验证的系统动作，不展示模型的私有思维过程——
   所以这里不会出现"正在校验工具权限"这种没人能验证的步骤。 */
function addStep(id, text, cls) {
  const node = toolNodes.get(id);
  if (!node) return;
  const step = el('div', cls || '', text);
  node.steps.appendChild(step);
  scroll();
  return step;
}

function finishTool(event) {
  const node = toolNodes.get(event.id);
  if (!node) return;
  const cancelled = !!event.declined;
  node.card.classList.add(cancelled ? 'cancel' : (event.success ? 'ok' : 'fail'));
  node.head.querySelector('.mark').textContent = cancelled ? '—' : (event.success ? '✓' : '✗');
  if (event.ms) node.head.querySelector('.ms').textContent = event.ms + 'ms';
  if (!event.success) addStep(event.id, event.summary || '执行失败', 'fail');
  else if (node.steps.childElementCount === 0 && !event.payload) addStep(event.id, '完成', 'done');
  const payload = event.payload;
  if (payload) {
    if (payload.kind === 'files') renderFiles(node.card, payload);
    else if (payload.kind === 'diff') renderDiff(node.card, payload);
    else if (payload.kind === 'matches') renderMatches(node.card, payload);
    else if (payload.kind === 'shell') renderShell(node, payload);
  }
  toolNodes.delete(event.id);
  scroll();
}

/* 每行按 +/-/@ 上色。整段当纯文本塞进去就只是一堆看不出改了什么的字，
   而 diff 恰恰是"一眼看出改动"才有价值。 */
function renderDiff(card, payload) {
  const wrap = el('div', 'diff');
  const pre = el('pre');
  (payload.diff || '').split('\n').forEach((line) => {
    let cls = '';
    if (line.startsWith('+++') || line.startsWith('---')) cls = '';
    else if (line.startsWith('+')) cls = 'ln-add';
    else if (line.startsWith('-')) cls = 'ln-del';
    else if (line.startsWith('@@')) cls = 'ln-hunk';
    const row = el('div', cls, line);
    pre.appendChild(row);
  });
  wrap.appendChild(pre);

  const acts = el('div', 'diff-acts');
  const stat = el('span', 'stat',
    '+' + (payload.added || 0) + ' −' + (payload.removed || 0) +
    (payload.truncated ? ' · diff 过长已截断' : ''));
  acts.appendChild(stat);
  if (payload.undoable && payload.path) {
    const undo = el('button', null, '撤销这次改动');
    undo.addEventListener('click', () => {
      undo.disabled = true;
      undo.textContent = '已请求撤销';
      post('agent', { message: { type: 'undo_edit', path: payload.path } });
    });
    acts.appendChild(undo);
  }
  wrap.appendChild(acts);
  card.appendChild(wrap);
}

function renderMatches(card, payload) {
  const wrap = el('div', 'term');
  const pre = el('pre', null, (payload.lines || []).join('\n'));
  wrap.appendChild(pre);
  if (payload.total > (payload.lines || []).length) {
    wrap.appendChild(el('div', 'exit', '共 ' + payload.total + ' 行，只显示前 ' + payload.lines.length + ' 行'));
  }
  card.appendChild(wrap);
}

/* 命令输出：实时流已经画过的那块直接复用，只补最终状态。
   再画一遍的话同一条命令的输出会在卡片里出现两次。 */
function renderShell(node, payload) {
  let term = node.card.querySelector('.term');
  if (!term) {
    term = el('div', 'term');
    term.appendChild(el('pre', null, payload.output || ''));
    node.card.appendChild(term);
  } else if (!node.streamed) {
    term.querySelector('pre').textContent = payload.output || '';
  }
  const code = payload.exit_code;
  if (code !== undefined && code !== null) {
    term.appendChild(el('div', 'exit' + (code === 0 ? '' : ' bad'), '退出码 ' + code));
  }
}

/* 命令还在跑时的实时回显。滚动只在用户没有自己往上翻时才跟着走。 */
function appendToolOutput(id, text) {
  const node = toolNodes.get(id);
  if (!node || !text) return;
  let term = node.card.querySelector('.term');
  if (!term) {
    term = el('div', 'term');
    term.appendChild(el('pre'));
    node.card.appendChild(term);
  }
  const pre = term.querySelector('pre');
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 24;
  pre.textContent += text;
  if (atBottom) pre.scrollTop = pre.scrollHeight;
  node.streamed = true;
  scroll();
}

function renderFiles(card, payload) {
  const wrap = el('div', 'files');
  const selected = new Set();

  payload.items.forEach((item) => {
    const row = el('div', 'file');
    row.appendChild(el('span', 'tick', '✓'));
    row.appendChild(el('span', 'n', item.name || item.path));
    row.appendChild(el('span', 'p', tailClip(item.path, 40)));
    row.addEventListener('click', () => {
      if (selected.has(item.path)) { selected.delete(item.path); row.classList.remove('sel'); }
      else { selected.add(item.path); row.classList.add('sel'); }
      sync();
    });
    wrap.appendChild(row);
  });

  const acts = el('div', 'file-acts');
  const reveal = el('button', null, '在访达中显示');
  const open = el('button', null, '打开所选');
  acts.append(reveal, open);
  wrap.appendChild(acts);

  // 一条都没选时两个按钮都是灰的——否则"打开所选"要么无声无息，要么得猜用户想开哪个
  function sync() {
    const none = selected.size === 0;
    reveal.disabled = none; open.disabled = none;
    open.textContent = none ? '打开所选' : '打开所选 (' + selected.size + ')';
  }
  reveal.addEventListener('click', () =>
    selected.forEach((path) => post('open_path', { path: path, reveal: true })));
  open.addEventListener('click', () =>
    selected.forEach((path) => post('open_path', { path: path, reveal: false })));
  sync();

  if (payload.total > payload.items.length) {
    const more = el('div', 'file');
    more.style.cursor = 'default';
    more.appendChild(el('span', 'tick'));
    more.appendChild(el('span', 'n', '共 ' + payload.total + ' 条，只列出前 ' + payload.items.length + ' 条'));
    wrap.insertBefore(more, acts);
  }
  card.appendChild(wrap);
}

/* ── 确认框 ─────────────────────────────────────────── */

function renderConfirm(event) {
  hideEmpty();
  const card = el('div', 'confirm');
  card.appendChild(el('div', 'head', '需要确认 · 风险 ' + (event.risk || 'L2')));

  const dl = el('dl');
  const pair = (label, value, cls) => {
    if (!value) return;
    dl.appendChild(el('dt', null, label));
    dl.appendChild(el('dd', cls, value));
  };
  pair('操作', event.action || event.name);
  pair('目标', event.target || '（未给出）', 'mono');
  // 撤法写不出来就直说。含糊的安慰比没有更危险。
  pair('可恢复', event.recover || '无法自动撤销', event.recover ? '' : 'no-undo');
  card.appendChild(dl);

  const row = el('div', 'row');
  const no = el('button', null, '取消');
  const yes = el('button', 'yes', '确认执行');
  row.append(no, yes);
  // 一个任务里同一类操作要点十几次头，人就会直接去开"全免确认"——那是把所有闸
  // 一起拆掉。这个按钮只放行这一个工具，且新会话即失效。
  const always = el('button', null, '本次会话内总是允许');
  if (S.agent.enabled) row.appendChild(always);
  card.appendChild(row);

  const answer = (approved, scope) => {
    if (S.pendingConfirm !== entry) return;
    S.pendingConfirm = null;
    post('confirm', { request_id: event.request_id, approved: approved, scope: scope || 'once' });
    card.classList.add('done');
    card.querySelector('.head').textContent = !approved ? '已取消，未做任何修改'
      : (scope === 'session' ? '已确认，本次会话内不再询问' : '已确认执行');
    addStep(event.id, approved ? '你确认了这次操作' : '你取消了这次操作', approved ? 'done' : 'fail');
  };
  const entry = { answer: answer };
  S.pendingConfirm = entry;

  yes.addEventListener('click', () => answer(true));
  no.addEventListener('click', () => answer(false));
  always.addEventListener('click', () => answer(true, 'session'));

  log.appendChild(card);
  scroll(true);
}

/* ── 附件 ───────────────────────────────────────────── */
/* Codex 式“＋”按钮、拖拽、粘贴三个入口最后都汇到 addFiles。纯文本类格式（txt/md/html/
   代码文件……不做白名单，读不出文本再报错）直接在页面里用 File.text() 读；
   doc/docx/pdf/rtf 这些要解析文档结构的格式，字节转 base64 交给宿主用
   PDFKit / NSAttributedString 原生解析——不为了这个给 Brain 添 Python 依赖。 */
const NATIVE_FILE_EXT = new Set(['pdf', 'doc', 'docx', 'rtf']);
const MAX_FILE_BYTES = 20 * 1024 * 1024;
const MAX_ATTACH_CHARS = 60000;

const attachments = new Map();   // id -> { name, status: loading|ready|error, text, error }
let attachSeq = 0;

function extOf(name) {
  const i = name.lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
}

function clip(text) {
  return text.length > MAX_ATTACH_CHARS
    ? text.slice(0, MAX_ATTACH_CHARS) + '\n…（内容过长，已截断）'
    : text;
}

function renderAttachments() {
  const bar = $('attachments');
  bar.innerHTML = '';
  bar.classList.toggle('on', attachments.size > 0);
  attachments.forEach((a, id) => {
    const chip = el('div', 'chip' + (a.status !== 'ready' ? ' ' + a.status : ''));
    chip.title = a.status === 'error' ? a.error : a.name;
    chip.appendChild(el('span', 'n', a.name));
    const remove = el('button', null, '✕');
    remove.title = '移除';
    remove.addEventListener('click', () => { attachments.delete(id); renderAttachments(); });
    chip.appendChild(remove);
    bar.appendChild(chip);
  });
  render();
}

function addFiles(fileList) {
  [...fileList].forEach((file) => {
    const id = 'att_' + (++attachSeq);
    const entry = { name: file.name, status: 'loading', text: '', error: '' };
    attachments.set(id, entry);

    if (file.size > MAX_FILE_BYTES) {
      entry.status = 'error'; entry.error = '文件太大（>20MB）';
      renderAttachments();
      return;
    }

    const ext = extOf(file.name);
    if (NATIVE_FILE_EXT.has(ext)) {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1] || '';
        post('extract_file', { request_id: id, name: file.name, ext: ext, data_base64: base64 });
      };
      reader.onerror = () => { entry.status = 'error'; entry.error = '读取失败'; renderAttachments(); };
      reader.readAsDataURL(file);
    } else {
      file.text().then((text) => {
        entry.status = 'ready'; entry.text = clip(text);
        renderAttachments();
      }).catch(() => {
        entry.status = 'error'; entry.error = '不是文本文件'; renderAttachments();
      });
    }
  });
  renderAttachments();
}

$('attach').addEventListener('click', () => $('file-picker').click());
$('file-picker').addEventListener('change', (event) => {
  if (event.target.files && event.target.files.length) addFiles(event.target.files);
  event.target.value = '';              // 同一个文件移除后还能再次选择
});

/* 宿主用 PDFKit / NSAttributedString 解析完 doc/docx/pdf/rtf 后回调这里 */
window.__jarvisFileExtracted = (id, ok, payload) => {
  const entry = attachments.get(id);
  if (!entry) return;
  if (ok) { entry.status = 'ready'; entry.text = clip(payload || ''); }
  else    { entry.status = 'error'; entry.error = payload || '解析失败'; }
  renderAttachments();
};

['dragenter', 'dragover'].forEach((type) => document.addEventListener(type, (event) => {
  if (!event.dataTransfer || !event.dataTransfer.types.includes('Files')) return;
  event.preventDefault();
  document.body.classList.add('dragging');
}));
['dragleave', 'drop'].forEach((type) => document.addEventListener(type, () => {
  document.body.classList.remove('dragging');
}));
document.addEventListener('drop', (event) => {
  if (!event.dataTransfer || !event.dataTransfer.files.length) return;
  event.preventDefault();
  addFiles(event.dataTransfer.files);
});

/* 只拦有文件的粘贴；纯文本粘贴照旧交给输入框自己处理，别手抖抢了 */
document.addEventListener('paste', (event) => {
  const files = event.clipboardData && event.clipboardData.files;
  if (!files || !files.length) return;
  event.preventDefault();
  addFiles(files);
});

/* ── 技能 / 常用短语（输入框敲 "/" 触发）──────────────── */
/* 没有单独的管理界面了：三条预设技能来自宿主的 ~/.jarvis/skills.json
   （改配置文件才能动），剩下全靠"你实际发过的话"按频率自动涌现——
   宿主每次真正发消息后都会重推一份最新的高频列表，这里只管展示和挑选。 */
let SKILLS = [];      // [{id, text}]
let FREQUENT = [];    // [{text, count}]，宿主已经按频率降序排过
let skillMenuItems = [];
let skillMenuIndex = -1;

function applySkills(items) {
  if (Array.isArray(items)) SKILLS = items;
}

function applyUsage(items) {
  if (Array.isArray(items)) FREQUENT = items;
  if (input.value.startsWith('/')) renderSkillMenu();   // 菜单开着就跟着刷新
}

function skillMenuCandidates(query) {
  const seen = new Set();
  const out = [];
  SKILLS.forEach((s) => {
    if (seen.has(s.text)) return;
    seen.add(s.text); out.push({ text: s.text, tag: '常用' });
  });
  FREQUENT.forEach((f) => {
    if (seen.has(f.text)) return;
    seen.add(f.text); out.push({ text: f.text, tag: '常说' });
  });
  const q = query.trim().toLowerCase();
  return (q ? out.filter((item) => item.text.toLowerCase().includes(q)) : out).slice(0, 8);
}

function renderSkillMenu() {
  skillMenuItems = skillMenuCandidates(input.value.slice(1));
  const menu = $('skillMenu');
  menu.innerHTML = '';
  if (!skillMenuItems.length) { menu.classList.remove('on'); skillMenuIndex = -1; return; }
  skillMenuIndex = Math.min(Math.max(skillMenuIndex, 0), skillMenuItems.length - 1);
  skillMenuItems.forEach((item, i) => {
    const row = el('div', 'skill-item' + (i === skillMenuIndex ? ' sel' : ''));
    row.appendChild(el('span', 'tag', item.tag));
    row.appendChild(el('span', 'txt', item.text));
    // mousedown 而不是 click：抢在 input 的 blur 前面，不然菜单会先一步被 blur 关掉
    row.addEventListener('mousedown', (event) => { event.preventDefault(); pickSkillMenuItem(i); });
    menu.appendChild(row);
  });
  menu.classList.add('on');
  // 菜单最高 220px，条目多了就会滚动。方向键改的只是 .sel 这个类，不把选中项
  // 滚进可视区的话，往下按几下选中项就划出去了——看着像"选择跑丢了"。
  // block:'nearest' = 只在真的看不见时才滚，已经可见就不动，不会每按一下就跳。
  const selected = menu.children[skillMenuIndex];
  if (selected) selected.scrollIntoView({ block: 'nearest' });
}

function closeSkillMenu() {
  $('skillMenu').classList.remove('on');
  $('skillMenu').innerHTML = '';
  skillMenuItems = [];
  skillMenuIndex = -1;
}

function pickSkillMenuItem(i) {
  const item = skillMenuItems[i];
  if (!item) return;
  input.value = item.text;
  closeSkillMenu();
  input.dispatchEvent(new Event('input'));
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

/* ── 模型选择 ───────────────────────────────────────── */
/* Brain 每次连上、以及每次 set_model/add_model/remove_model 之后都会重推一份
   完整列表（ready 事件带一份、models 事件是后续更新），这里只管展示和挑选——
   "当前用哪个模型"这件事的唯一真相在 Brain 那边，页面不自己猜。 */
let MODELS = { active: 'default', items: [{ id: 'default', label: '默认', model: '', builtin: true }] };
let editingModelId = null;

function applyModels(payload) {
  if (!payload) return;
  if (payload.active) MODELS.active = payload.active;
  if (Array.isArray(payload.items)) MODELS.items = payload.items;
  const current = MODELS.items.find((m) => m.id === MODELS.active);
  $('model-label').textContent = current ? current.label : '默认';
  if ($('modelMenu').classList.contains('on')) renderModelMenu();   // 菜单开着就跟着刷新
}

function renderModelMenu() {
  const menu = $('modelMenu');
  menu.innerHTML = '';
  MODELS.items.forEach((m) => {
    const row = el('div', 'model-item' + (m.id === MODELS.active ? ' active' : ''));
    row.appendChild(el('span', 'tick', '✓'));
    row.appendChild(el('span', 'txt', m.model ? `${m.label}  ${m.model}` : m.label));
    row.addEventListener('click', () => {
      post('set_model', { id: m.id });
      closeModelMenu();
    });
    if (!m.builtin) {
      const actions = el('span', 'model-actions');
      const edit = el('button', 'edit', '查看 / 修改');
      edit.addEventListener('click', (event) => {
        event.stopPropagation();
        openModelForm(m);
      });
      const del = el('button', 'del', '删除');
      del.addEventListener('click', (event) => {
        event.stopPropagation();
        if (del.dataset.confirm !== 'yes') {
          del.dataset.confirm = 'yes';
          del.textContent = '确认删除';
          del.classList.add('confirm');
          setTimeout(() => {
            del.dataset.confirm = '';
            del.textContent = '删除';
            del.classList.remove('confirm');
          }, 3000);
          return;
        }
        post('remove_model', { id: m.id });
      });
      actions.appendChild(edit);
      actions.appendChild(del);
      row.appendChild(actions);
    }
    menu.appendChild(row);
  });
  const add = el('div', 'model-add', '＋ 添加模型');
  add.addEventListener('click', () => openModelForm(null));
  menu.appendChild(add);
}

function openModelMenu() {
  closeSkillMenu();
  renderModelMenu();
  $('modelMenu').classList.add('on');
  $('model-btn').classList.add('on');
}
function closeModelMenu() {
  $('modelMenu').classList.remove('on');
  $('modelMenu').innerHTML = '';
  $('model-btn').classList.remove('on');
}
function toggleModelMenu() {
  if ($('modelMenu').classList.contains('on')) closeModelMenu();
  else openModelMenu();
}

function openModelForm(model) {
  closeModelMenu();
  editingModelId = model && model.id ? model.id : null;
  $('model-form-label').value = model ? (model.label || '') : '';
  $('model-form-url').value = model ? (model.base_url || '') : '';
  $('model-form-key').value = '';
  $('model-form-key').placeholder = editingModelId && model.has_api_key
    ? 'API Key（已保存，留空不修改）' : 'API Key';
  $('model-form-model').value = model ? (model.model || '') : '';
  $('model-form-hint').textContent = editingModelId
    ? '查看 / 修改模型配置 · API Key 不会回显' : '添加模型 · 仅支持 OpenAI 兼容协议 API';
  $('model-form-save').textContent = editingModelId ? '保存修改' : '添加';
  $('modelForm').classList.add('on');
  $('model-form-label').focus();
}
function closeModelForm() {
  $('modelForm').classList.remove('on');
  editingModelId = null;
}
function submitModelForm() {
  const label = $('model-form-label').value.trim();
  const base_url = $('model-form-url').value.trim();
  const api_key = $('model-form-key').value.trim();
  const model = $('model-form-model').value.trim();
  if (!label || !base_url || !model) {
    addNotice('名称、Base URL、模型名称都不能为空', true);
    return;
  }
  post(editingModelId ? 'update_model' : 'add_model', {
    id: editingModelId, label: label, base_url: base_url, api_key: api_key, model: model
  });
  closeModelForm();
}

$('model-btn').addEventListener('click', toggleModelMenu);
$('model-form-cancel').addEventListener('click', closeModelForm);
$('model-form-save').addEventListener('click', submitModelForm);

// 点菜单/表单以外的地方直接关掉，跟大多数下拉菜单的习惯一致
document.addEventListener('click', (event) => {
  if ($('modelMenu').classList.contains('on') &&
      !event.target.closest('#modelMenu') && !event.target.closest('#model-btn')) {
    closeModelMenu();
  }
  if ($('moreMenu').classList.contains('on') &&
      !event.target.closest('#moreMenu') && !event.target.closest('#btn-more')) {
    closeMoreMenu();
  }
});

/* ── 发送 ───────────────────────────────────────────── */

function submit() {
  const text = input.value.trim();
  closeSkillMenu();
  if ([...attachments.values()].some(a => a.status === 'loading')) {
    addNotice('文件还在解析，等一下再发', true);
    return;
  }
  const ready = [...attachments.values()].filter(a => a.status === 'ready');
  if (!text && ready.length === 0) return;
  if (S.sleeping) { addNotice('J.A.R.V.I.S. 在睡眠中，先点顶栏的 ☾ 唤醒', true); return; }
  if (!S.connected) { addNotice('大脑未连接，稍等或从菜单栏重启大脑', true); return; }

  // 文档 §7.2：上一任务还在跑就先取消它，再发新的
  if (BUSY.has(S.state)) post('cancel');

  addUserMessage(text, [...attachments.values()].map(a => a.name));

  // 面板里只显示用户敲的字和文件名，实际发给大脑的文本把附件内容拼在后面——
  // 效果等价于用户自己把文件内容粘贴进对话框，Brain 端不用改协议。
  let payload = text;
  if (ready.length) {
    const blocks = ready.map(a => `[附件：${a.name}]\n${a.text}`).join('\n\n');
    payload = payload ? payload + '\n\n' + blocks : blocks;
  }

  input.value = '';
  input.style.height = 'auto';
  attachments.clear();
  renderAttachments();
  abandonStreaming();
  setState('thinking');
  post('submit', { text: payload });
}

sendBtn.addEventListener('click', submit);
$('btn-stop').addEventListener('click', stopTask);

function stopTask() {
  post('cancel');
  abandonStreaming();
  setState(S.connected ? 'idle' : 'offline');
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  if (input.value.startsWith('/')) renderSkillMenu(); else closeSkillMenu();
  render();
});

input.addEventListener('blur', closeSkillMenu);

input.addEventListener('keydown', (event) => {
  if ($('skillMenu').classList.contains('on')) {
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      skillMenuIndex = Math.min(skillMenuIndex + 1, skillMenuItems.length - 1);
      renderSkillMenu();
      return;
    }
    if (event.key === 'ArrowUp') {
      event.preventDefault();
      skillMenuIndex = Math.max(skillMenuIndex - 1, 0);
      renderSkillMenu();
      return;
    }
    if (event.key === 'Enter' && !event.shiftKey && !event.metaKey && !event.ctrlKey
        && !event.altKey && !event.isComposing) {
      event.preventDefault();
      pickSkillMenuItem(skillMenuIndex);
      return;
    }
    if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();   // 别让这下 Esc 又顺带触发面板级的停止/收起
      closeSkillMenu();
      return;
    }
  }
  if (event.key !== 'Enter' || event.isComposing) return;

  // 唯一规则：Enter 发送；Option+Enter 插入换行。
  if (event.altKey) return;
  event.preventDefault();
  submit();
});

/* ── 顶栏按钮 ───────────────────────────────────────── */

$('btn-new').addEventListener('click', () => post('new_session'));
$('btn-sleep').addEventListener('click', () => post('sleep', { sleeping: !S.sleeping }));
sleepmask.addEventListener('click', () => post('sleep', { sleeping: false }));
micBtn.addEventListener('click', () => post('voice_toggle'));

$('btn-collapse').addEventListener('click', () => setCollapsed(!S.collapsed));

/* 收起后留顶栏 + 输入区（迷你对话框，还能打字/拖文件）。高度由这里量、
   传给宿主去缩窗口——写死一个数字迟早会和 CSS 对不上，差一点就切掉半行内容。
   顺序很关键：class 先切，offsetHeight 才是收起态之后的真实高度。 */
function setCollapsed(collapsed) {
  S.collapsed = collapsed;
  // 两个方向都用「展开态的布局」跑动画，收起态那一套只在动画结束时才落地：
  //
  //   展开：先摘掉 .collapsed，#body 立刻回到 flex:1（此刻高度是 0），
  //         footer 因此立刻回到窗口底边；然后窗口往上长，对话区从 0 长出来。
  //         以前是动画跑完才摘 .collapsed，于是动画全程 footer 都吊在顶栏下面，
  //         最后一帧才"掉"到底部——用户看到的就是输入框从上面砸下来。
  //   收起：保持展开布局，让 #body 随窗口缩到 0，结束后再加 .collapsed
  //         （那时它已经是 0 高，加不加视觉上没有区别）。
  //
  // 无论哪个方向，动画期间只有对话区在变尺寸，输入框和顶栏都不动。
  document.body.classList.add('resizing');
  if (!collapsed) document.body.classList.remove('collapsed');
  applyCompactHeight();       // 必须在量高度之前：紧凑排版会改变顶栏和输入区的高度
  $('btn-collapse').textContent = '⌃';
  $('btn-collapse').classList.toggle('collapsed', collapsed);
  $('btn-collapse').setAttribute('aria-expanded', String(!collapsed));
  $('btn-collapse').title = collapsed ? '展开面板' : '收起面板';
  reportCollapsedHeight(true);
  // 输入框在收起态也还留着，两种状态都值得把焦点给它，省一次点击
  input.focus();
}

/* 迷你态只保留固定的顶栏和单行输入框。语音停止条、附件等不会再改变窗口高度，
   避免语音交互时 ResizeObserver 与原生动画互相追逐。 */
/* 矮窗口的紧凑排版由这里决定，不交给媒体查询——原因见 body.short 那段注释。
   收起态和动画期间一律不启用：那两种情况下窗口本来就矮，再套一层紧凑排版，
   收起高度的计算和实际布局就对不上了。 */
function applyCompactHeight() {
  const compact = !S.collapsed
                  && !document.body.classList.contains('resizing')
                  && window.innerHeight < 460;
  document.body.classList.toggle('short', compact);
}
window.addEventListener('resize', applyCompactHeight);

let collapsedResizeFrame = 0;
function reportCollapsedHeight(animated = false) {
  if (collapsedResizeFrame) cancelAnimationFrame(collapsedResizeFrame);
  collapsedResizeFrame = requestAnimationFrame(() => {
    collapsedResizeFrame = 0;
    // 收起后要留下的高度 = #shell 里除对话区之外、所有在文档流里的块加起来。
    //
    // 不能写成"整个面板减去对话区"：收起之后 #body 是 display:none、高度为 0，
    // 那个算式会退化成"当前窗口高度"，于是永远报回自己现在的高度——Agent 状态带
    // 出现或者输入框换行都撑不开窗口，多出来的部分被窗口下沿切掉。
    // 逐块相加则两种状态下都成立，也自动涵盖透明度滑块、唤醒方式这些临时展开的块。
    let chrome = 0;
    for (const child of document.getElementById('shell').children) {
      if (child.id === 'body') continue;
      const style = getComputedStyle(child);
      if (style.display === 'none' || style.position === 'absolute') continue;
      chrome += child.getBoundingClientRect().height;
    }
    post('collapse', { collapsed: S.collapsed, chrome: Math.round(chrome), animated });
  });
}

/* 收起态的窗口高度 = 顶栏 + Agent 状态带 + 输入区。这三样都会自己变高：
   输入框随着换行长，Agent 状态带在开关 Agent 模式时整块出现或消失。
   不跟着重报高度的话，长出来的部分会被窗口下沿直接切掉——收起态恰恰是最常
   打字的状态，这个必须跟。展开态不用管，多出来的高度由对话区自己吸收。

   不会来回震荡：这三块的高度只取决于内容，不取决于窗口高度，所以宿主改完
   窗口尺寸之后它们不再变化，观察者也就不会再触发。 */
const chromeObserver = new ResizeObserver(() => {
  // 动画期间一律不报。窗口高度在动画里是连续变化的，任何跟高度相关的样式变化都会
  // 触发这里；报上去等于在动画中途换目标，宿主会重新起一段动画——那就是肉眼可见的
  // 卡顿。等 collapse_complete 落地之后再说。
  if (S.collapsed && !document.body.classList.contains('resizing')) {
    reportCollapsedHeight(false);                  // 打字时不要动画，跟手就行
  }
});
[document.querySelector('header'), document.querySelector('footer'), $('agentBar')]
  .forEach((node) => chromeObserver.observe(node));

/* ── 顶栏工具条：放不下就收进「⋯」 ─────────────────── */
/* 面板宽度从 360（最小）到 860（工作台）都要能用，而按钮只会越加越多。
   写死一套 @media 断点意味着每加一个按钮就要重算一遍断点；这里改成量出来：
   溢出了就按优先级往菜单里收一个，再量，直到不溢出。

   收起顺序 = 使用频率的倒序。Agent / 工作台 / 新建 / 收起是每天要点的，
   透明度、唤醒方式、睡眠是设一次就不动的，所以先收后者。
   「⋯」自己永远留在外面——它是溢出的出口，被收掉就没救了。 */
const TOOL_ORDER = ['btn-agent', 'btn-wide', 'btn-opacity', 'btn-wake',
                    'btn-sleep', 'btn-new', 'btn-collapse'];
const OVERFLOW_ORDER = ['btn-sleep', 'btn-wake', 'btn-opacity'];

function placeTools(count) {
  const tools = $('tools'), menu = $('moreMenu'), more = $('btn-more');
  const hidden = new Set(OVERFLOW_ORDER.slice(0, count));
  TOOL_ORDER.forEach((id) => {
    const node = $(id);
    if (!hidden.has(id) && node.parentElement !== tools) tools.insertBefore(node, more);
  });
  // 顺序要按 TOOL_ORDER 重排，否则从菜单挪回来的按钮会排到队尾
  TOOL_ORDER.filter((id) => !hidden.has(id)).forEach((id) => tools.insertBefore($(id), more));
  OVERFLOW_ORDER.filter((id) => hidden.has(id)).forEach((id) => menu.appendChild($(id)));
  more.style.display = count ? '' : 'none';
  if (!count) closeMoreMenu();
}

/* 让位是有先后的，按"丢了最不心疼"排：
   先把低频按钮收进「⋯」，最后才摘掉品牌字样和电平条。
   状态文字永远不牺牲，所以它有 min-width，挤不下就算溢出。 */
const TOOLBAR_LEVELS = [
  { bars: true,  condensed: false, tight: false, overflow: 0 },  // 全都在
  { bars: false, condensed: false, tight: false, overflow: 0 },  // 摘电平条：球体和麦克风按钮已经在报同一件事
  { bars: false, condensed: true,  tight: false, overflow: 0 },  // 收紧品牌字距
  { bars: false, condensed: true,  tight: false, overflow: 1 },  // 低频按钮往「⋯」里收
  { bars: false, condensed: true,  tight: false, overflow: 2 },
  { bars: false, condensed: true,  tight: false, overflow: 3 },
  { bars: false, condensed: true,  tight: true,  overflow: 3 },  // 最后才整块舍掉品牌
];
let toolbarLevel = -1;

let lastToolbarWidth = -1;

function reflowToolbar() {
  const header = document.querySelector('header');
  // 只有宽度变了才需要重排。收起/展开只改高度，观察者却照样会触发；工作台的
  // 加宽动画则是每帧都触发——不挡一下的话，每帧要跑最多 7 轮"挪按钮 + 强制布局"，
  // 那本身就够卡了。
  const width = Math.round(header.clientWidth);
  if (width === lastToolbarWidth) return;
  lastToolbarWidth = width;

  for (let i = 0; i < TOOLBAR_LEVELS.length; i++) {
    const level = TOOLBAR_LEVELS[i];
