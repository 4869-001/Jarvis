    header.classList.toggle('no-bars', !level.bars);
    header.classList.toggle('condensed', level.condensed);
    header.classList.toggle('tight', level.tight);
    placeTools(level.overflow);
    // flex 项目都是 flex:none（状态文字有 min-width），压不扁只会溢出，
    // 所以 scrollWidth 超过 clientWidth 就是真的放不下了
    if (header.scrollWidth <= header.clientWidth + 1 || i === TOOLBAR_LEVELS.length - 1) {
      if (toolbarLevel !== i) {
        toolbarLevel = i;
        reportDragZones();     // 按钮位置变了，宿主的拖拽挖洞矩形要跟着更新
      }
      return;
    }
  }
}

function closeMoreMenu() {
  $('moreMenu').classList.remove('on');
  $('btn-more').setAttribute('aria-expanded', 'false');
}

$('btn-more').addEventListener('click', (event) => {
  event.stopPropagation();
  const open = $('moreMenu').classList.toggle('on');
  $('btn-more').setAttribute('aria-expanded', String(open));
});
// 菜单里点了任何一项就收起菜单：这些动作要么弹出另一块面板（透明度、唤醒方式），
// 要么立刻生效（睡眠），菜单继续挂着只会挡住结果。
$('moreMenu').addEventListener('click', () => closeMoreMenu());

/* ── 顶栏拖拽 ───────────────────────────────────────── */
/* WKWebView 不认 -webkit-app-region（那是 Chromium 的私货），窗口拖拽只能靠
   宿主原生做。这里把顶栏矩形和顶栏里"不可拖"的按钮矩形量出来交给宿主，
   宿主拿去做命中测试的挖洞。窗口宽度一变（面板可调宽），顶栏和按钮位置全变，
   所以用 ResizeObserver 盯着顶栏，而不是只在启动时量一次。 */
const headerEl = document.querySelector('header');
function reportDragZones() {
  const rectOf = (node) => {
    const r = node.getBoundingClientRect();
    return { x: r.left, y: r.top, w: r.width, h: r.height };
  };
  post('drag_zones', {
    header: rectOf(headerEl),
    buttons: [...headerEl.querySelectorAll('button')].map(rectOf),
  });
}
new ResizeObserver(() => { reflowToolbar(); reportDragZones(); }).observe(headerEl);
reflowToolbar();
reportDragZones();

/* ── 透明度 ─────────────────────────────────────────── */
/* 滑块只负责把值交给宿主：毛玻璃层的 alpha 只有 AppKit 能调。
   宿主改完回一条 opacity 事件，页面按它更新暗色衬底和滑块位置，
   于是"宿主存的值"永远是唯一真相，不会和界面对不上。 */
const opacityRange = $('opacity-range'), opacityValue = $('opacity-value');
$('btn-opacity').addEventListener('click', () => {
  const open = $('opacity').classList.toggle('on');
  $('btn-opacity').classList.toggle('on', open);
  if (open) {
    $('wakeMode').classList.remove('on');
    $('btn-wake').classList.toggle('on', !S.wakeWordEnabled);
  }
});
opacityRange.addEventListener('input', () => {
  const value = opacityRange.value / 100;
  applyTint(value);
  post('set_opacity', { value: value });
});
/* 暗色衬底跟着走，但不是线性的：毛玻璃淡下去之后文字直接压在壁纸上，
   衬底如果也归零就没法看了，所以最低留一点。 */
function applyTint(value) {
  document.documentElement.style.setProperty('--tint', (0.12 + 0.58 * value).toFixed(3));
  opacityValue.textContent = Math.round(value * 100) + '%';
}

/* ── 唤醒方式 ───────────────────────────────────────── */
/* 和透明度一个模式：这里只发请求，宿主真正切换唤醒词监听后回一条 wake_word
   事件，页面照它刷新——避免用户点了但宿主因为权限/模型缺失没生效时，
   界面却已经"看起来"切换成功。 */
$('btn-wake').addEventListener('click', () => {
  const open = $('wakeMode').classList.toggle('on');
  $('btn-wake').setAttribute('aria-expanded', String(open));
  $('btn-wake').classList.toggle('on', open || !S.wakeWordEnabled);
  if (open) {
    $('opacity').classList.remove('on');
    $('btn-opacity').classList.remove('on');
  }
});
$('wake-auto').addEventListener('click', () => post('set_wake_word', { enabled: true }));
$('wake-manual').addEventListener('click', () => post('set_wake_word', { enabled: false }));

/* ── Agent 模式的控件 ───────────────────────────────── */

$('btn-wide').addEventListener('click', () => setWorkbench(!S.workbench));
$('btn-agent').addEventListener('click', () => setAgentMode(!S.agent.enabled));
$('agent-off').addEventListener('click', () => setAgentMode(false));

$('agent-modes').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-mode]');
  if (!button) return;
  const mode = button.dataset.mode;
  if (mode === 'bypass' && S.agent.permission_mode !== 'bypass') {
    // 这一档把不可逆操作前的最后一道闸也拆了。让人多点一次，不是走流程，
    // 是因为切过去之后就再没有任何一处会拦住 rm -rf 了。
    addNotice('全免确认已开启：接下来所有操作直接执行，包括不可逆的。再点一次「自动改文件」可退回。', true);
  }
  S.agent.permission_mode = mode;
  render();
  post('agent', { message: { type: 'set_permission_mode', mode: mode } });
});

$('agent-ws').addEventListener('click', () => {
  const form = $('agent-wsform');
  form.classList.toggle('on');
  if (form.classList.contains('on')) {
    $('agent-wsinput').value = S.agent.workspace || '~';
    $('agent-wsinput').focus();
    $('agent-wsinput').select();
  }
});

function submitWorkspace() {
  const path = $('agent-wsinput').value.trim();
  if (!path) return;
  $('agent-wsform').classList.remove('on');
  post('agent', { message: { type: 'set_workspace', path: path } });
}
$('agent-wsok').addEventListener('click', submitWorkspace);
$('agent-wsinput').addEventListener('keydown', (event) => {
  if (event.key === 'Enter') { event.preventDefault(); submitWorkspace(); }
  if (event.key === 'Escape') { event.stopPropagation(); $('agent-wsform').classList.remove('on'); }
});

function applyWakeMode(cfg) {
  if (!cfg) return;
  const enabled = !!cfg.enabled;
  S.wakeWordEnabled = enabled;
  $('wake-auto').classList.toggle('active', enabled);
  $('wake-manual').classList.toggle('active', !enabled);
  $('wake-auto').setAttribute('aria-pressed', String(enabled));
  $('wake-manual').setAttribute('aria-pressed', String(!enabled));
  $('btn-wake').classList.toggle('on', !enabled);   // 手动模式时点亮，提醒"唤醒词已关"
  $('wake-hint').textContent = enabled
    ? '自动聆听已开启 · 闲置时进入省电周期'
    : '后台麦克风已关闭';
}

/* ── 键盘 ───────────────────────────────────────────── */
/* 文档 §12 的 Esc 优先级：确认框 > 停止任务 > 收起面板。
   顺序不能反——任务跑着的时候按 Esc 却把面板收了，是最容易吓到人的一种。 */
document.addEventListener('keydown', (event) => {
  if (event.metaKey && event.shiftKey && event.key.toLowerCase() === 'n') {
    event.preventDefault();
    post('new_session');
    return;
  }
  // ⌥A 切 Agent 模式。用 event.code 而不是 event.key：macOS 上按住 Option
  // 会把 a 变成 "å"，比 key 判断稳。
  if (event.altKey && !event.metaKey && !event.ctrlKey && event.code === 'KeyA') {
    event.preventDefault();
    setAgentMode(!S.agent.enabled);
    return;
  }
  if (event.altKey && !event.metaKey && !event.ctrlKey && event.code === 'KeyW') {
    event.preventDefault();
    setWorkbench(!S.workbench);
    return;
  }
  if (event.key !== 'Escape') return;
  event.preventDefault();
  if ($('modelForm').classList.contains('on')) { closeModelForm(); return; }
  if ($('modelMenu').classList.contains('on')) { closeModelMenu(); return; }
  if ($('moreMenu').classList.contains('on')) { closeMoreMenu(); return; }
  if (S.pendingConfirm) { S.pendingConfirm.answer(false); return; }
  if (S.listening) { post('voice_toggle'); return; }
  if (BUSY.has(S.state)) { stopTask(); return; }
  post('close');
});

window.__jarvisFocusInput = () => input.focus();

/* 顶栏动态条。宿主限流到 15Hz 才推过来，这里只管画。
   每根条给一个固定的高度系数，看着像频谱而不是五根一起上下。 */
const BAR_GAIN = [0.55, 0.85, 1.0, 0.8, 0.5];
window.__jarvisLevel = (level) => {
  bars.forEach((bar, i) => {
    const height = 2 + Math.min(1, level * BAR_GAIN[i] * 2.2) * 12;
    bar.style.height = height.toFixed(1) + 'px';
    bar.style.opacity = (0.35 + Math.min(1, level * 2) * 0.65).toFixed(2);
  });
};
function resetBars() { bars.forEach((b) => { b.style.height = '2px'; b.style.opacity = '0.35'; }); }

/* ── 接收 ───────────────────────────────────────────── */

function handle(event) {
  switch (event.type) {

    case 'opacity':
      opacityRange.value = Math.round((event.value || 0) * 100);
      applyTint(event.value || 0);
      break;

    case 'wake_word':
      applyWakeMode(event);
      break;

    case 'connection':
      S.connected = !!event.connected;
      if (!S.connected) {
        endStreaming();
        S.listening = false;
        resetBars();
        setState('offline');
        showDisconnected();
      } else {
        setState('idle');
      }
      break;

    case 'ready':
      S.connected = true;
      setState('idle', event.configured ? (event.model || '') : '缺 API Key');
      if (event.models) applyModels(event.models);
      if (event.wake_word) applyWakeMode(event.wake_word);
      if (event.agent) applyAgent(event.agent);
      if (!event.configured) {
        const notice = addNotice('还没配 DeepSeek API Key，点这里打开配置文件', true);
        notice.style.cursor = 'pointer';
        notice.addEventListener('click', () => post('open_config'));
      }
      break;

    case 'models':
      applyModels(event);
      break;

    /* 宿主已经把状态合成过了：睡眠 > 识别 > 收音 > 播报 > 大脑状态 */
    case 'state':
      setState(event.state, event.detail);
      if (!BUSY.has(event.state) && event.state !== 'speaking') resetBars();
      break;

    case 'sleep':
      S.sleeping = !!event.sleeping;
      if (S.sleeping) { endStreaming(); S.listening = false; resetBars(); }
      render();
      addNotice(S.sleeping ? '已进入睡眠：不再聆听，后台任务已停止' : '已唤醒');
      break;

    case 'listening':
      S.listening = !!event.active;
      if (S.listening) S.textBeforeVoice = input.value;
      else resetBars();
      render();
      break;

    case 'transcribing':
      // 麦克风已关，还在等最终文本。输入框里保留已识别的部分。
      S.listening = false;
      resetBars();
      render();
      break;

    /* 实时转写直接落进输入框（文档 §8.1）。这样识别失败时，
       已经听到的那半句还留在手边可以改，而不是凭空消失。 */
    case 'transcript_partial':
      input.value = S.textBeforeVoice + (event.text || '');
      input.dispatchEvent(new Event('input'));
      break;

    case 'transcript_final':
      S.listening = false;
      input.value = '';
      input.style.height = 'auto';
      addUserMessage(event.text);
      endStreaming();
      setState('thinking');
      break;

    case 'transcript_empty':
      S.listening = false;
      input.value = S.textBeforeVoice;
      input.dispatchEvent(new Event('input'));
      setState(S.connected ? 'idle' : 'offline');
      addNotice('没听清，再说一次或直接打字');
      break;

    case 'assistant_reasoning_delta': {
      const message = ensureAssistant(event.id);
      if (!message) break;
      const node = message.reasoning;
      node.style.display = '';
      node.textContent += event.text;
      scroll();
      break;
    }

    case 'assistant_delta': {
      const node = ensureAssistant(event.id);
      if (!node) break;
      node.body.textContent += event.text;
      scroll();
      break;
    }

    case 'assistant_delta_zh': {
      const node = ensureAssistant(event.id);
      if (!node) break;
      node.zh.textContent += event.text;
      scroll();
      break;
    }

    /* 双语兜底修正整段重发时用：面板已经把错误内容流过一遍，没法收回某一条
       已发的 delta，干脆清空这条消息重新画，别在同一条气泡里越叠越乱。 */
    case 'assistant_reset': {
      const node = ensureAssistant(event.id);
      if (!node) break;
      node.body.textContent = '';
      node.zh.textContent = '';
      scroll();
      break;
    }

    /* 工具调用前已经流出的完整草稿不能和工具后的最终结论同时保留。 */
    case 'assistant_discard': {
      if (current && current.id === event.id) {
        current.msg.remove();
        current = null;
      }
      break;
    }

    case 'collapse_complete': {
      document.body.classList.toggle('collapsed', !!event.collapsed);
      document.body.classList.remove('resizing');
      applyCompactHeight();
      if (!event.collapsed) {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      }
      input.focus();
      scroll();
      break;
    }

    case 'assistant_done':
      endStreaming(event.id);
      break;

    case 'tool_started':
      addToolCard(event);
      timelineAdd(event);
      break;

    case 'subagent_started':
      addSubagentCard(event);
      timelineNote('子代理 · ' + (event.description || ''));
      break;

    case 'subagent_done':
      finishSubagentCard(event);
      break;

    case 'subagent_step':
      break;      // 面板不逐步刷子代理，跑完给一行结论就够

    case 'tool_confirm_request':
      addStep(event.id, '等待你确认');
      renderConfirm(event);
      break;

    case 'tool_result':
      finishTool(event);
      timelineFinish(event);
      break;

    case 'tool_retry':
      addStep(event.id, `${event.message || '自动重试'}（第 ${event.attempt || 2} 次）`);
      break;

    case 'task_done':
      if (event.status === 'failed') addNotice(`任务失败 · 已记录 ${event.steps || 0} 个步骤`, true);
      else if (event.status === 'interrupted') addNotice(`任务已中断 · 已保留 ${event.steps || 0} 个步骤`);
      break;

    case 'speak_failed':
      addNotice('播报失败：' + (event.message || ''), true);
      break;

    case 'turn_cancelled':
      endStreaming(event.id);
      setState(S.connected ? 'idle' : 'offline');
      addNotice('已停止');
      break;

    case 'turn_done':
      endStreaming(event.id);
      break;

    case 'session_reset':
      toolNodes.clear();
      completedAssistantIds.clear();
      abandonedAssistantIds.clear();
      S.pendingConfirm = null;
      // Brain 那边新会话会清掉待办、免确认名单和后台进程，这里跟上，
      // 别让上一个任务的进度条留在新会话的顶栏里。
      S.agent.todos = [];
      S.agent.step = 0;
      subagentNodes.clear();
      timelineNodes.clear();
      $('timeline').textContent = '';
      $('rail-count').textContent = '';
      endStreaming();
      S.hasMessages = false;
      showEmpty();
      setState(S.connected ? 'idle' : 'offline');
      break;

    /* 文档 §4.1 的 error 是"当前任务失败"，展示完错误再回 idle。
       以前这里直接回 idle，等于状态表里写了 error 却永远到不了。 */
    case 'error':
      endStreaming();
      S.pendingConfirm = null;
      addNotice(event.message || '未知错误', true);
      setState('error');
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => {
        if (S.state === 'error') setState(S.connected ? 'idle' : 'offline');
      }, 4000);
      break;

    case 'log':
      addNotice(event.message || '');
      break;

    /* 打断只把状态切到 listening，用户容易看不懂"怎么自己停了"。
       这条提示专门解释原因，wake 事件本身沿用 listening 的视觉反馈就够。 */
    case 'barge_in':
      addNotice('已打断播报（' + (event.keyword || 'Jarvis') + '），在听');
      break;

    case 'skills':
      applySkills(event.items);
      break;

    case 'usage':
      applyUsage(event.items);
      break;

    /* ── Agent 模式 ── */

    case 'agent_state':
      applyAgent(event);
      break;

    case 'agent_todos':
      S.agent.todos = event.todos || [];
      render();
      break;

    case 'agent_step':
      S.agent.step = event.step || 0;
      if (event.max) S.agent.max_steps = event.max;
      render();
      break;

    /* 模型开工前那句"接下来我要…"。不进回答气泡：留在气泡里，用户会以为
       任务已经做完了，而它后面还跟着十几个工具调用。 */
    case 'agent_note': {
      const note = el('div', 'agent-note', event.text || '');
      log.appendChild(note);
      hideEmpty();
      scroll();
      break;
    }

    case 'agent_goal':
      S.agent.enabled = true;
      addNotice('已进入 Agent 模式 · ' + (event.goal || ''));
      render();
      break;

    case 'agent_compacted':
      addNotice('上下文已压缩（' + (event.before || 0) + ' → ' + (event.after || 0) + ' 条），任务继续');
      timelineNote('上下文已压缩');
      break;

    case 'agent_undone':
      addNotice('已撤销改动：' + (event.path || ''));
      break;

    case 'agent_allowlist':
      addNotice('本次会话内不再询问：' + (event.tools || []).join('、'));
      break;

    case 'tool_output':
      appendToolOutput(event.id, event.text);
      break;
  }
}

/* 断线不能只丢一行字：得给出下一步能点的东西（文档 §15.1） */
function showDisconnected() {
  const node = addNotice('', true);
  node.appendChild(el('span', null, '连接已中断，J.A.R.V.I.S. Brain 没有响应。'));
  const retry = el('span', 'link', '重新连接');
  retry.addEventListener('click', () => { post('restart_brain'); node.remove(); });
  const diag = el('span', 'link', '查看诊断');
  diag.addEventListener('click', () => post('open_log'));
  node.append(retry, diag);
}

window.__jarvisReceive = (raw) => {
  let event;
  try { event = JSON.parse(raw); } catch (e) { return; }
  try { handle(event); } catch (e) { console.error('handle failed', e, event); }
};

showEmpty();
resetBars();
applyWakeMode({ enabled: true });
render();
</script>
</body>
</html>
