<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<style>
/* 毛玻璃由宿主的 NSVisualEffectView 提供，这里只叠一层深色调；圆角靠 NSWindow 裁。 */
:root {
  --bg:        rgba(6, 12, 18, 0.62);
  --line:      rgba(90, 190, 235, 0.16);
  --cyan:      #4dd6ff;
  --cyan-dim:  rgba(77, 214, 255, 0.55);
  --text:      #d6e6ef;
  --text-dim:  rgba(214, 230, 239, 0.45);
  --warn:      #ffc24d;
  --bad:       #ff6b6b;
  --ok:        #6bffb0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
  font: 13px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#shell {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* ── 顶栏 ───────────────────────────────────────────── */
/* 左边 78px 留给系统的红绿灯按钮，别被内容压住 */
header {
  flex: none;
  height: 46px;
  padding: 0 12px 0 78px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}

#brand {
  font: 600 11px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.22em;
  color: var(--cyan-dim);
  flex: 1;
}

#dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--bad);
  box-shadow: 0 0 8px currentColor;
  transition: background 0.3s;
}
#dot.on      { background: var(--ok); }
#dot.busy    { background: var(--cyan); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

#status {
  font: 10px/1 "SF Mono", ui-monospace, monospace;
  color: var(--text-dim);
  margin-right: 4px;
}

header button {
  -webkit-app-region: no-drag;
  background: none; border: 1px solid var(--line); border-radius: 5px;
  color: var(--text-dim); font-size: 11px; padding: 3px 8px; cursor: pointer;
}
header button:hover { color: var(--cyan); border-color: var(--cyan-dim); }

/* ── 消息区 ─────────────────────────────────────────── */
#log {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  user-select: text;
}
#log::-webkit-scrollbar { width: 6px; }
#log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.msg { max-width: 92%; }
.msg.user { align-self: flex-end; }
.msg.user .body {
  background: rgba(77, 214, 255, 0.1);
  border: 1px solid var(--line);
  border-radius: 12px 12px 3px 12px;
  padding: 7px 11px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.assistant .body {
  white-space: pre-wrap;
  word-break: break-word;
}
/* 中文字幕。Jarvis 讲英文，这行是给眼睛看的，所以弱化处理，
   但不能弱到看不清——它常常是用户唯一真正读的那行。 */
.msg.assistant .zh {
  margin-top: 5px;
  padding-left: 9px;
  border-left: 2px solid rgba(77, 214, 255, 0.28);
  font-size: 12.5px;
  color: rgba(214, 230, 239, 0.62);
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.assistant .zh:empty { display: none; }

.msg.assistant .body code {
  font: 12px "SF Mono", ui-monospace, monospace;
  background: rgba(255,255,255,0.06);
  padding: 1px 4px; border-radius: 3px;
}

/* 思维链：默认收起，点一下展开 */
.reasoning {
  font-size: 11.5px; color: var(--text-dim);
  border-left: 2px solid var(--line); padding-left: 9px; margin-bottom: 6px;
  white-space: pre-wrap; max-height: 3.4em; overflow: hidden; cursor: pointer;
}
.reasoning.open { max-height: none; }

/* ── 工具卡片 ───────────────────────────────────────── */
.tool {
  display: flex; align-items: flex-start; gap: 7px;
  font: 11.5px/1.5 "SF Mono", ui-monospace, monospace;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 6px 9px;
  align-self: flex-start;
  max-width: 92%;
}
.tool .mark { color: var(--cyan); flex: none; }
.tool.ok   .mark { color: var(--ok); }
.tool.fail .mark { color: var(--bad); }
.tool.fail { color: rgba(255,107,107,0.8); }
.tool .what { word-break: break-word; }

/* ── 确认框 ─────────────────────────────────────────── */
.confirm {
  border: 1px solid rgba(255, 194, 77, 0.4);
  background: rgba(255, 194, 77, 0.07);
  border-radius: 9px; padding: 10px 12px;
  align-self: stretch;
}
.confirm .head {
  font: 600 11px/1 "SF Mono", ui-monospace, monospace;
  color: var(--warn); letter-spacing: 0.1em; margin-bottom: 6px;
}
.confirm .what { margin-bottom: 8px; word-break: break-word; }
.confirm pre {
  font: 11px/1.5 "SF Mono", ui-monospace, monospace;
  color: var(--text-dim);
  background: rgba(0,0,0,0.25); border-radius: 5px;
  padding: 6px 8px; margin-bottom: 8px;
  max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
.confirm .row { display: flex; gap: 8px; }
.confirm button {
  flex: 1; padding: 6px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255,255,255,0.04);
  color: var(--text); font-size: 12px;
}
.confirm button.yes { border-color: rgba(255,194,77,0.5); color: var(--warn); }
.confirm button:hover { background: rgba(255,255,255,0.1); }
.confirm.done { opacity: 0.45; }
.confirm.done .row { display: none; }

.notice {
  font-size: 11.5px; color: var(--text-dim); text-align: center; padding: 2px;
}
.notice.bad { color: var(--bad); }

/* 空会话时的说明。省得每次打开都盯着一片黑想"它能干嘛" */
#empty {
  margin: auto; text-align: center; color: rgba(214,230,239,0.3);
  font-size: 11.5px; line-height: 2;
}
#empty b {
  display: block; font: 600 11px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.2em; color: var(--cyan-dim); margin-bottom: 10px;
}

/* ── 输入区 ─────────────────────────────────────────── */
footer {
  flex: none;
  border-top: 1px solid var(--line);
  padding: 9px 12px 11px;
}
#composer { display: flex; gap: 8px; align-items: flex-end; }

#mic {
  flex: none; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255,255,255,0.04);
  color: var(--text-dim); font-size: 15px; line-height: 1;
}
#mic:hover { color: var(--cyan); border-color: var(--cyan-dim); }
#mic.on {
  border-color: var(--bad); color: var(--bad); background: rgba(255,107,107,0.14);
  animation: pulse 1.1s ease-in-out infinite;
}

/* 听写中的实时文本，贴在输入框上方，收句后会变成一条正式消息 */
#hearing {
  display: none;
  margin-bottom: 8px; padding: 7px 11px;
  border: 1px dashed rgba(255,107,107,0.4); border-radius: 9px;
  font-size: 12.5px; color: var(--text-dim); min-height: 32px;
}
#hearing.on { display: block; }
#hearing b { color: var(--bad); font-weight: 600; margin-right: 6px; }
#input {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--text);
  font: 13px/1.5 inherit;
  padding: 8px 10px;
  resize: none;
  max-height: 140px;
  outline: none;
  user-select: text;
}
#input:focus { border-color: var(--cyan-dim); }
#input::placeholder { color: rgba(214,230,239,0.28); }

#send {
  flex: none; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--cyan-dim); background: rgba(77,214,255,0.12);
  color: var(--cyan); font-size: 15px; line-height: 1;
}
#send:hover { background: rgba(77,214,255,0.22); }
#send.stop { border-color: rgba(255,107,107,0.5); background: rgba(255,107,107,0.12); color: var(--bad); }

#hint {
  font: 10px/1 "SF Mono", ui-monospace, monospace;
  color: rgba(214,230,239,0.22);
  margin-top: 6px; text-align: right;
}
</style>
</head>
<body>
<div id="shell">
  <header>
    <span id="brand">J.A.R.V.I.S.</span>
    <span id="status">连接中</span>
    <span id="dot"></span>
    <button id="btn-new" title="清空上下文（⌘⇧N）">新会话</button>
  </header>

  <div id="log">
    <div id="empty">
      <b>AT YOUR SERVICE</b>
      打开应用 · 查找与读写文件 · 读剪贴板<br>
      联网搜索 · 抓取网页 · 查看本机状态
    </div>
  </div>

  <footer>
    <div id="hearing"><b>在听</b><span id="hearing-text">…</span></div>
    <div id="composer">
      <button id="mic" title="说话（⌥V）">🎙</button>
      <textarea id="input" rows="1" placeholder="说点什么…" autofocus></textarea>
      <button id="send" title="发送">↑</button>
    </div>
    <div id="hint">Enter 发送 · ⇧Enter 换行 · ⌥V 说话 · Esc 收起</div>
  </footer>
</div>

<script>
'use strict';

const log     = document.getElementById('log');
const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot     = document.getElementById('dot');
const statusEl= document.getElementById('status');
const micBtn  = document.getElementById('mic');
const hearing = document.getElementById('hearing');
const hearingText = document.getElementById('hearing-text');

let connected = false;
let busy      = false;
let current   = null;   // 正在流式接收的那条 assistant 消息

function post(payload) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvis) {
    window.webkit.messageHandlers.jarvis.postMessage(payload);
  }
}

/* 只有本来就贴着底部时才自动滚——用户翻历史时别把他拽回去 */
function scroll(force) {
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  if (force || nearBottom) log.scrollTop = log.scrollHeight;
}

const EMPTY_HTML = log.innerHTML;

function hideEmpty() {
  const node = document.getElementById('empty');
  if (node) node.remove();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function addNotice(text, bad) {
  hideEmpty();
  const node = el('div', 'notice' + (bad ? ' bad' : ''), text);
  log.appendChild(node);
  scroll();
  return node;
}

function setBusy(value) {
  busy = value;
  sendBtn.textContent = value ? '■' : '↑';
  sendBtn.classList.toggle('stop', value);
  sendBtn.title = value ? '停止' : '发送';
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  dot.className = kind || '';
}

/* ── 发送 ───────────────────────────────────────────── */

function submit() {
  const text = input.value.trim();
  if (!text) return;
  if (!connected) { addNotice('大脑未连接，稍等或从菜单栏重启大脑', true); return; }

  hideEmpty();
  const msg = el('div', 'msg user');
  msg.appendChild(el('div', 'body', text));
  log.appendChild(msg);

  input.value = '';
  input.style.height = 'auto';
  current = null;
  setBusy(true);
  scroll(true);
  post({ action: 'submit', text: text });
}

sendBtn.addEventListener('click', () => {
  if (busy) post({ action: 'cancel' });
  else submit();
});

input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    submit();
  } else if (event.key === 'Escape') {
    event.preventDefault();
    post({ action: 'close' });
  }
});

/* 输入框跟着内容长高 */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

document.getElementById('btn-new').addEventListener('click', () => {
  post({ action: 'new_session' });
});

micBtn.addEventListener('click', () => post({ action: 'voice_toggle' }));

function setListening(on) {
  micBtn.classList.toggle('on', on);
  hearing.classList.toggle('on', on);
  if (on) hearingText.textContent = '…';
}

/* 语音识别出来的那句，作为普通用户消息渲染 */
function addUserBubble(text) {
  hideEmpty();
  const msg = el('div', 'msg user');
  msg.appendChild(el('div', 'body', text));
  log.appendChild(msg);
  scroll(true);
}

document.addEventListener('keydown', (event) => {
  if (event.metaKey && event.shiftKey && event.key.toLowerCase() === 'n') {
    event.preventDefault();
    post({ action: 'new_session' });
  }
});

window.__jarvisFocusInput = () => input.focus();

/* ── 接收 ───────────────────────────────────────────── */

function ensureAssistant() {
  if (current) return current;
  hideEmpty();
  const msg = el('div', 'msg assistant');
  const reasoning = el('div', 'reasoning');
  reasoning.style.display = 'none';
  reasoning.addEventListener('click', () => reasoning.classList.toggle('open'));
  const body = el('div', 'body');
  const zh = el('div', 'zh');
  msg.appendChild(reasoning);
  msg.appendChild(body);
  msg.appendChild(zh);
  log.appendChild(msg);
  current = { msg, body, reasoning, zh };
  return current;
}

const toolNodes = new Map();

function handle(event) {
  switch (event.type) {

    case 'connection':
      connected = !!event.connected;
      setStatus(connected ? '就绪' : '未连接', connected ? 'on' : '');
      if (!connected) { setBusy(false); setListening(false); current = null; }
      break;

    case 'ready':
      connected = true;
      setStatus(event.configured ? (event.model || '就绪') : '缺 API Key',
                event.configured ? 'on' : '');
      if (!event.configured) {
        const notice = addNotice('还没配 DeepSeek API Key，点这里打开配置文件', true);
        notice.style.cursor = 'pointer';
        notice.addEventListener('click', () => post({ action: 'open_config' }));
      }
      break;

    /* 这里的 state 已由宿主合成过：收音 > 播报 > 大脑状态 */
    case 'state':
      if (event.state === 'listening') {
        setStatus('在听', 'busy');
      } else if (event.state === 'thinking' || event.state === 'speaking') {
        setBusy(true);
        setStatus(event.state === 'thinking' ? '思考中' : '回复中', 'busy');
      } else if (event.state === 'idle') {
        setStatus(connected ? '就绪' : '未连接', connected ? 'on' : '');
      }
      break;

    case 'listening':
      setListening(!!event.active);
      break;

    case 'transcript_partial':
      hearingText.textContent = event.text || '…';
      break;

    case 'transcript_final':
      setListening(false);
      addUserBubble(event.text);
      current = null;
      setBusy(true);
      break;

    case 'transcript_empty':
      setListening(false);
      addNotice('没听清');
      break;

    case 'speak_failed':
      addNotice('播报失败：' + (event.message || ''), true);
      break;

    case 'assistant_reasoning_delta': {
      const node = ensureAssistant().reasoning;
      node.style.display = '';
      node.textContent += event.text;
      scroll();
      break;
    }

    case 'assistant_delta':
      ensureAssistant().body.textContent += event.text;
      scroll();
      break;

    case 'assistant_delta_zh':
      ensureAssistant().zh.textContent += event.text;
      scroll();
      break;

    case 'assistant_done':
      current = null;
      break;

    case 'tool_started': {
      hideEmpty();
      const node = el('div', 'tool');
      node.appendChild(el('span', 'mark', '⚙'));
      node.appendChild(el('span', 'what', event.summary || event.name));
      log.appendChild(node);
      toolNodes.set(event.id, node);
      current = null;                 // 工具之后模型会另起一段
      scroll();
      break;
    }

    case 'tool_result': {
      const node = toolNodes.get(event.id);
      if (!node) break;
      node.classList.add(event.success ? 'ok' : 'fail');
      node.querySelector('.mark').textContent = event.success ? '✓' : '✗';
      if (!event.success && event.summary) node.querySelector('.what').textContent = event.summary;
      else if (event.ms) node.querySelector('.what').textContent += '  ' + event.ms + 'ms';
      toolNodes.delete(event.id);
      break;
    }

    case 'tool_confirm_request':
      renderConfirm(event);
      break;

    case 'turn_cancelled':
      setBusy(false);
      current = null;
      addNotice('已取消');
      break;

    case 'turn_done':
      setBusy(false);
      current = null;
      break;

    case 'session_reset':
      log.innerHTML = EMPTY_HTML;
      toolNodes.clear();
      current = null;
      setBusy(false);
      setListening(false);
      addNotice('上下文已清空');
      break;

    case 'error':
      current = null;
      setBusy(false);
      addNotice(event.message || '未知错误', true);
      break;

    case 'log':
      addNotice(event.message || '');
      break;
  }
}

function renderConfirm(event) {
  hideEmpty();
  const card = el('div', 'confirm');
  card.appendChild(el('div', 'head', '需要确认 · ' + (event.risk || 'L2')));
  card.appendChild(el('div', 'what', event.summary || event.name));

  const args = event.arguments || {};
  if (Object.keys(args).length) {
    card.appendChild(el('pre', null, JSON.stringify(args, null, 2)));
  }

  const row = el('div', 'row');
  const yes = el('button', 'yes', '允许');
  const no  = el('button', null, '拒绝');
  row.appendChild(no);
  row.appendChild(yes);
  card.appendChild(row);

  const answer = (approved) => {
    post({ action: 'confirm', request_id: event.request_id, approved: approved });
    card.classList.add('done');
    card.querySelector('.head').textContent = approved ? '已允许' : '已拒绝';
  };
  yes.addEventListener('click', () => answer(true));
  no.addEventListener('click',  () => answer(false));

  log.appendChild(card);
  scroll(true);
}

window.__jarvisReceive = (raw) => {
  let event;
  try { event = JSON.parse(raw); } catch (e) { return; }
  try { handle(event); } catch (e) { console.error('handle failed', e, event); }
};

setStatus('连接中', '');
</script>
</body>
</html>
