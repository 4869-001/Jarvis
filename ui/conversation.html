<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<style>
/* 配色跟壁纸里的球体走同一套琥珀金（wallpaper.html 的 cHot/cGold/cAmb/cDeep）。
   以前面板是青色的，和桌面上那颗橙色的球体像两个不同的产品。

   毛玻璃由宿主的 NSVisualEffectView 提供，这里只叠一层深色调；圆角靠 NSWindow 裁。
   --tint 的透明度由宿主按滑块推过来（opacity 事件），不要写死。 */
:root {
  --hot:       #fff3d0;
  --gold:      #ffc46a;
  --amber:     #ff8c1a;
  --deep:      #ff4d08;

  --tint:      0.62;                      /* 暗色衬底的强度，宿主会覆盖 */
  --bg:        rgba(9, 6, 3, var(--tint));
  --line:      rgba(255, 140, 26, 0.17);
  --line-lit:  rgba(255, 168, 60, 0.42);

  --text:      #ffe6c4;
  --text-dim:  rgba(255, 196, 130, 0.52);
  --warn:      #ffb020;
  --bad:       #ff6a4d;
  --ok:        #b6e06a;

  /* 低透明度时文字直接压在壁纸上，没有衬底就糊。一层极淡的暗描边比加背景块干净。 */
  --halo:      0 1px 3px rgba(0, 0, 0, 0.75);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
  font: 13px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#shell {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* 顶部那层暖光，呼应球体的 halo。纯装饰，不吃点击。 */
#shell::before {
  content: '';
  position: absolute; inset: 0 0 auto; height: 220px;
  background: radial-gradient(ellipse 120% 100% at 50% 0%,
              rgba(255, 140, 26, 0.13) 0%, rgba(255, 77, 8, 0.05) 45%, transparent 75%);
  pointer-events: none;
}

/* ── 顶栏 ───────────────────────────────────────────── */
/* 左边 78px 留给系统的红绿灯按钮，别被内容压住 */
header {
  position: relative;
  flex: none;
  height: 46px;
  padding: 0 10px 0 78px;
  display: flex;
  align-items: center;
  gap: 9px;
  border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}

#dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--bad);
  box-shadow: 0 0 9px currentColor;
  transition: background 0.3s;
  flex: none;
}
#dot.on   { background: var(--amber); }
#dot.busy { background: var(--gold); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }

/* 和壁纸底部那行遥测同一种排版：等宽、大字距、暖色 */
#brand {
  font: 600 11px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.24em;
  color: var(--gold);
  text-shadow: 0 0 12px rgba(255, 140, 26, 0.45);
}

#status {
  flex: 1;
  font: 10px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
#status::before { content: '· '; opacity: 0.45; }

header button {
  -webkit-app-region: no-drag;
  flex: none;
  background: none; border: 1px solid var(--line); border-radius: 5px;
  color: var(--text-dim); font-size: 11px; padding: 3px 8px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
header button:hover { color: var(--gold); border-color: var(--line-lit); }
header button.icon { padding: 3px 7px; font-size: 12px; line-height: 1.2; }
header button.icon.open { color: var(--amber); border-color: var(--line-lit); }

/* ── 透明度滑块 ─────────────────────────────────────── */
/* 收在顶栏下面，点 ◐ 才展开。常驻一个滑块太吵，而这是个调一次就不动的设置。 */
#opacity {
  -webkit-app-region: no-drag;
  flex: none;
  display: none;
  align-items: center;
  gap: 9px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 140, 26, 0.035);
}
#opacity.on { display: flex; }
#opacity label {
  font: 10px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.14em; color: var(--text-dim); flex: none;
}
#opacity output {
  font: 10px/1 "SF Mono", ui-monospace, monospace;
  color: var(--gold); width: 34px; text-align: right; flex: none;
}
#opacity input[type=range] {
  flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px;
  background: linear-gradient(to right, var(--amber) 0%, var(--gold) 100%);
  opacity: 0.75; cursor: pointer;
}
#opacity input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--hot); border: none;
  box-shadow: 0 0 8px rgba(255, 140, 26, 0.9);
}

/* ── 消息区 ─────────────────────────────────────────── */
#log {
  position: relative;
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  user-select: text;
}
#log::-webkit-scrollbar { width: 6px; }
#log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.msg { max-width: 92%; }
.msg.user { align-self: flex-end; }
.msg.user .body {
  background: rgba(255, 140, 26, 0.11);
  border: 1px solid var(--line);
  border-radius: 12px 12px 3px 12px;
  padding: 7px 11px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.assistant .body {
  white-space: pre-wrap;
  word-break: break-word;
  text-shadow: var(--halo);
}
/* 中文字幕。Jarvis 讲英文，这行是给眼睛看的，所以弱化处理，
   但不能弱到看不清——它常常是用户唯一真正读的那行。 */
.msg.assistant .zh {
  margin-top: 5px;
  padding-left: 9px;
  border-left: 2px solid rgba(255, 140, 26, 0.35);
  font-size: 12.5px;
  color: rgba(255, 220, 180, 0.72);
  text-shadow: var(--halo);
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.assistant .zh:empty { display: none; }

.msg.assistant .body code {
  font: 12px "SF Mono", ui-monospace, monospace;
  background: rgba(255, 200, 130, 0.09);
  padding: 1px 4px; border-radius: 3px;
}

/* 思维链：默认收起，点一下展开 */
.reasoning {
  font-size: 11.5px; color: var(--text-dim);
  border-left: 2px solid var(--line); padding-left: 9px; margin-bottom: 6px;
  white-space: pre-wrap; max-height: 3.4em; overflow: hidden; cursor: pointer;
}
.reasoning.open { max-height: none; }

/* ── 工具卡片 ───────────────────────────────────────── */
.tool {
  display: flex; align-items: flex-start; gap: 7px;
  font: 11.5px/1.5 "SF Mono", ui-monospace, monospace;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 6px 9px;
  align-self: flex-start;
  max-width: 92%;
  background: rgba(255, 140, 26, 0.04);
}
.tool .mark { color: var(--gold); flex: none; }
.tool.ok   .mark { color: var(--ok); }
.tool.fail .mark { color: var(--bad); }
.tool.fail { color: rgba(255, 106, 77, 0.85); }
.tool .what { word-break: break-word; }

/* ── 确认框 ─────────────────────────────────────────── */
.confirm {
  border: 1px solid rgba(255, 176, 32, 0.45);
  background: rgba(255, 176, 32, 0.08);
  border-radius: 9px; padding: 10px 12px;
  align-self: stretch;
}
.confirm .head {
  font: 600 11px/1 "SF Mono", ui-monospace, monospace;
  color: var(--warn); letter-spacing: 0.14em; margin-bottom: 6px;
}
.confirm .what { margin-bottom: 8px; word-break: break-word; }
.confirm pre {
  font: 11px/1.5 "SF Mono", ui-monospace, monospace;
  color: var(--text-dim);
  background: rgba(0,0,0,0.32); border-radius: 5px;
  padding: 6px 8px; margin-bottom: 8px;
  max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-all;
}
.confirm .row { display: flex; gap: 8px; }
.confirm button {
  flex: 1; padding: 6px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.06);
  color: var(--text); font-size: 12px;
}
.confirm button.yes { border-color: rgba(255, 176, 32, 0.55); color: var(--warn); }
.confirm button:hover { background: rgba(255, 200, 130, 0.14); }
.confirm.done { opacity: 0.45; }
.confirm.done .row { display: none; }

.notice {
  font-size: 11.5px; color: var(--text-dim); text-align: center; padding: 2px;
  text-shadow: var(--halo);
}
.notice.bad { color: var(--bad); }

/* 空会话时的说明。省得每次打开都盯着一片黑想"它能干嘛" */
#empty {
  margin: auto; text-align: center; color: rgba(255, 196, 130, 0.34);
  font-size: 11.5px; line-height: 2;
  text-shadow: var(--halo);
}
#empty b {
  display: block; font: 600 11px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.22em; color: var(--gold); margin-bottom: 10px;
  text-shadow: 0 0 14px rgba(255, 140, 26, 0.5);
}
#empty .mem { display: block; margin-top: 8px; color: rgba(255, 196, 130, 0.28); }
#empty .mem:empty { display: none; }

/* ── 输入区 ─────────────────────────────────────────── */
footer {
  position: relative;
  flex: none;
  border-top: 1px solid var(--line);
  padding: 9px 12px 11px;
}
#composer { display: flex; gap: 8px; align-items: flex-end; }

#mic {
  flex: none; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: rgba(255, 200, 130, 0.05);
  color: var(--text-dim); font-size: 15px; line-height: 1;
}
#mic:hover { color: var(--gold); border-color: var(--line-lit); }
#mic.on {
  border-color: rgba(255, 140, 26, 0.75); color: var(--hot);
  background: rgba(255, 140, 26, 0.2);
  box-shadow: 0 0 14px rgba(255, 140, 26, 0.45);
  animation: pulse 1.1s ease-in-out infinite;
}

/* 听写中的实时文本，贴在输入框上方，收句后会变成一条正式消息 */
#hearing {
  display: none;
  margin-bottom: 8px; padding: 7px 11px;
  border: 1px dashed rgba(255, 140, 26, 0.5); border-radius: 9px;
  font-size: 12.5px; color: var(--text); min-height: 32px;
  background: rgba(255, 140, 26, 0.05);
}
#hearing.on { display: block; }
#hearing b {
  color: var(--amber); font: 600 10px/1 "SF Mono", ui-monospace, monospace;
  letter-spacing: 0.16em; margin-right: 8px;
}
/* 一直没听到人声时的倒计时，到点宿主会自动关麦 */
#hearing .idle { float: right; color: var(--text-dim); font: 10px/1.4 "SF Mono", monospace; }
#hearing .idle:empty { display: none; }

#input {
  flex: 1;
  background: rgba(255, 200, 130, 0.05);
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--text);
  font: 13px/1.5 inherit;
  padding: 8px 10px;
  resize: none;
  max-height: 140px;
  outline: none;
  user-select: text;
}
#input:focus { border-color: var(--line-lit); }
#input::placeholder { color: rgba(255, 196, 130, 0.3); }

#send {
  flex: none; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line-lit); background: rgba(255, 140, 26, 0.14);
  color: var(--gold); font-size: 15px; line-height: 1;
}
#send:hover { background: rgba(255, 140, 26, 0.26); }
#send.stop { border-color: rgba(255, 106, 77, 0.55); background: rgba(255, 106, 77, 0.14); color: var(--bad); }

#hint {
  font: 10px/1 "SF Mono", ui-monospace, monospace;
  color: rgba(255, 196, 130, 0.24);
  margin-top: 6px; text-align: right;
}
</style>
</head>
<body>
<div id="shell">
  <header>
    <span id="dot"></span>
    <span id="brand">J.A.R.V.I.S.</span>
    <span id="status">连接中</span>
    <button id="btn-opacity" class="icon" title="面板透明度">◐</button>
    <button id="btn-new" title="清空上下文（⌘⇧N）">新会话</button>
  </header>

  <div id="opacity">
    <label>OPACITY</label>
    <input id="opacity-range" type="range" min="0" max="100" step="1" value="82">
    <output id="opacity-value">82%</output>
  </div>

  <div id="log">
    <div id="empty">
      <b>AT YOUR SERVICE</b>
      打开应用 · 查找与读写文件 · 读剪贴板<br>
      联网搜索 · 抓取网页 · 查看本机状态
      <span class="mem" id="empty-memory"></span>
    </div>
  </div>

  <footer>
    <div id="hearing"><b>LISTENING</b><span id="hearing-idle" class="idle"></span><span id="hearing-text">…</span></div>
    <div id="composer">
      <button id="mic" title="说话（⌥V）">🎙</button>
      <textarea id="input" rows="1" placeholder="说点什么…" autofocus></textarea>
      <button id="send" title="发送">↑</button>
    </div>
    <div id="hint">Enter 发送 · ⇧Enter 换行 · ⌥V 说话 · Esc 收起</div>
  </footer>
</div>

<script>
'use strict';

const log     = document.getElementById('log');
const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot     = document.getElementById('dot');
const statusEl= document.getElementById('status');
const micBtn  = document.getElementById('mic');
const hearing = document.getElementById('hearing');
const hearingText = document.getElementById('hearing-text');
const hearingIdle = document.getElementById('hearing-idle');

let connected = false;
let busy      = false;
let current   = null;   // 正在流式接收的那条 assistant 消息

function post(payload) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvis) {
    window.webkit.messageHandlers.jarvis.postMessage(payload);
  }
}

/* 只有本来就贴着底部时才自动滚——用户翻历史时别把他拽回去 */
function scroll(force) {
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  if (force || nearBottom) log.scrollTop = log.scrollHeight;
}

const EMPTY_HTML = log.innerHTML;

function hideEmpty() {
  const node = document.getElementById('empty');
  if (node) node.remove();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function addNotice(text, bad) {
  hideEmpty();
  const node = el('div', 'notice' + (bad ? ' bad' : ''), text);
  log.appendChild(node);
  scroll();
  return node;
}

function setBusy(value) {
  busy = value;
  sendBtn.textContent = value ? '■' : '↑';
  sendBtn.classList.toggle('stop', value);
  sendBtn.title = value ? '停止' : '发送';
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  dot.className = kind || '';
}

/* ── 透明度 ─────────────────────────────────────────── */
/* 滑块只负责把值交给宿主：毛玻璃层的 alpha 只有 AppKit 能调。
   宿主改完会回一条 opacity 事件，页面按它更新暗色衬底和滑块位置，
   于是"宿主存的值"永远是唯一真相，不会和界面对不上。 */

const opacityPanel = document.getElementById('opacity');
const opacityRange = document.getElementById('opacity-range');
const opacityValue = document.getElementById('opacity-value');
const opacityBtn   = document.getElementById('btn-opacity');

opacityBtn.addEventListener('click', () => {
  const open = opacityPanel.classList.toggle('on');
  opacityBtn.classList.toggle('open', open);
});

opacityRange.addEventListener('input', () => {
  const value = opacityRange.value / 100;
  applyTint(value);
  post({ action: 'set_opacity', value: value });
});

/* 暗色衬底跟着走，但不是线性的：毛玻璃淡下去之后文字直接压在壁纸上，
   衬底如果也归零就没法看了，所以最低留一点。 */
function applyTint(value) {
  const tint = 0.12 + 0.58 * value;
  document.documentElement.style.setProperty('--tint', tint.toFixed(3));
  opacityValue.textContent = Math.round(value * 100) + '%';
}

/* ── 发送 ───────────────────────────────────────────── */

function submit() {
  const text = input.value.trim();
  if (!text) return;
  if (!connected) { addNotice('大脑未连接，稍等或从菜单栏重启大脑', true); return; }

  hideEmpty();
  const msg = el('div', 'msg user');
  msg.appendChild(el('div', 'body', text));
  log.appendChild(msg);

  input.value = '';
  input.style.height = 'auto';
  current = null;
  setBusy(true);
  scroll(true);
  post({ action: 'submit', text: text });
}

sendBtn.addEventListener('click', () => {
  if (busy) post({ action: 'cancel' });
  else submit();
});

input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    submit();
  } else if (event.key === 'Escape') {
    event.preventDefault();
    post({ action: 'close' });
  }
});

/* 输入框跟着内容长高 */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

document.getElementById('btn-new').addEventListener('click', () => {
  post({ action: 'new_session' });
});

micBtn.addEventListener('click', () => post({ action: 'voice_toggle' }));

/* ── 收音状态 ───────────────────────────────────────── */
/* 一直没听到人声时宿主会到点自动关麦。这里把那个倒计时显出来，
   否则麦克风自己灭掉会像是出了故障。听到第一个字就不再倒计时。 */

let idleTimeout = 30;      // 由 ready 事件里的 voice_input.idle_timeout 覆盖
let idleTicker = null;

function stopIdleCountdown() {
  if (idleTicker) { clearInterval(idleTicker); idleTicker = null; }
  hearingIdle.textContent = '';
}

function startIdleCountdown() {
  stopIdleCountdown();
  if (!(idleTimeout > 0)) return;
  const deadline = Date.now() + idleTimeout * 1000;
  const tick = () => {
    const left = Math.ceil((deadline - Date.now()) / 1000);
    if (left <= 0) { stopIdleCountdown(); return; }
    hearingIdle.textContent = left + 's';
  };
  tick();
  idleTicker = setInterval(tick, 250);
}

function setListening(on) {
  micBtn.classList.toggle('on', on);
  hearing.classList.toggle('on', on);
  if (on) { hearingText.textContent = '…'; startIdleCountdown(); }
  else stopIdleCountdown();
}

/* 语音识别出来的那句，作为普通用户消息渲染 */
function addUserBubble(text) {
  hideEmpty();
  const msg = el('div', 'msg user');
  msg.appendChild(el('div', 'body', text));
  log.appendChild(msg);
  scroll(true);
}

document.addEventListener('keydown', (event) => {
  if (event.metaKey && event.shiftKey && event.key.toLowerCase() === 'n') {
    event.preventDefault();
    post({ action: 'new_session' });
  }
});

window.__jarvisFocusInput = () => input.focus();

/* ── 接收 ───────────────────────────────────────────── */

function ensureAssistant() {
  if (current) return current;
  hideEmpty();
  const msg = el('div', 'msg assistant');
  const reasoning = el('div', 'reasoning');
  reasoning.style.display = 'none';
  reasoning.addEventListener('click', () => reasoning.classList.toggle('open'));
  const body = el('div', 'body');
  const zh = el('div', 'zh');
  msg.appendChild(reasoning);
  msg.appendChild(body);
  msg.appendChild(zh);
  log.appendChild(msg);
  current = { msg, body, reasoning, zh };
  return current;
}

const toolNodes = new Map();

function handle(event) {
  switch (event.type) {

    case 'opacity':
      opacityRange.value = Math.round((event.value || 0) * 100);
      applyTint(event.value || 0);
      break;

    case 'connection':
      connected = !!event.connected;
      setStatus(connected ? '就绪' : '未连接', connected ? 'on' : '');
      if (!connected) { setBusy(false); setListening(false); current = null; }
      break;

    case 'ready': {
      connected = true;
      setStatus(event.configured ? (event.model || '就绪') : '缺 API Key',
                event.configured ? 'on' : '');
      if (event.voice_input && typeof event.voice_input.idle_timeout === 'number') {
        idleTimeout = event.voice_input.idle_timeout;
      }
      const memory = document.getElementById('empty-memory');
      if (memory && event.memory) {
        memory.textContent = event.memory.enabled && event.memory.count
          ? '长期记忆 ' + event.memory.count + ' 条'
          : '';
      }
      if (!event.configured) {
        const notice = addNotice('还没配 DeepSeek API Key，点这里打开配置文件', true);
        notice.style.cursor = 'pointer';
        notice.addEventListener('click', () => post({ action: 'open_config' }));
      }
      break;
    }

    /* 这里的 state 已由宿主合成过：收音 > 播报 > 大脑状态 */
    case 'state':
      if (event.state === 'listening') {
        setStatus('在听', 'busy');
      } else if (event.state === 'thinking' || event.state === 'speaking') {
        setBusy(true);
        setStatus(event.state === 'thinking' ? '思考中' : '回复中', 'busy');
      } else if (event.state === 'idle') {
        setStatus(connected ? '就绪' : '未连接', connected ? 'on' : '');
      }
      break;

    case 'listening':
      setListening(!!event.active);
      break;

    case 'transcript_partial':
      hearingText.textContent = event.text || '…';
      if (event.text) stopIdleCountdown();
      break;

    case 'transcript_final':
      setListening(false);
      addUserBubble(event.text);
      current = null;
      setBusy(true);
      break;

    case 'transcript_empty':
      setListening(false);
      addNotice('没听清');
      break;

    case 'speak_failed':
      addNotice('播报失败：' + (event.message || ''), true);
      break;

    case 'assistant_reasoning_delta': {
      const node = ensureAssistant().reasoning;
      node.style.display = '';
      node.textContent += event.text;
      scroll();
      break;
    }

    case 'assistant_delta':
      ensureAssistant().body.textContent += event.text;
      scroll();
      break;

    case 'assistant_delta_zh':
      ensureAssistant().zh.textContent += event.text;
      scroll();
      break;

    case 'assistant_done':
      current = null;
      break;

    case 'tool_started': {
      hideEmpty();
      const node = el('div', 'tool');
      node.appendChild(el('span', 'mark', '⚙'));
      node.appendChild(el('span', 'what', event.summary || event.name));
      log.appendChild(node);
      toolNodes.set(event.id, node);
      current = null;                 // 工具之后模型会另起一段
      scroll();
      break;
    }

    case 'tool_result': {
      const node = toolNodes.get(event.id);
      if (!node) break;
      node.classList.add(event.success ? 'ok' : 'fail');
      node.querySelector('.mark').textContent = event.success ? '✓' : '✗';
      if (!event.success && event.summary) node.querySelector('.what').textContent = event.summary;
      else if (event.ms) node.querySelector('.what').textContent += '  ' + event.ms + 'ms';
      toolNodes.delete(event.id);
      break;
    }

    case 'tool_confirm_request':
      renderConfirm(event);
      break;

    case 'turn_cancelled':
      setBusy(false);
      current = null;
      addNotice('已取消');
      break;

    case 'turn_done':
      setBusy(false);
      current = null;
      break;

    case 'session_reset':
      log.innerHTML = EMPTY_HTML;
      toolNodes.clear();
      current = null;
      setBusy(false);
      setListening(false);
      // 清的是这一轮的上下文，长期记忆还在——不写清楚会以为记忆也没了
      addNotice('上下文已清空（长期记忆保留）');
      break;

    case 'error':
      current = null;
      setBusy(false);
      addNotice(event.message || '未知错误', true);
      break;

    case 'log':
      addNotice(event.message || '');
      break;
  }
}

function renderConfirm(event) {
  hideEmpty();
  const card = el('div', 'confirm');
  card.appendChild(el('div', 'head', '需要确认 · ' + (event.risk || 'L2')));
  card.appendChild(el('div', 'what', event.summary || event.name));

  const args = event.arguments || {};
  if (Object.keys(args).length) {
    card.appendChild(el('pre', null, JSON.stringify(args, null, 2)));
  }

  const row = el('div', 'row');
  const yes = el('button', 'yes', '允许');
  const no  = el('button', null, '拒绝');
  row.appendChild(no);
  row.appendChild(yes);
  card.appendChild(row);

  const answer = (approved) => {
    post({ action: 'confirm', request_id: event.request_id, approved: approved });
    card.classList.add('done');
    card.querySelector('.head').textContent = approved ? '已允许' : '已拒绝';
  };
  yes.addEventListener('click', () => answer(true));
  no.addEventListener('click',  () => answer(false));

  log.appendChild(card);
  scroll(true);
}

window.__jarvisReceive = (raw) => {
  let event;
  try { event = JSON.parse(raw); } catch (e) { return; }
  try { handle(event); } catch (e) { console.error('handle failed', e, event); }
};

setStatus('连接中', '');
</script>
</body>
